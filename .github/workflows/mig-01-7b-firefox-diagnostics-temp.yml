name: MIG-01.7B temporary Firefox diagnostic preservation

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/mig-01-7b-firefox-diagnostics-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 2
      - name: Preserve primary Firefox large-migration failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/e2e-firefox-original-large-migration.mjs')
          source = path.read_text()
          old = """} finally {\n  if (driver) await driver.quit();\n  await Promise.all([closeServer(targetServer), closeServer(proxyServer)]);\n"""
          new = """} finally {\n  if (driver) {\n    try {\n      await driver.quit();\n    } catch (error) {\n      if (error?.name !== 'NoSuchSessionError') throw error;\n    }\n  }\n  await Promise.all([closeServer(targetServer), closeServer(proxyServer)]);\n"""
          if old not in source:
              raise SystemExit('expected Firefox large-migration cleanup block not found')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit diagnostic-preservation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/e2e-firefox-original-large-migration.mjs
          git diff --cached --quiet && { echo 'patch produced no diff'; exit 1; }
          git commit -m 'test: preserve Firefox migration primary failure [skip ci]'
          git push origin HEAD:feat/m8-profile-workflow
