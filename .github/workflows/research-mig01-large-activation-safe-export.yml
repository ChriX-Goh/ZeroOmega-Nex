name: Research MIG-01 Large Activation-Safe Original Export

on:
  push:
    branches:
      - research/mig01-large-runtime-export
    paths:
      - '.github/workflows/research-mig01-large-activation-safe-export.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ZeroOmega Nex research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout original ZeroOmega v3.5.0
        uses: actions/checkout@v4
        with:
          repository: zero-peak/ZeroOmega
          ref: v3.5.0
          path: original

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pinned original runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd original/omega-pac
          npm install --omit=dev --no-audit --no-fund
          cd ../omega-target
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund coffee-script@1.12.7

      - name: Generate activation-safe original-runtime capacity backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/mig01-large-runtime
          cd original/omega-target
          node <<'NODE'
          require('coffee-script/register');
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const childProcess = require('child_process');

          const Options = require('./src/options.coffee');
          const Storage = require('./src/storage.coffee');

          const baseSeedPath = path.resolve('../../fixtures/zeroomega-v2/large-representative.json');
          const outputDir = path.resolve('../../evidence/mig01-large-runtime');
          const transformedSeedPath = path.join(outputDir, 'large-persistent-representative.seed.json');
          const backupPath = path.join(outputDir, 'original-large-representative-v3.5.0.bak');
          const provenancePath = path.join(
            outputDir,
            'original-large-representative-v3.5.0.provenance.json',
          );
          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const byteLength = (value) => Buffer.byteLength(value, 'utf8');

          (async () => {
            const baseSeedContent = fs.readFileSync(baseSeedPath, 'utf8');
            const seed = JSON.parse(baseSeedContent);
            let rewrittenUrlWildcardConditions = 0;
            for (const [key, profile] of Object.entries(seed)) {
              if (!key.startsWith('+') || profile?.profileType !== 'SwitchProfile') continue;
              for (const [index, rule] of profile.rules.entries()) {
                if (rule?.condition?.conditionType !== 'UrlWildcardCondition') continue;
                const match = /^https:\/\/service-(\d+)\.example\.invalid\/api\/(\d+)\/\*$/u.exec(
                  rule.condition.pattern,
                );
                if (!match) throw new Error(`Unexpected URL wildcard seed shape: ${rule.condition.pattern}`);
                rule.condition = {
                  conditionType: 'HostWildcardCondition',
                  pattern: `capacity-service-${match[1]}-${String(index).padStart(3, '0')}.example.invalid`,
                };
                rewrittenUrlWildcardConditions += 1;
              }
            }
            if (rewrittenUrlWildcardConditions !== 64) {
              throw new Error(
                `Expected 64 target-dependent URL wildcard replacements, received ${rewrittenUrlWildcardConditions}`,
              );
            }
            const transformedSeedContent = JSON.stringify(seed);
            fs.writeFileSync(transformedSeedPath, transformedSeedContent);

            const instance = new Options(
              new Storage(),
              new Storage(),
              null,
              null,
              { applyProfile: () => Promise.resolve() },
            );
            await instance.initWithOptions(seed);
            await new Promise((resolve) => setTimeout(resolve, 100));
            const stable = instance.getAll();
            const backup = JSON.stringify(stable);

            const profiles = Object.entries(stable).filter(([key]) => key.startsWith('+'));
            const fixedProfiles = profiles.filter(([, profile]) => profile.profileType === 'FixedProfile');
            const switchProfiles = profiles.filter(([, profile]) => profile.profileType === 'SwitchProfile');
            const ruleListProfiles = profiles.filter(([, profile]) => profile.profileType === 'RuleListProfile');
            const switchRules = switchProfiles.reduce(
              (sum, [, profile]) => sum + (Array.isArray(profile.rules) ? profile.rules.length : 0),
              0,
            );
            const remainingUrlWildcardConditions = switchProfiles.reduce(
              (sum, [, profile]) =>
                sum +
                profile.rules.filter(
                  (rule) => rule?.condition?.conditionType === 'UrlWildcardCondition',
                ).length,
              0,
            );
            const ruleListEntries = ruleListProfiles.reduce((sum, [, profile]) => {
              if (typeof profile.ruleList !== 'string') return sum;
              return (
                sum +
                profile.ruleList.split(/\r?\n/u).filter((line) => {
                  const trimmed = line.trim();
                  return (
                    trimmed &&
                    !trimmed.startsWith('!') &&
                    !trimmed.startsWith(';') &&
                    !trimmed.startsWith('[')
                  );
                }).length
              );
            }, 0);

            if (
              profiles.length !== 36 ||
              fixedProfiles.length !== 24 ||
              switchProfiles.length !== 8 ||
              switchRules !== 1024 ||
              ruleListProfiles.length !== 4 ||
              ruleListEntries !== 1024 ||
              remainingUrlWildcardConditions !== 0
            ) {
              throw new Error(
                `Unexpected stable dimensions: ${JSON.stringify({ profiles: profiles.length, fixedProfiles: fixedProfiles.length, switchProfiles: switchProfiles.length, switchRules, ruleListProfiles: ruleListProfiles.length, ruleListEntries, remainingUrlWildcardConditions })}`,
              );
            }
            if (stable['-startupProfileName'] !== 'switch-00') {
              throw new Error('Original runtime changed startup profile unexpectedly');
            }
            if (
              !Array.isArray(stable['-quickSwitchProfiles']) ||
              stable['-quickSwitchProfiles'].join('|') !==
                'switch-00|switch-01|rules-00|rules-01|proxy-00|proxy-01|direct'
            ) {
              throw new Error('Original runtime changed Quick Switch unexpectedly');
            }
            if (/password|secret|token/i.test(backup)) {
              throw new Error('Generated backup unexpectedly contains a secret-like field name');
            }
            fs.writeFileSync(backupPath, backup);

            const originalCommit = childProcess
              .execFileSync('git', ['-C', '..', 'rev-parse', 'HEAD'], { encoding: 'utf8' })
              .trim();
            const nexCommit = childProcess
              .execFileSync('git', ['-C', '../..', 'rev-parse', 'HEAD'], { encoding: 'utf8' })
              .trim();
            const baseSeedBlob = childProcess
              .execFileSync(
                'git',
                ['-C', '../..', 'rev-parse', 'HEAD:fixtures/zeroomega-v2/large-representative.json'],
                { encoding: 'utf8' },
              )
              .trim();
            const provenance = {
              sourceRepository: 'zero-peak/ZeroOmega',
              sourceTag: 'v3.5.0',
              sourceCommit: originalCommit,
              runtimeModules: [
                'omega-target/src/options.coffee',
                'omega-target/src/storage.coffee',
                'omega-pac/src/profiles.coffee',
              ],
              generationMethod:
                'Deterministic Nex scale seed -> replace 64 target-dependent UrlWildcardCondition entries with exact HostWildcardCondition capacity entries -> original v3.5.0 Options.initWithOptions -> stable Options.getAll -> JSON.stringify, matching original IoCtrl export serialization',
              baseSeed: {
                path: 'fixtures/zeroomega-v2/large-representative.json',
                nexCommit,
                gitBlob: baseSeedBlob,
                sha256: sha256(baseSeedContent),
                bytes: byteLength(baseSeedContent),
                role: 'scale/structure seed only; not Corpus B owner data',
              },
              activationSafeTransformation: {
                rewrittenUrlWildcardConditions,
                replacementConditionType: 'HostWildcardCondition',
                reason:
                  'Capacity/restart evidence must isolate storage and activation scale from the separately classified target-dependent URL wildcard semantics.',
                transformedSeedSha256: sha256(transformedSeedContent),
                transformedSeedBytes: byteLength(transformedSeedContent),
              },
              dimensions: {
                profiles: profiles.length,
                fixedProfiles: fixedProfiles.length,
                switchProfiles: switchProfiles.length,
                switchRules,
                ruleListProfiles: ruleListProfiles.length,
                ruleListEntries,
                urlWildcardConditions: remainingUrlWildcardConditions,
              },
              stableBackup: {
                sha256: sha256(backup),
                bytes: byteLength(backup),
                schemaVersion: stable.schemaVersion,
                startupProfileName: stable['-startupProfileName'],
                quickSwitchProfiles: stable['-quickSwitchProfiles'],
              },
              capacityPurpose:
                'Repository-controlled MIG-01.5 storage/activation/restart capacity evidence; does not substitute for Corpus B and does not alter target-dependent compatibility classification.',
            };
            fs.writeFileSync(provenancePath, `${JSON.stringify(provenance, null, 2)}\n`);
            console.log(JSON.stringify(provenance, null, 2));
          })().catch((error) => {
            console.error(error?.stack ?? error);
            process.exitCode = 1;
          });
          NODE

      - name: Commit activation-safe runtime evidence on research branch
        shell: bash
        run: |
          set -euo pipefail
          cp evidence/mig01-large-runtime/original-large-representative-v3.5.0.bak \
            fixtures/zeroomega-v2/original-large-representative-v3.5.0.bak
          cp evidence/mig01-large-runtime/original-large-representative-v3.5.0.provenance.json \
            fixtures/zeroomega-v2/original-large-representative-v3.5.0.provenance.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fixtures/zeroomega-v2/original-large-representative-v3.5.0.bak \
            fixtures/zeroomega-v2/original-large-representative-v3.5.0.provenance.json
          git diff --cached --check
          git commit -m 'research: capture activation-safe original large export'
          git push origin HEAD:research/mig01-large-runtime-export

      - name: Upload activation-safe original-runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: mig01-original-large-activation-safe-v3.5.0
          path: evidence/mig01-large-runtime
          if-no-files-found: error
