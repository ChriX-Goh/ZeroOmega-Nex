name: Format Active Parity Index Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-active-parity-index-probe.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format active parity index
        run: pnpm exec prettier --write docs/ACTIVE_PARITY_AUDIT_INDEX.md

      - name: Upload formatted index
        uses: actions/upload-artifact@v4
        with:
          name: formatted-active-parity-index
          path: docs/ACTIVE_PARITY_AUDIT_INDEX.md
          if-no-files-found: error
