name: Research MIG-01 Large Baseline Fix

on:
  push:
    branches:
      - research/mig01-large-runtime-export
    paths:
      - '.github/workflows/research-mig01-large-baseline-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-large-runtime-export
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Patch isolated baseline
        run: node scripts/research-patch-large-reimport-baseline.mjs
      - name: Format and verify
        run: |
          pnpm exec prettier --write scripts/e2e-chromium-original-large-migration.mjs scripts/e2e-firefox-original-large-migration.mjs
          pnpm exec prettier --check scripts/e2e-chromium-original-large-migration.mjs scripts/e2e-firefox-original-large-migration.mjs package.json
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/e2e-chromium-original-large-migration.mjs scripts/e2e-firefox-original-large-migration.mjs
          git diff --cached --check
          git commit -m 'research: isolate large reimport baseline'
          git push origin HEAD:research/mig01-large-runtime-export
