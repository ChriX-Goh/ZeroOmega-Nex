name: Verify Milestone 8 Browser Snapshot Rollback

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Correct browser snapshot rollback tests
        run: python .github/scripts/fix-m8-browser-snapshot-rollback-tests.py

      - name: Format browser snapshot rollback slice
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/background.ts \
            apps/extension/src/lib/profile-workflow-runtime.ts \
            apps/extension/src/lib/snapshot-rollback-runtime.ts \
            apps/extension/src/lib/snapshot-rollback-runtime.test.ts

      - name: Verify browser snapshot rollback slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @zeroomega-nex/extension check
            pnpm --filter @zeroomega-nex/profile-workflow check
            pnpm exec vitest run \
              apps/extension/src/lib/snapshot-rollback-runtime.test.ts \
              packages/profile-workflow/src/snapshot-rollback.test.ts \
              packages/profile-workflow/src/commands-rollback.test.ts
          } 2>&1 | tee m8-browser-snapshot-rollback.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-browser-snapshot-rollback-diagnostics
          path: m8-browser-snapshot-rollback.log
          if-no-files-found: warn

      - name: Commit browser snapshot rollback integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/entrypoints/background.ts \
            apps/extension/src/lib/profile-workflow-runtime.ts \
            apps/extension/src/lib/snapshot-rollback-runtime.ts \
            apps/extension/src/lib/snapshot-rollback-runtime.test.ts
          git commit -m 'feat: integrate verified browser snapshot rollback'
          git push origin HEAD:feat/m8-profile-workflow
