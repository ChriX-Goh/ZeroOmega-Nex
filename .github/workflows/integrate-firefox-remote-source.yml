name: Integrate Firefox remote sources

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-firefox-remote-source.yml
      - .github/patches/apply-firefox-remote-source.py
      - .github/patches/fix-firefox-remote-source-guard.py
      - .github/patches/fix-firefox-remote-source-null.py
      - .github/patches/fix-firefox-pac-create-wait.py
      - .github/patches/fix-readonly-source-status-lock.py

permissions:
  contents: write

concurrency:
  group: integrate-firefox-remote-sources-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Firefox remote-source slice
        run: |
          set -o pipefail
          {
            python .github/patches/apply-firefox-remote-source.py
            python .github/patches/fix-firefox-remote-source-guard.py
            python .github/patches/fix-firefox-remote-source-null.py
            python .github/patches/fix-firefox-pac-create-wait.py
            python .github/patches/fix-readonly-source-status-lock.py
          } 2>&1 | tee firefox-remote-source-apply.log

      - name: Format product slice
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee firefox-remote-source-format.log

      - name: Generate classified locale inventory
        run: |
          set -o pipefail
          pnpm locale:inventory 2>&1 | tee firefox-remote-source-inventory.log
          pnpm exec prettier --write docs/LOCALE_INVENTORY.json

      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee firefox-remote-source-verify.log

      - name: Show Firefox version
        run: firefox --version

      - name: Build Firefox E2E candidate
        run: pnpm build:firefox

      - name: Run Firefox remote-source regression
        run: |
          set -o pipefail
          pnpm test:e2e:firefox 2>&1 | tee firefox-remote-source-e2e.log

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-remote-sources-${{ github.run_id }}
          path: firefox-remote-source-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-firefox-remote-source.yml
          rm -f \
            .github/patches/apply-firefox-remote-source.py \
            .github/patches/fix-firefox-remote-source-guard.py \
            .github/patches/fix-firefox-remote-source-null.py \
            .github/patches/fix-firefox-pac-create-wait.py \
            .github/patches/fix-readonly-source-status-lock.py \
            firefox-remote-source-apply.log \
            firefox-remote-source-format.log \
            firefox-remote-source-inventory.log \
            firefox-remote-source-verify.log \
            firefox-remote-source-e2e.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: verify Firefox remote source downloads"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
