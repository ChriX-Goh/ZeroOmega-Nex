name: Audit Original ZeroOmega UI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout ZeroOmega Nex
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          path: nex

      - name: Checkout original ZeroOmega v3.5.0
        uses: actions/checkout@v4
        with:
          repository: zero-peak/ZeroOmega
          ref: v3.5.0
          path: original

      - name: Capture original UI evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/original-source
          cp -R original/omega-web/src evidence/original-source/omega-web-src
          cp -R original/omega-locales/en_US evidence/original-source/locale-en_US
          cp -R original/omega-locales/zh_CN evidence/original-source/locale-zh_CN
          cp -R original/omega-locales/zh_TW evidence/original-source/locale-zh_TW
          cp -R original/omega-locales/zh_Hant evidence/original-source/locale-zh_Hant
          cp -R original/omega-target/src evidence/original-source/omega-target-src
          cp -R original/omega-target-chromium-extension/src evidence/original-source/chromium-target-src
          find original/omega-web/src -type f | sort > evidence/original-ui-files.txt
          find original/omega-locales/{en_US,zh_CN,zh_TW,zh_Hant} -type f | sort > evidence/original-locale-files.txt
          grep -RInE "profileType|FixedProfile|SwitchProfile|RuleListProfile|PacProfile|VirtualProfile|autoDetect|export|import|backup|restore" \
            original/omega-web/src original/omega-target/src original/omega-target-chromium-extension/src \
            > evidence/original-ui-symbols.txt || true
          tar -czf evidence/original-ui-source-v3.5.0.tar.gz -C evidence/original-source .

      - name: Upload original UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: original-zeroomega-ui-evidence-v3.5.0
          path: evidence
          if-no-files-found: error
