name: Research Firefox service version gate

on:
  push:
    branches:
      - 'feat/m8-profile-workflow'
    paths:
      - '.github/workflows/research-firefox-version-gate.yml'

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Use shared Firefox service gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = ".setFirefoxService(new firefox.ServiceBuilder().addArguments('--allow-system-access'))"
          replacement = '.setFirefoxService(firefoxService())'
          import_needle = "import firefox from 'selenium-webdriver/firefox.js';"
          import_replacement = import_needle + "\n\nimport { firefoxService } from './firefox-service.mjs';"
          targets = []

          for path in sorted(Path('scripts').glob('*firefox*.mjs')):
              if path.name == 'firefox-service.mjs':
                  continue
              text = path.read_text()
              if service not in text:
                  continue
              if text.count(service) != 1 or text.count(import_needle) != 1:
                  raise SystemExit(f'{path}: unexpected service/import shape')
              text = text.replace(service, replacement)
              text = text.replace(import_needle, import_replacement)
              path.write_text(text)
              targets.append(str(path))

          if len(targets) != 9:
              raise SystemExit(f'Expected 9 Firefox launch scripts, found {len(targets)}: {targets}')

          print('Version-gated Firefox scripts:')
          for path in targets:
              print(f'  {path}')
          PY

          pnpm exec prettier --write scripts/firefox-service.mjs scripts/*firefox*.mjs
          git diff --check
          git diff --stat

      - name: Commit adaptation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/firefox-service.mjs scripts/*firefox*.mjs
          git commit -m 'test: share version-gated Firefox service'
          git push origin HEAD:feat/m8-profile-workflow
