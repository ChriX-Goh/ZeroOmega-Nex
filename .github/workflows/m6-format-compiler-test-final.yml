name: M6 format compiler test final

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/m6-pac-compiler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m6-pac-compiler
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Format test and remove workflow
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/pac-compiler/src/compiler.test.ts
          rm .github/workflows/m6-format-compiler-test-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/pac-compiler/src/compiler.test.ts .github/workflows/m6-format-compiler-test-final.yml
          git commit -m "style(pac): format corrected compiler test"
          git push origin HEAD:feat/m6-pac-compiler
