name: Correct Switch add-rule semantics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/correct-switch-add-rule-semantics.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply source-backed correction
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              target.write_text(source.replace(old, new))

          operations = 'packages/profile-workflow/src/switch-operations.ts'
          replace_once(
              operations,
              """  const rule: SwitchRule = {
                id: ruleId,
                condition: createDefaultSwitchCondition(conditionKind),
                route: structuredClone(profile.defaultRoute),
              };
              if (draft.settings.interface.addConditionsToBottom) profile.rules.push(rule);
              else profile.rules.unshift(rule);
          """,
              """  const template = profile.rules.at(-1);
              const rule: SwitchRule =
                template === undefined
                  ? {
                      id: ruleId,
                      condition: createDefaultSwitchCondition(conditionKind),
                      route: structuredClone(profile.defaultRoute),
                    }
                  : {
                      ...structuredClone(template),
                      id: ruleId,
                    };
              profile.rules.push(rule);
          """,
          )

          tests = 'packages/profile-workflow/src/switch-operations.test.ts'
          replace_once(
              tests,
              """  it('uses the default result profile and respects top-or-bottom insertion settings', () => {
                const ids = deterministicIds();
                const created = createSwitchProfileDraft(workflowFixture(), ids);
                const profile = switchProfile(created.draft, created.profileId);
                profile.defaultRoute = { kind: 'system' };

                const first = addSwitchRuleDraft(created.draft, created.profileId, ids, 'host-wildcard');
                expect(switchProfile(first.draft, created.profileId).rules[0]?.route).toEqual({
                  kind: 'system',
                });

                first.draft.settings.interface.addConditionsToBottom = false;
                const second = addSwitchRuleDraft(first.draft, created.profileId, ids, 'url-wildcard');
                expect(switchProfile(second.draft, created.profileId).rules.map((rule) => rule.id)).toEqual([
                  second.ruleId,
                  first.ruleId,
                ]);
              });
          """,
              """  it('appends editor-added rules and copies the previous rule after the first row', () => {
                const ids = deterministicIds();
                const created = createSwitchProfileDraft(workflowFixture(), ids);
                const profile = switchProfile(created.draft, created.profileId);
                profile.defaultRoute = { kind: 'system' };

                const first = addSwitchRuleDraft(created.draft, created.profileId, ids, 'host-wildcard');
                const firstProfile = switchProfile(first.draft, created.profileId);
                expect(firstProfile.rules[0]?.route).toEqual({ kind: 'system' });
                firstProfile.rules[0]!.route = { kind: 'direct' };
                firstProfile.rules[0]!.note = 'template note';

                first.draft.settings.interface.addConditionsToBottom = false;
                const second = addSwitchRuleDraft(first.draft, created.profileId, ids, 'url-wildcard');
                const secondProfile = switchProfile(second.draft, created.profileId);

                expect(secondProfile.rules.map((rule) => rule.id)).toEqual([
                  first.ruleId,
                  second.ruleId,
                ]);
                expect(secondProfile.rules[1]).toMatchObject({
                  condition: secondProfile.rules[0]?.condition,
                  route: { kind: 'direct' },
                  note: 'template note',
                });
                expect(secondProfile.rules[1]).not.toBe(secondProfile.rules[0]);
              });
          """,
          )

          guard = 'scripts/validate-ui-compatibility.mjs'
          replace_once(
              guard,
              "const runtimePath = 'apps/extension/src/lib/profile-workflow-runtime.ts';\n",
              "const runtimePath = 'apps/extension/src/lib/profile-workflow-runtime.ts';\nconst switchOperationsPath = 'packages/profile-workflow/src/switch-operations.ts';\n",
          )
          replace_once(
              guard,
              """  profileOperations,
                runtime,
              ] = await Promise.all([
          """,
              """  profileOperations,
                runtime,
                switchOperations,
              ] = await Promise.all([
          """,
          )
          replace_once(
              guard,
              """  readFile(profileOperationsPath, 'utf8'),
                readFile(runtimePath, 'utf8'),
              ]);
          """,
              """  readFile(profileOperationsPath, 'utf8'),
                readFile(runtimePath, 'utf8'),
                readFile(switchOperationsPath, 'utf8'),
              ]);
          """,
          )
          guard_marker = """  [
                profileOperations.includes('proxyByScheme: {}') &&
          """
          guard_requirement = """  [
                switchOperations.includes('const template = profile.rules.at(-1);') &&
                  switchOperations.includes('...structuredClone(template)') &&
                  switchOperations.includes('profile.rules.push(rule);') &&
                  !switchOperations
                    .slice(
                      switchOperations.indexOf('export function addSwitchRuleDraft'),
                      switchOperations.indexOf('export function duplicateSwitchRuleDraft'),
                    )
                    .includes('addConditionsToBottom'),
                'Options-added Switch rules must append and copy the previous rule; the Popup insertion preference must not control the editor button.',
              ],
          """
          source = Path(guard).read_text()
          if source.count(guard_marker) != 1:
              raise SystemExit(f'guard marker mismatch: {source.count(guard_marker)}')
          Path(guard).write_text(source.replace(guard_marker, guard_requirement + guard_marker))

          knowledge = 'docs/ORIGINAL_KNOWLEDGE_GRAPH.md'
          replace_once(
              knowledge,
              """- 条件类型、帮助、限制提示和字段应由原版条件模型驱动。
              - URL 条件有完整 URL 能力限制警告。
              - 新增条件插入顶部或底部由界面设置决定。
          """,
              """- 条件类型、帮助、限制提示和字段应由原版条件模型驱动。
              - URL 条件有完整 URL 能力限制警告。
              - Options 编辑器的“添加条件”始终追加到底部：第一条使用默认情景模式，之后复制最后一条规则作为模板。
              - `-addConditionsToBottom` 只控制 Popup/当前站点条件注入使用 `push` 还是 `unshift`，不得复用于编辑器按钮。
          """,
          )
          replace_once(
              knowledge,
              """- 已提供原生拖动 handle 与键盘 Up/Down 后备；新增条件按 `addConditionsToBottom` 插入顶部或底部，并继承表格尾部默认路由。
              - 图形/源码双向编辑、附属 RuleList、原版 locale 文本和浏览器拖放 E2E 尚未完成，因此 Switch 整体仍是 `PARTIAL`。
          """,
              """- 已提供原生拖动 handle 与键盘 Up/Down 后备；编辑器新增规则固定追加，第一条使用默认路由，后续复制最后一条规则。
              - 原版复制文本条件后会清空 `pattern`，但当前工作流仍要求 Draft 始终通过完整语义校验；该差异必须在“可保存无效 Draft、Apply 严格拒绝”的后续切片解决，不能用示例值伪装完成。
              - 图形/源码双向编辑、附属 RuleList、原版 locale 文本和浏览器拖放 E2E 尚未完成，因此 Switch 整体仍是 `PARTIAL`。
          """,
          )

          audit = Path('docs/UI_AUDIT_MATRIX.md')
          lines = audit.read_text().splitlines()
          replacements = {
              '| D-10 |': '| D-10 | 添加条件位置     | `switch_profile.coffee`、`options.coffee` | 编辑器固定追加；Popup 插入位置由设置决定 | MUST_MATCH | PARTIAL  | PARTIAL | 编辑器现固定 push 并复制最后一条；Popup 当前站点注入尚未实现 | 实现 Popup 条件注入 |',
              '| D-11 |': '| D-11 | 默认情景模式行   | `profile_switch.jade`、`switch_profile.coffee` | 表格尾部独立默认行；首条规则使用默认结果 | MUST_MATCH | DONE     | PARTIAL | Default profile 已恢复；首条规则使用默认路由，后续复制上一条结果 | locale 与视觉巡查 |',
          }
          seen = set()
          for index, line in enumerate(lines):
              for prefix, replacement in replacements.items():
                  if line.startswith(prefix):
                      lines[index] = replacement
                      seen.add(prefix)
          if seen != set(replacements):
              raise SystemExit(f'missing audit rows: {set(replacements) - seen}')
          history_anchor = '| 2026-07-26 | Switch 首切片恢复紧凑规则表、条件分组帮助、拖序/键盘排序、备注列、默认路由行与新增位置语义 |'
          if history_anchor in lines:
              lines.insert(
                  lines.index(history_anchor) + 1,
                  '| 2026-07-26 | 源码复核纠正新增规则语义：编辑器固定追加并复制上一条；顶部/底部设置仅属于 Popup 条件注入 |',
              )
          audit.write_text('\n'.join(lines) + '\n')

          status_path = 'docs/MILESTONE_8_STATUS.md'
          replace_once(
              status_path,
              """- New rules inherit the Switch profile's current default route and honor `addConditionsToBottom` for top-or-bottom insertion.
          """,
              """- The Options editor always appends a new rule. The first rule uses the current default route; later rows copy the final rule as their template.
              - `addConditionsToBottom` belongs to Popup/current-site condition injection and no longer changes the Options editor button.
          """,
          )
          replace_once(
              status_path,
              """- source-backed blank/default values for newly added Switch conditions,
          """,
              """- source-backed incomplete-condition drafts: original text rules clear the copied pattern, while Nex still requires every Draft to be semantically valid,
              - Popup/current-site condition injection and its `addConditionsToBottom` ordering setting,
          """,
          )
          PY
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            packages/profile-workflow/src/switch-operations.ts \
            packages/profile-workflow/src/switch-operations.test.ts \
            scripts/validate-ui-compatibility.mjs \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            docs/MILESTONE_8_STATUS.md
      - name: Verify repository
        run: pnpm verify
      - name: Clean generated and temporary files
        run: |
          rm -rf browser-builds browser-builds.tar.gz
          rm -f .github/workflows/correct-switch-add-rule-semantics.yml
          git diff --check
      - name: Commit verified correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: align Switch editor add-rule semantics'
          git push origin HEAD:feat/m8-profile-workflow
