name: Sync Switch Direct toolbar knowledge

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sync-switch-direct-toolbar-knowledge.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Synchronize and verify
        run: |
          python scripts/fix-switch-direct-knowledge-checkpoint.py
          python scripts/sync-switch-direct-toolbar-knowledge.py
          pnpm exec prettier --write \
            docs/MILESTONE_8_VERIFICATION_HEAD.md \
            docs/MILESTONE_8_SESSION_8_CHECKPOINT.md \
            docs/MILESTONE_8_STATUS.md \
            docs/ACTIVE_PARITY_AUDIT_INDEX.md \
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md \
            docs/ORIGINAL_NEX_DELIVERY_KNOWLEDGE_GRAPH.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md
          pnpm verify
      - name: Commit ordinary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/MILESTONE_8_VERIFICATION_HEAD.md \
            docs/MILESTONE_8_SESSION_8_CHECKPOINT.md \
            docs/MILESTONE_8_STATUS.md \
            docs/ACTIVE_PARITY_AUDIT_INDEX.md \
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md \
            docs/ORIGINAL_NEX_DELIVERY_KNOWLEDGE_GRAPH.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md
          git rm -f \
            scripts/sync-switch-direct-toolbar-knowledge.py \
            scripts/fix-switch-direct-knowledge-checkpoint.py
          git commit -m 'docs: record exact Switch to Direct toolbar traces'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
