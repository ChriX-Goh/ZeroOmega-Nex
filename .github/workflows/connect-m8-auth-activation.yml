name: Connect Milestone 8 Authentication Activation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  connect:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Connect authentication activation
        run: python .github/scripts/connect-m8-auth-activation.py

      - name: Format authentication activation slice
        run: |
          pnpm exec prettier --write \
            apps/extension/src/lib/profile-workflow-activation.ts \
            apps/extension/src/lib/profile-workflow-activation.test.ts

      - name: Verify authentication activation slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @zeroomega-nex/extension check
            pnpm exec vitest run apps/extension/src/lib/profile-workflow-activation.test.ts
          } 2>&1 | tee m8-auth-activation.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-auth-activation-diagnostics
          path: m8-auth-activation.log
          if-no-files-found: warn

      - name: Commit authentication activation integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/lib/profile-workflow-activation.ts \
            apps/extension/src/lib/profile-workflow-activation.test.ts
          git commit -m 'feat: transact authentication with proxy activation'
          git push origin HEAD:feat/m8-profile-workflow
