name: Integrate sync scope decisions

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-sync-scope-decisions.yml
      - .github/patches/apply-sync-scope-decisions.py

permissions:
  contents: write

concurrency:
  group: integrate-sync-scope-decisions-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply synchronization scope decisions
        run: python .github/patches/apply-sync-scope-decisions.py

      - name: Format and verify repository
        run: |
          pnpm exec prettier --write \
            docs/DECISIONS.md \
            docs/UI_AUDIT_MATRIX.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/MILESTONE_8_STATUS.md \
            docs/MILESTONE_STATUS.md \
            scripts/validate-parity-docs.mjs
          pnpm verify

      - name: Commit verified decision slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-sync-scope-decisions.yml
          rm -f .github/patches/apply-sync-scope-decisions.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: decide remote synchronization scope"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
