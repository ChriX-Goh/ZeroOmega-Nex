name: Apply original toolbar target contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-original-toolbar-target-contract.yml
      - scripts/apply-original-toolbar-target-contract.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Prepare exact one-shot applicator
        run: |
          sed -i 's/_execute_action/_execute_browser_action/g' scripts/apply-original-toolbar-target-contract.py
          python - <<'PY'
          from pathlib import Path

          applicator_path = Path('scripts/apply-original-toolbar-target-contract.py')
          applicator = applicator_path.read_text(encoding='utf-8')
          section_start = applicator.index('## Session 8 Toolbar Contract Correction')
          table_start = applicator.index('| ID   | Area', section_start)
          section_end = applicator.index('\n\nThis section supersedes', table_start)
          replacement = """| ID   | 界面/功能                         | 原版源码                                                        | 原版布局与行为                                                                       | 分类       | Nex 状态 | 翻译     | 证据/问题                                                | 下一步                         |
| ---- | --------------------------------- | --------------------------------------------------------------- | ------------------------------------------------------------------------------------ | ---------- | -------- | -------- | -------------------------------------------------------- | ------------------------------ |
| H-13 | 编译后工具栏本地化契约            | `AUDIT_EVIDENCE_01E_ORIGINAL_TARGET_CONSTANTS.md`                | 保留默认、结果、细节词条及三参数占位符顺序                                           | MUST_MATCH | DONE     | COMPLETE | 编译包证据、三套 locale 与本地化校验                     | 保持编译词条和三参数调用回归   |
| J-06 | 目标 Action manifest 默认契约     | Chromium/Firefox v3.5.0 官方包及运行证据                         | 保留目标 Popup、默认标题、16/19/24/32 回退图标、快捷键和 `tabs` 权限                 | MUST_MATCH | PARTIAL  | N/A      | 构建 manifest 审计已覆盖；每标签页运行时协调仍未接入      | 完成真实 Action 运行时绑定     |
| J-07 | 每标签页 Action 运行时收敛        | 工具栏源码/运行矩阵与 `DELIVERY_ORDER_01_TOOLBAR_STATE.md`       | 标签页、Profile、Inspect、临时规则和外部控制统一进入一个协调器                       | MUST_MATCH | MISSING  | N/A      | 隔离协调器已验证；真实 Chromium/Firefox 绑定和用户 PASS 缺失 | 完成双浏览器状态迁移与用户验收 |"""
          applicator_path.write_text(
              applicator[:table_start] + replacement + applicator[section_end:],
              encoding='utf-8',
          )

          index_path = Path('docs/ACTIVE_PARITY_AUDIT_INDEX.md')
          index = index_path.read_text(encoding='utf-8')
          needle = '`AUDIT_EVIDENCE_01D_ORIGINAL_FIREFOX_RUNTIME.md`'
          sentinel = '`__SESSION8_KEEP_FIREFOX_RUNTIME_EVIDENCE__`'
          first = index.find(needle)
          if first < 0:
              raise SystemExit('active evidence target is missing')
          split = first + len(needle)
          tail = index[split:]
          if tail.count(needle) != 2:
              raise SystemExit(f'expected two non-target Firefox evidence references, found {tail.count(needle)}')
          index_path.write_text(index[:split] + tail.replace(needle, sentinel), encoding='utf-8')
          PY

      - name: Apply exact target contract
        run: |
          python scripts/apply-original-toolbar-target-contract.py
          python - <<'PY'
          from pathlib import Path

          index_path = Path('docs/ACTIVE_PARITY_AUDIT_INDEX.md')
          index = index_path.read_text(encoding='utf-8')
          sentinel = '`__SESSION8_KEEP_FIREFOX_RUNTIME_EVIDENCE__`'
          if index.count(sentinel) != 2:
              raise SystemExit(f'expected two protected Firefox evidence references, found {index.count(sentinel)}')
          index_path.write_text(
              index.replace(sentinel, '`AUDIT_EVIDENCE_01D_ORIGINAL_FIREFOX_RUNTIME.md`'),
              encoding='utf-8',
          )

          validator_path = Path('scripts/validate-ui-compatibility.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          start_marker = "    manifest.includes(\"default_locale: 'en'\") &&"
          end_marker = "    'The browser manifest must expose localized metadata and toolbar icons at all standard sizes.',"
          if validator.count(start_marker) != 1 or validator.count(end_marker) != 1:
              raise SystemExit(
                  f'UI manifest guard markers: start={validator.count(start_marker)} end={validator.count(end_marker)}'
              )
          start = validator.index(start_marker)
          end = validator.index(end_marker, start) + len(end_marker)
          replacement = """    manifest.includes(\"default_locale: 'en'\") &&
              manifest.includes('    icons,') &&
              ['16.png', '32.png', '48.png', '128.png'].every((entry) => manifest.includes(entry)) &&
              manifest.includes('default_icon: originalActionIcons') &&
              [
                'original-action-16.png',
                'original-action-19.png',
                'original-action-24.png',
                'original-action-32.png',
              ].every((entry) => manifest.includes(entry)),
            'The browser manifest must keep standard install icons and the original Action fallback sizes.',"""
          validator_path.write_text(validator[:start] + replacement + validator[end:], encoding='utf-8')
          PY
          pnpm locale:inventory
          pnpm exec prettier --write \
            apps/extension/public/_locales/en/messages.json \
            apps/extension/public/_locales/zh_CN/messages.json \
            apps/extension/public/_locales/zh_TW/messages.json \
            apps/extension/wxt.config.ts \
            scripts/inspect-manifests.mjs \
            scripts/validate-ui-compatibility.mjs \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            docs/ACTIVE_PARITY_AUDIT_INDEX.md \
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md \
            docs/LOCALE_INVENTORY.json

      - name: Verify target contract before commit
        run: pnpm verify

      - name: Commit target contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/extension/public/_locales \
            apps/extension/wxt.config.ts \
            scripts/inspect-manifests.mjs \
            scripts/validate-ui-compatibility.mjs \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            docs/ACTIVE_PARITY_AUDIT_INDEX.md \
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md \
            docs/LOCALE_INVENTORY.json
          git commit -m 'feat: restore original toolbar target contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
