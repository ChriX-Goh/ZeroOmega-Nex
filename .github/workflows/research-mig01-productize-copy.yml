name: Research MIG-01.7 Productize Copy

on:
  push:
    branches:
      - research/mig01-semantic-productize
    paths:
      - '.github/workflows/research-mig01-productize-copy.yml'

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-semantic-productize
          fetch-depth: 0
      - name: Copy proven browser semantic-chain changes
        run: |
          git fetch origin research/mig01-semantic-consolidation
          git checkout origin/research/mig01-semantic-consolidation -- \
            scripts/e2e-chromium-original-migration.mjs \
            scripts/e2e-firefox-original-migration.mjs \
            scripts/e2e-chromium-original-large-migration.mjs \
            scripts/e2e-firefox-original-large-migration.mjs
      - name: Commit copied evidence chain
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/e2e-chromium-original-migration.mjs scripts/e2e-firefox-original-migration.mjs scripts/e2e-chromium-original-large-migration.mjs scripts/e2e-firefox-original-large-migration.mjs
          git diff --cached --check
          git commit -m 'test: add browser semantic reimport evidence'
          git push origin HEAD:research/mig01-semantic-productize
