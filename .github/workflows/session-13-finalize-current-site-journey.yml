name: Session 13 Current Site Finalization

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/session-13-finalize-current-site-journey.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout active product branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final bounded-slice status
        run: |
          python scripts/session-13-finalize-current-site-journey.py
          pnpm exec prettier --write \
            docs/SESSION_13_KNOWLEDGE_GRAPH.md \
            docs/AUDIT_EVIDENCE_02S_POPUP_POLICY_OWNERSHIP.md \
            docs/AUDIT_EVIDENCE_02R_POPUP_OWNERSHIP_EXTERNAL.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md
          git diff --check
          pnpm validate:parity-docs
          pnpm check

      - name: Commit canonical finalization without patch machinery
        run: |
          git restore .github/workflows/session-13-finalize-current-site-journey.yml
          git restore scripts/session-13-finalize-current-site-journey.py
          git config user.name 'zeroomega-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            docs/SESSION_13_KNOWLEDGE_GRAPH.md \
            docs/AUDIT_EVIDENCE_02S_POPUP_POLICY_OWNERSHIP.md \
            docs/AUDIT_EVIDENCE_02R_POPUP_OWNERSHIP_EXTERNAL.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: close Session 13 current-site Popup journey'
          git push origin HEAD:feat/m8-profile-workflow
