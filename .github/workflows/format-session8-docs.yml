name: Format Session 8 checkpoint docs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-session8-docs.yml
      - docs/ACTIVE_PARITY_AUDIT_INDEX.md
      - docs/AUDIT_EVIDENCE_01D_ORIGINAL_FIREFOX_RUNTIME.md
      - docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Format checkpoint documents
        run: |
          pnpm exec prettier --write \
            docs/ACTIVE_PARITY_AUDIT_INDEX.md \
            docs/AUDIT_EVIDENCE_01D_ORIGINAL_FIREFOX_RUNTIME.md \
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md

      - name: Upload formatted documents
        uses: actions/upload-artifact@v4
        with:
          name: session8-formatted-checkpoint-${{ github.event.pull_request.head.sha }}
          path: |
            docs/ACTIVE_PARITY_AUDIT_INDEX.md
            docs/AUDIT_EVIDENCE_01D_ORIGINAL_FIREFOX_RUNTIME.md
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md
          if-no-files-found: error
          retention-days: 7
