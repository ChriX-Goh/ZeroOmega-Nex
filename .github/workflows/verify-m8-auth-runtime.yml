name: Verify Milestone 8 Authentication Runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format authentication runtime slice
        run: |
          pnpm exec prettier --write \
            apps/extension/src/lib/proxy-auth-runtime.ts \
            apps/extension/src/lib/proxy-auth-runtime-manager.test.ts

      - name: Verify authentication runtime slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @zeroomega-nex/extension check
            pnpm exec vitest run apps/extension/src/lib/proxy-auth-runtime-manager.test.ts
          } 2>&1 | tee m8-auth-runtime.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-auth-runtime-diagnostics
          path: m8-auth-runtime.log
          if-no-files-found: warn

      - name: Commit authentication runtime slice
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/lib/proxy-auth-runtime.ts \
            apps/extension/src/lib/proxy-auth-runtime-manager.test.ts
          git commit -m 'style: format authentication runtime transaction'
          git push origin HEAD:feat/m8-profile-workflow
