name: M7 minimize lockfile

on:
  push:
    branches:
      - feat/m7-browser-adapters

permissions:
  contents: write

jobs:
  minimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-browser-adapters
          fetch-depth: 0
      - name: Restore main lockfile and add only workspace importer
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- pnpm-lock.yaml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pnpm-lock.yaml')
          text = path.read_text()
          marker = '\n  packages/core-contracts:\n'
          block = '''\n  packages/browser-adapters:\n    dependencies:\n      '@zeroomega-nex/pac-compiler':\n        specifier: workspace:*\n        version: link:../pac-compiler\n      '@zeroomega-nex/profile-spec':\n        specifier: workspace:*\n        version: link:../profile-spec\n    devDependencies:\n      typescript:\n        specifier: 5.9.3\n        version: 5.9.3\n'''
          if marker not in text:
              raise SystemExit('lockfile importer marker not found')
          path.write_text(text.replace(marker, block + marker, 1))
          PY
          rm .github/workflows/m7-minimize-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml .github/workflows/m7-minimize-lock.yml
          git diff --cached --quiet || git commit -m "build: minimize browser adapter lockfile change"
          git push origin HEAD:feat/m7-browser-adapters
