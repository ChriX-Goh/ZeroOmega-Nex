name: Format Original Toolbar Evidence Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-original-toolbar-evidence-probe.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format original Toolbar evidence files
        run: |
          pnpm exec prettier --write \
            scripts/audit-original-toolbar-scenarios.mjs \
            scripts/original-toolbar-evidence-scenarios.mjs \
            .github/workflows/original-toolbar-evidence.yml

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-original-toolbar-evidence-files
          path: |
            scripts/audit-original-toolbar-scenarios.mjs
            scripts/original-toolbar-evidence-scenarios.mjs
            .github/workflows/original-toolbar-evidence.yml
          if-no-files-found: error
