name: Format Milestone 8 Import Acceptance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format import acceptance slice
        run: |
          pnpm exec prettier --write \
            packages/profile-workflow/src/import-acceptance.ts \
            packages/profile-workflow/src/import-acceptance.test.ts \
            packages/profile-workflow/src/index.ts

      - name: Verify import acceptance slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @zeroomega-nex/profile-workflow check
            pnpm exec vitest run packages/profile-workflow/src/import-acceptance.test.ts
          } 2>&1 | tee m8-import-acceptance.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-import-acceptance-diagnostics
          path: m8-import-acceptance.log
          if-no-files-found: warn

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/profile-workflow/src/import-acceptance.ts \
            packages/profile-workflow/src/import-acceptance.test.ts \
            packages/profile-workflow/src/index.ts
          git commit -m 'style: format import acceptance transaction'
          git push origin HEAD:feat/m8-profile-workflow
