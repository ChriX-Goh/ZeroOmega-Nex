name: Research Firefox system access adaptation

on:
  push:
    branches:
      - 'feat/m8-profile-workflow'
    paths:
      - '.github/workflows/research-firefox-system-access.yml'

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Adapt Firefox launch arguments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = []
          replacements = 0
          needle = "addArguments('-headless'"
          replacement = "addArguments('-headless', '--remote-allow-system-access'"

          for path in sorted(Path('scripts').glob('*firefox*.mjs')):
              text = path.read_text()
              count = text.count(needle)
              if not count:
                  continue
              if '--remote-allow-system-access' in text:
                  raise SystemExit(f'{path}: flag already present; refusing ambiguous rewrite')
              path.write_text(text.replace(needle, replacement))
              targets.append((str(path), count))
              replacements += count

          if not targets:
              raise SystemExit('No Firefox launch sites found')

          print('Adapted Firefox launch sites:')
          for path, count in targets:
              print(f'  {path}: {count}')
          print(f'Total replacements: {replacements}')
          PY

          git diff --check
          git diff --stat

      - name: Commit adaptation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No adaptation required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/*firefox*.mjs
          git commit -m 'test: allow Firefox privileged extension navigation'
          git push origin HEAD:feat/m8-profile-workflow
