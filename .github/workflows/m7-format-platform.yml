name: M7 format platform drivers

on:
  push:
    branches:
      - feat/m7-browser-adapters

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-browser-adapters
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Format platform drivers and remove workflow
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            packages/browser-adapters/src/chromium.ts \
            packages/browser-adapters/src/firefox.ts \
            packages/browser-adapters/src/platform-drivers.test.ts \
            packages/browser-adapters/src/platform-utils.ts
          rm .github/workflows/m7-format-platform.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/browser-adapters/src .github/workflows/m7-format-platform.yml
          git diff --cached --quiet || git commit -m "style: format browser platform drivers"
          git push origin HEAD:feat/m7-browser-adapters
