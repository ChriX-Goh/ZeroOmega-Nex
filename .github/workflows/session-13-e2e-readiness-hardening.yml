name: Session 13 E2E Readiness Hardening

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/session-13-e2e-readiness-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout active product branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply readiness hardening
        run: |
          python scripts/session-13-e2e-readiness-hardening.py
          pnpm exec prettier --write scripts/e2e-chromium-popup-external-profile.mjs scripts/e2e-firefox.mjs docs/SESSION_13_KNOWLEDGE_GRAPH.md docs/AUDIT_EVIDENCE_02R_POPUP_OWNERSHIP_EXTERNAL.md
          git diff --check
          node --check scripts/e2e-chromium-popup-external-profile.mjs
          node --check scripts/e2e-firefox.mjs
          pnpm validate:parity-docs
          pnpm check

      - name: Install Chromium and run targeted browser gates
        run: |
          pnpm exec playwright install --with-deps chromium
          WXT_ICON_RENDERER_E2E=1 ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium
          pnpm test:e2e:chromium-popup-external-profile
          WXT_ICON_RENDERER_E2E=1 pnpm build:firefox
          pnpm test:e2e:firefox

      - name: Commit hardening without patch machinery
        run: |
          git restore .github/workflows/session-13-e2e-readiness-hardening.yml
          git restore scripts/session-13-e2e-readiness-hardening.py
          git config user.name 'zeroomega-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test: wait for browser state before Popup assertions'
          git push origin HEAD:feat/m8-profile-workflow
