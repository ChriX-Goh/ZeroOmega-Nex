name: Finalize M8 Options integration
on:
  push:
    branches: [feat/m8-profile-workflow]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Add extension workspace dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pnpm-lock.yaml')
          text = path.read_text()
          marker = "      '@zeroomega-nex/core-contracts':\n        specifier: workspace:*\n        version: link:../../packages/core-contracts\n"
          block = marker + "      '@zeroomega-nex/profile-spec':\n        specifier: workspace:*\n        version: link:../../packages/profile-spec\n      '@zeroomega-nex/profile-workflow':\n        specifier: workspace:*\n        version: link:../../packages/profile-workflow\n"
          if marker not in text:
              raise SystemExit('extension importer marker not found')
          path.write_text(text.replace(marker, block, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/extension/package.json apps/extension/src/entrypoints/background.ts apps/extension/src/entrypoints/options/App.svelte apps/extension/src/lib/profile-workflow-client.ts apps/extension/src/lib/profile-workflow-runtime.ts
      - run: |
          rm .github/workflows/finalize-m8-options.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml apps/extension .github/workflows/finalize-m8-options.yml
          git commit -m "build: lock and format m8 Options integration"
          git push origin HEAD:feat/m8-profile-workflow
