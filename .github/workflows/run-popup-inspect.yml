name: Run Popup Inspect integration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-popup-inspect.yml

permissions:
  contents: write

concurrency:
  group: run-popup-inspect-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Decode and apply source-backed Inspect slice
        shell: bash
        env:
          INTEGRATION_RUN_ID: ${{ github.run_id }}
        run: |
          grep '^H4s' .github/workflows/integrate-popup-inspect.yml >/tmp/apply_inspect.py.gz.b64
          base64 -d /tmp/apply_inspect.py.gz.b64 | gzip -d >/tmp/apply_inspect.py
          python /tmp/apply_inspect.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-ui-compatibility.mjs')
          text = path.read_text()
          old = 'manifest.includes("permissions: [\'proxy\', \'storage\', \'alarms\', \'activeTab\']")'
          new = 'manifest.includes("permissions: [\'proxy\', \'storage\', \'alarms\', \'activeTab\', \'contextMenus\']")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one manifest permission guard, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/integrate-popup-inspect.yml
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/extension/src/lib/inspect-client.ts \
            apps/extension/src/lib/inspect-runtime.ts \
            apps/extension/src/lib/inspect-runtime.test.ts \
            apps/extension/src/entrypoints/background.ts \
            apps/extension/src/entrypoints/popup/App.svelte \
            apps/extension/src/entrypoints/popup/style.css \
            apps/extension/wxt.config.ts \
            apps/extension/public/_locales/en/messages.json \
            apps/extension/public/_locales/zh_CN/messages.json \
            apps/extension/public/_locales/zh_TW/messages.json \
            scripts/inspect-manifests.mjs \
            scripts/validate-ui-compatibility.mjs \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            docs/MILESTONE_8_STATUS.md
          git diff --check
      - name: Verify complete repository
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee /tmp/popup-inspect-verify.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-inspect-verification
          path: /tmp/popup-inspect-verify.log
          if-no-files-found: warn
      - name: Enforce verification result
        if: steps.verify.outcome != 'success'
        run: exit 1
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Chromium regression E2E
        id: chromium
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee /tmp/popup-inspect-chromium.log
      - name: Upload Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-inspect-chromium
          path: /tmp/popup-inspect-chromium.log
          if-no-files-found: warn
      - name: Enforce Chromium result
        if: steps.chromium.outcome != 'success'
        run: exit 1
      - name: Clean temporary integration files
        run: |
          rm -f .github/workflows/run-popup-inspect.yml
          git clean -fdX
          git diff --check
      - name: Commit verified product slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/m8-profile-workflow
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/m8-profile-workflow)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m 'feat: restore Popup Inspect context menus'
          git push origin HEAD:feat/m8-profile-workflow
