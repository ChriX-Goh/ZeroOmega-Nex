name: Fix attached header Chromium interaction

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-attached-header-e2e.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Order attached header interaction after expansion
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/e2e-chromium.mjs')
          source = path.read_text()
          old = """  const addHeader = attachedHeaders.locator('button').filter({ hasText: 'Add header' });
            await assertEventually(
              async () => !(await addHeader.isDisabled()),
              'Attached Rule List header button remained disabled after saving text',
            );
            const headerDetails = attachedHeaders.locator('details');
            if (!(await headerDetails.evaluate((element) => element.open))) {
              await headerDetails.locator('summary').click();
            }
            await addHeader.click();
          """
          new = """  const addHeader = attachedHeaders.locator('button').filter({ hasText: 'Add header' });
            const headerDetails = attachedHeaders.locator('details');
            if (!(await headerDetails.evaluate((element) => element.open))) {
              await headerDetails.locator('summary').click();
            }
            await assertEventually(
              async () => !(await addHeader.isDisabled()),
              'Attached Rule List header button remained disabled after opening request headers',
            );
            await addHeader.click();
          """
          if source.count(old) != 1:
              raise SystemExit(f'attached header ordering block mismatch: {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          pnpm exec prettier --write scripts/e2e-chromium.mjs
          git diff --check
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and run Chromium E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm build:chromium
          pnpm test:e2e:chromium 2>&1 | tee /tmp/attached-header-e2e.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attached-header-e2e
          path: /tmp/attached-header-e2e.log
          if-no-files-found: warn
      - name: Clean and commit verified correction
        run: |
          rm -rf browser-builds browser-builds.tar.gz
          git clean -fdX
          rm -f .github/workflows/fix-attached-header-e2e.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: serialize attached header E2E interaction'
          git pull --rebase origin feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
