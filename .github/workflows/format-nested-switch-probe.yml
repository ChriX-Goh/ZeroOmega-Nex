name: Format Nested Switch Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-nested-switch-probe.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format nested Switch files
        run: |
          pnpm exec prettier --write \
            apps/extension/src/lib/original-observable-nested-switch.ts \
            apps/extension/src/lib/original-toolbar-nested-switch.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-nested-switch-files
          path: |
            apps/extension/src/lib/original-observable-nested-switch.ts
            apps/extension/src/lib/original-toolbar-nested-switch.test.ts
          if-no-files-found: error
