name: M5 bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/m5-reference-interpreter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m5-reference-interpreter
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Register workspace, format, and remove bootstrap workflow
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm exec prettier --write package.json packages/reference-interpreter pnpm-lock.yaml
          rm .github/workflows/m5-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/reference-interpreter pnpm-lock.yaml .github/workflows/m5-bootstrap.yml
          git commit -m "chore(m5): register and format reference interpreter"
          git push origin HEAD:feat/m5-reference-interpreter
