name: Research format sensitive migration test

on:
  push:
    branches:
      - 'feat/m8-profile-workflow'
    paths:
      - '.github/workflows/research-format-sensitive.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and commit target
        shell: bash
        run: |
          pnpm exec prettier --write apps/extension/src/lib/legacy-sensitive-migration.test.ts
          git diff --check
          if git diff --quiet; then
            echo 'Target already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/extension/src/lib/legacy-sensitive-migration.test.ts
          git commit -m 'style: apply repo formatter to sensitive migration test'
          git push origin HEAD:feat/m8-profile-workflow
