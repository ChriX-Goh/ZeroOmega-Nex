name: Research MIG-01 Large Browser Capacity

on:
  push:
    branches:
      - research/mig01-large-runtime-export
    paths:
      - '.github/workflows/research-mig01-large-browser-capacity.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Check large E2E formatting
        run: pnpm exec prettier --check scripts/e2e-chromium-original-large-migration.mjs scripts/e2e-firefox-original-large-migration.mjs package.json
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium extension
        env:
          WXT_ICON_RENDERER_E2E: '1'
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Probe Chromium workflow transaction without Options rendering
        run: node scripts/e2e-chromium-large-command-probe.mjs
      - name: Run Chromium original large persistent migration
        run: pnpm test:e2e:chromium-original-large-migration

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Show Firefox version
        run: firefox --version
      - name: Build Firefox extension
        env:
          WXT_ICON_RENDERER_E2E: '1'
        run: pnpm build:firefox
      - name: Run Firefox original large persistent migration
        run: pnpm test:e2e:firefox-original-large-migration

# Includes a direct Chromium workflow transaction probe to isolate UI rendering from storage/Apply.
