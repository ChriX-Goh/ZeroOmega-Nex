name: Integrate independent Rule List editor

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-independent-rule-list-editor.yml

permissions:
  contents: write

concurrency:
  group: integrate-independent-rule-list-editor-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply independent Rule List editor slice
        env:
          INTEGRATION_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/prepare-independent-rule-list-e2e-anchor.py
            python .github/patches/fix-independent-rule-list-patch-anchor.py
            python .github/patches/fix-independent-rule-list-validator-patch.py
            python .github/patches/apply-independent-rule-list-editor.py
            python .github/patches/fix-independent-rule-list-unused-import.py
            python .github/patches/fix-independent-rule-list-e2e-selector.py
          } 2>&1 | tee independent-rule-list-apply.log
      - name: Format product slice
        run: pnpm format
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee independent-rule-list-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E host candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium regression suite
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee independent-rule-list-e2e.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-rule-list-integration-${{ github.run_id }}
          path: independent-rule-list-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-independent-rule-list-editor.yml
          rm -f \
            .github/patches/apply-independent-rule-list-editor.py \
            .github/patches/prepare-independent-rule-list-e2e-anchor.py \
            .github/patches/fix-independent-rule-list-patch-anchor.py \
            .github/patches/fix-independent-rule-list-validator-patch.py \
            .github/patches/fix-independent-rule-list-unused-import.py \
            .github/patches/fix-independent-rule-list-e2e-selector.py \
            independent-rule-list-apply.log \
            independent-rule-list-verify.log \
            independent-rule-list-e2e.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: restore independent Rule List editor"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
