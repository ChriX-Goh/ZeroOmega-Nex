# integration revision 8
name: Integrate typed PAC locale

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-typed-locale-pac.yml
      - .github/patches/*typed-locale-pac*.py

permissions:
  contents: write

concurrency:
  group: integrate-typed-locale-pac-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply typed PAC locale
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/fix-typed-locale-pac-editor-patch.py
            python .github/patches/fix-typed-locale-pac-firefox-guard-v2.py
            python .github/patches/apply-typed-locale-pac-catalog.py
            python .github/patches/apply-typed-locale-pac-editor.py
            python .github/patches/apply-typed-locale-pac-integration.py
          } 2>&1 | tee typed-locale-pac-apply.log
      - name: Format product slice
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee typed-locale-pac-format.log
      - name: Generate locale inventory
        run: |
          set -o pipefail
          pnpm locale:inventory 2>&1 | tee typed-locale-pac-inventory.log
          pnpm exec prettier --write docs/LOCALE_INVENTORY.json
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee typed-locale-pac-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium PAC locale regression
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee typed-locale-pac-chromium.log
      - name: Run Firefox PAC interaction regression
        run: |
          set -o pipefail
          pnpm build:firefox 2>&1 | tee typed-locale-pac-firefox-build.log
          pnpm test:e2e:firefox 2>&1 | tee typed-locale-pac-firefox.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-locale-pac-${{ github.run_id }}
          path: typed-locale-pac-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-typed-locale-pac.yml
          rm -f \
            .github/patches/fix-typed-locale-pac-editor-patch.py \
            .github/patches/fix-typed-locale-pac-firefox-guard.py \
            .github/patches/fix-typed-locale-pac-firefox-guard-v2.py \
            .github/patches/apply-typed-locale-pac-catalog.py \
            .github/patches/apply-typed-locale-pac-editor.py \
            .github/patches/apply-typed-locale-pac-integration.py \
            typed-locale-pac-apply.log \
            typed-locale-pac-format.log \
            typed-locale-pac-inventory.log \
            typed-locale-pac-verify.log \
            typed-locale-pac-chromium.log \
            typed-locale-pac-firefox-build.log \
            typed-locale-pac-firefox.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add typed PAC locale and Firefox interaction"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
