name: Patch Fixed validation integration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-fixed-validation.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - name: Extend verified integration
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/integrate-fixed-profile-parity.yml')
          text = path.read_text()
          marker = """          PY
      - name: Format integrated slice
          """
          addition = """          validation_path = Path('packages/profile-spec/src/validation.ts')
          validation = validation_path.read_text()
          empty_endpoint_rule = \"\"\"      if (references.length === 0) {
                issues.push(
                  issue(
                    'profile.fixed-without-endpoint',
                    `/profiles/${profileIndex}/proxyByScheme`,
                    'fixed profile must reference at least one proxy endpoint',
                  ),
                );
              }
          \"\"\"
          if validation.count(empty_endpoint_rule) != 1:
              raise SystemExit(f'blank Fixed validation rule mismatch: {validation.count(empty_endpoint_rule)}')
          validation_path.write_text(validation.replace(empty_endpoint_rule, ''))

          profile_spec_test_path = Path('packages/profile-spec/src/index.test.ts')
          profile_spec_test = profile_spec_test_path.read_text()
          test_marker = \"  it('rejects missing endpoint and profile references', () => {\\n\"
          blank_fixed_test = \"\"\"  it('accepts a blank fixed profile before proxy endpoints are configured', () => {
            const value = validSpec();
            const fixed = value.profiles[0]!;
            if (fixed.kind !== 'fixed') throw new Error('fixture mismatch');
            fixed.proxyByScheme = {};

            const result = validateProfileSpec(value);
            expect(result.valid).toBe(true);
            expect(result.issues).toEqual([]);
          });

          \"\"\"
          if profile_spec_test.count(test_marker) != 1:
              raise SystemExit(f'blank Fixed test marker mismatch: {profile_spec_test.count(test_marker)}')
          profile_spec_test_path.write_text(
              profile_spec_test.replace(test_marker, blank_fixed_test + test_marker)
          )
          PY
      - name: Format integrated slice
          """
          if text.count(marker) != 1:
              raise SystemExit(f'integration Python marker mismatch: {text.count(marker)}')
          text = text.replace(marker, addition)
          format_marker = """            packages/profile-workflow/src/commands-import.test.ts \\
            packages/profile-workflow/src/commands.ts \\
          """
          format_replacement = """            packages/profile-spec/src/index.test.ts \\
            packages/profile-spec/src/validation.ts \\
            packages/profile-workflow/src/commands-import.test.ts \\
            packages/profile-workflow/src/commands.ts \\
          """
          if text.count(format_marker) != 1:
              raise SystemExit(f'integration format marker mismatch: {text.count(format_marker)}')
          path.write_text(text.replace(format_marker, format_replacement))
          PY
          rm -f .github/workflows/patch-fixed-validation.yml
      - name: Commit integration correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: integrate blank Fixed validation correction'
          git push origin HEAD:feat/m8-profile-workflow
