# reconciliation revision 2
name: Reconcile import and history delivery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-import-history-delivery.yml
      - .github/patches/reconcile-import-history-delivery.py

permissions:
  contents: write

concurrency:
  group: reconcile-import-history-delivery-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconcile durable delivery state
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/reconcile-import-history-delivery.py
            pnpm exec prettier --write \
              docs/MILESTONE_8_STATUS.md \
              docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
              docs/UI_AUDIT_MATRIX.md
            node scripts/validate-parity-docs.mjs
          } 2>&1 | tee reconcile-import-history.log
      - name: Upload reconciliation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-import-history-${{ github.run_id }}
          path: reconcile-import-history.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit reconciliation
        run: |
          git checkout HEAD -- .github/workflows/reconcile-import-history-delivery.yml
          rm -f \
            .github/patches/reconcile-import-history-delivery.py \
            reconcile-import-history.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: reconcile import and history delivery"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
