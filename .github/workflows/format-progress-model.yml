name: Format Progress Model

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact pull request Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format progress model
        run: pnpm exec prettier --write docs/PROJECT_PROGRESS_MODEL.md

      - name: Upload formatted progress model
        uses: actions/upload-artifact@v4
        with:
          name: formatted-progress-model
          path: docs/PROJECT_PROGRESS_MODEL.md
          if-no-files-found: error
