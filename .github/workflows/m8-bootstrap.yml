name: M8 bootstrap

on:
  push:
    branches: [feat/m8-profile-workflow]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Add minimal lockfile importer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pnpm-lock.yaml')
          text = path.read_text()
          marker = '\n  packages/reference-interpreter:\n'
          block = '''\n  packages/profile-workflow:\n    dependencies:\n      '@zeroomega-nex/profile-spec':\n        specifier: workspace:*\n        version: link:../profile-spec\n    devDependencies:\n      typescript:\n        specifier: 5.9.3\n        version: 5.9.3\n'''
          if marker not in text:
              raise SystemExit('lockfile importer marker not found')
          path.write_text(text.replace(marker, block + marker, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write package.json packages/profile-workflow
      - name: Commit generated formatting and lockfile
        run: |
          rm .github/workflows/m8-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml packages/profile-workflow .github/workflows/m8-bootstrap.yml
          git commit -m "build: lock and format profile workflow workspace"
          git push origin HEAD:feat/m8-profile-workflow
