name: Harden Milestone 8 UI Accessibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply UI accessibility hardening
        run: python .github/scripts/harden-m8-ui-accessibility.py

      - name: Format UI accessibility slice
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/style.css \
            apps/extension/src/entrypoints/popup/style.css \
            scripts/guard-architecture.mjs \
            scripts/validate-ui-compatibility.mjs

      - name: Verify UI accessibility slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm guard:architecture
            pnpm validate:ui
            pnpm --filter @zeroomega-nex/extension check
            pnpm exec eslint \
              scripts/guard-architecture.mjs \
              scripts/validate-ui-compatibility.mjs
          } 2>&1 | tee m8-ui-accessibility.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-ui-accessibility-diagnostics
          path: m8-ui-accessibility.log
          if-no-files-found: warn

      - name: Commit UI accessibility hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/entrypoints/options/style.css \
            apps/extension/src/entrypoints/popup/style.css \
            scripts/guard-architecture.mjs \
            scripts/validate-ui-compatibility.mjs
          git commit -m 'feat: harden keyboard and responsive UI behavior'
          git push origin HEAD:feat/m8-profile-workflow
