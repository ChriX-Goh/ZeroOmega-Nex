name: Integrate M8 proxy protocol capabilities

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-m8-proxy-protocol-capabilities.yml
      - .github/patches/apply-m8-proxy-protocol-capabilities.py

permissions:
  contents: write

concurrency:
  group: integrate-m8-proxy-protocol-capabilities-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch Head
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Align patch with current PAC capability traversal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/patches/apply-m8-proxy-protocol-capabilities.py')
          text = path.read_text()

          old_import = '''"""import { PAC_COMPILER_VERSION } from './contracts.js';
          """'''
          new_import = '''"""import {
            PAC_COMPILER_VERSION,
            type PacCapability,
            type PacCapabilityAnalysis,
            type PacCapabilityIssue,
            type PacTarget,
          } from './contracts.js';
          """'''
          if text.count(old_import) != 1:
              raise SystemExit(f'PAC capability import patch anchor mismatch: {text.count(old_import)}')
          text = text.replace(old_import, new_import)

          start_marker = '''replace_once(
              capabilities,
              """        endpointCapability'''
          end_marker = "\n\ncompiler_tests = Path('packages/pac-compiler/src/compiler.test.ts')"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit(f'endpoint traversal markers missing: start={start}, end={end}')
          traversal_replacement = '''replace_once(
              capabilities,
              """  const visitEndpoint = (endpointId: string, path: string): void => {
              if (visitedEndpoints.has(endpointId)) return;
              visitedEndpoints.add(endpointId);
              const endpoint = endpointById.get(endpointId);
              if (!endpoint) {
                addIssue({
                  code: 'endpoint.missing',
                  path,
                  capability: 'unsupported',
                  severity: 'error',
                  blocking: true,
                  message: `Referenced proxy endpoint ${endpointId} does not exist.`,
                });
                return;
              }
              reachableEndpointIds.push(endpointId);
              endpointCapability(
                endpoint,
                `/proxyEndpoints/${spec.proxyEndpoints.indexOf(endpoint)}`,
                addIssue,
              );
            };
          """,
              """  const visitEndpoint = (
              endpointId: string,
              path: string,
              slot: FixedProxySlot,
            ): void => {
              const endpoint = endpointById.get(endpointId);
              if (!endpoint) {
                addIssue({
                  code: 'endpoint.missing',
                  path,
                  capability: 'unsupported',
                  severity: 'error',
                  blocking: true,
                  message: `Referenced proxy endpoint ${endpointId} does not exist.`,
                });
                return;
              }
              endpointCapability(endpoint, path, target, slot, addIssue);
              if (visitedEndpoints.has(endpointId)) return;
              visitedEndpoints.add(endpointId);
              reachableEndpointIds.push(endpointId);
            };
          """,
              'target-aware endpoint traversal',
          )
          replace_once(
              capabilities,
              """            visitEndpoint(endpointId, `${profilePath}/proxyByScheme/${slot}`);
          """,
              """            visitEndpoint(
                endpointId,
                `${profilePath}/proxyByScheme/${slot}`,
                slot as FixedProxySlot,
              );
          """,
              'target-aware Fixed slot traversal',
          )'''
          text = text[:start] + traversal_replacement + text[end:]

          app_start = text.find("app = Path('apps/extension/src/entrypoints/options/App.svelte')")
          app_end = text.find('\n\n# Typed direct strings.', app_start)
          if app_start == -1 or app_end == -1:
              raise SystemExit(f'Fixed editor wiring markers missing: start={app_start}, end={app_end}')
          text = text[:app_start] + "app = Path('apps/extension/src/entrypoints/options/App.svelte')" + text[app_end:]

          old_strings = '''anchor = """  'fixed.authUnsupported': {
          """'''
          new_strings = '''anchor = """  'fixed.proxyServers': { en: 'Proxy servers', 'zh-CN': '代理服务器', 'zh-TW': '代理伺服器' },
          """'''
          if text.count(old_strings) != 1:
              raise SystemExit(f'Fixed capability string patch anchor mismatch: {text.count(old_strings)}')
          text = text.replace(old_strings, new_strings)
          path.write_text(text)
          PY

      - name: Apply proxy protocol capability slice
        run: python .github/patches/apply-m8-proxy-protocol-capabilities.py

      - name: Wire target into the Fixed editor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/extension/src/entrypoints/options/App.svelte')
          lines = path.read_text().splitlines()
          matches = [index for index, line in enumerate(lines) if '<FixedProfileEditor' in line]
          if len(matches) != 1:
              raise SystemExit(f'FixedProfileEditor component matches: {len(matches)}')
          index = matches[0]
          if index + 1 >= len(lines) or lines[index + 1].strip() != '{locale}':
              raise SystemExit('FixedProfileEditor locale prop shape changed')
          indent = lines[index + 1][: len(lines[index + 1]) - len(lines[index + 1].lstrip())]
          lines.insert(index + 2, f'{indent}browserTarget={{browserTargetCapabilities.target}}')
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Regenerate locale inventory
        run: pnpm locale:inventory

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            packages/pac-compiler/src/proxy-capabilities.ts \
            packages/pac-compiler/src/proxy-capabilities.test.ts \
            packages/pac-compiler/src/index.ts \
            packages/pac-compiler/src/capabilities.ts \
            packages/pac-compiler/src/compiler.test.ts \
            apps/extension/src/lib/browser-target-capabilities.ts \
            apps/extension/src/lib/browser-target-capabilities.test.ts \
            apps/extension/src/entrypoints/options/FixedProfileEditor.svelte \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/lib/ui-messages.ts \
            apps/extension/src/component-rendering.component.spec.ts \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            scripts/validate-parity-docs.mjs \
            docs/DECISIONS.md \
            docs/LOCALE_INVENTORY.json \
            docs/UI_AUDIT_MATRIX.md \
            docs/MILESTONE_8_STATUS.md \
            docs/MILESTONE_8_SESSION_7_CHECKPOINT.md \
            docs/MILESTONE_8_RELEASE_CANDIDATE.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md

      - name: Verify repository
        run: pnpm verify

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build both browser E2E candidates
        run: |
          ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium
          pnpm build:firefox

      - name: Run Chromium protocol E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee proxy-protocol-chromium.log

      - name: Run Firefox protocol E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox 2>&1 | tee proxy-protocol-firefox.log

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-proxy-protocol-capability-evidence
          path: |
            proxy-protocol-chromium.log
            proxy-protocol-firefox.log
          if-no-files-found: warn

      - name: Commit verified product slice and remove integration machinery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/integrate-m8-proxy-protocol-capabilities.yml
          git rm -f .github/patches/apply-m8-proxy-protocol-capabilities.py
          git add packages/pac-compiler/src/proxy-capabilities.ts \
            packages/pac-compiler/src/proxy-capabilities.test.ts \
            packages/pac-compiler/src/index.ts \
            packages/pac-compiler/src/capabilities.ts \
            packages/pac-compiler/src/compiler.test.ts \
            apps/extension/src/lib/browser-target-capabilities.ts \
            apps/extension/src/lib/browser-target-capabilities.test.ts \
            apps/extension/src/entrypoints/options/FixedProfileEditor.svelte \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/lib/ui-messages.ts \
            apps/extension/src/component-rendering.component.spec.ts \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            scripts/validate-parity-docs.mjs \
            docs/DECISIONS.md \
            docs/LOCALE_INVENTORY.json \
            docs/UI_AUDIT_MATRIX.md \
            docs/MILESTONE_8_STATUS.md \
            docs/MILESTONE_8_SESSION_7_CHECKPOINT.md \
            docs/MILESTONE_8_RELEASE_CANDIDATE.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md
          git commit -m 'feat: define proxy protocol browser capabilities'
          git push origin HEAD:feat/m8-profile-workflow
