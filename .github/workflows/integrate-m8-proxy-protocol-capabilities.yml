name: Integrate M8 proxy protocol capabilities

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-m8-proxy-protocol-capabilities.yml
      - .github/patches/apply-m8-proxy-protocol-capabilities.py
      - .github/workflows/fix-m8-protocol-component-wire.yml
      - scripts/integrate-m8-protocol.py

permissions:
  contents: write

concurrency:
  group: integrate-m8-proxy-protocol-capabilities-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch Head
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Align protocol patch
        run: python scripts/integrate-m8-protocol.py prepare

      - name: Apply proxy protocol capability slice
        run: python .github/patches/apply-m8-proxy-protocol-capabilities.py

      - name: Reconcile generated integration files
        run: python scripts/integrate-m8-protocol.py post

      - name: Preserve Unicode endpoint target semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/pac-compiler/src/capabilities.ts')
          text = path.read_text()
          old = r"""  if (/[-￿]/u.test(endpoint.host)) {
            addIssue(
              issue(
                'endpoint.non-ascii-host',
                `${path}/host`,
                'unsupported',
                'error',
                true,
                'PAC proxy directives require an ASCII host after normalization.',
              ),
            );
          }
          """
          new = """  if (containsNonAscii(endpoint.host)) {
            addIssue(
              issue(
                'endpoint.host-needs-ascii',
                `${path}/host`,
                'target-dependent',
                'warning',
                true,
                'PAC proxy endpoints require an ASCII hostname; IDN conversion must be verified before compilation.',
              ),
            );
          }
          """
          if text.count(old) != 1:
              raise SystemExit(f'Unicode endpoint capability block matches: {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Remove obsolete fixer workflow
        run: git rm -f .github/workflows/fix-m8-protocol-component-wire.yml

      - name: Regenerate locale inventory
        run: pnpm locale:inventory

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            packages/pac-compiler/src/proxy-capabilities.ts \
            packages/pac-compiler/src/proxy-capabilities.test.ts \
            packages/pac-compiler/src/index.ts \
            packages/pac-compiler/src/capabilities.ts \
            packages/pac-compiler/src/compiler.test.ts \
            apps/extension/src/lib/browser-target-capabilities.ts \
            apps/extension/src/lib/browser-target-capabilities.test.ts \
            apps/extension/src/entrypoints/options/FixedProfileEditor.svelte \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/lib/ui-messages.ts \
            apps/extension/src/component-rendering.component.spec.ts \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            scripts/validate-parity-docs.mjs \
            docs/DECISIONS.md \
            docs/LOCALE_INVENTORY.json \
            docs/UI_AUDIT_MATRIX.md \
            docs/MILESTONE_8_STATUS.md \
            docs/MILESTONE_8_SESSION_7_CHECKPOINT.md \
            docs/MILESTONE_8_RELEASE_CANDIDATE.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md

      - name: Verify repository
        run: pnpm verify

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build both browser E2E candidates
        run: |
          ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium
          pnpm build:firefox

      - name: Run Chromium protocol E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee proxy-protocol-chromium.log

      - name: Run Firefox protocol E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox 2>&1 | tee proxy-protocol-firefox.log

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-proxy-protocol-capability-evidence
          path: |
            proxy-protocol-chromium.log
            proxy-protocol-firefox.log
          if-no-files-found: warn

      - name: Commit verified product slice and remove integration machinery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/integrate-m8-proxy-protocol-capabilities.yml
          git rm -f .github/patches/apply-m8-proxy-protocol-capabilities.py
          git rm -f scripts/integrate-m8-protocol.py
          git add packages/pac-compiler/src/proxy-capabilities.ts \
            packages/pac-compiler/src/proxy-capabilities.test.ts \
            packages/pac-compiler/src/index.ts \
            packages/pac-compiler/src/capabilities.ts \
            packages/pac-compiler/src/compiler.test.ts \
            apps/extension/src/lib/browser-target-capabilities.ts \
            apps/extension/src/lib/browser-target-capabilities.test.ts \
            apps/extension/src/entrypoints/options/FixedProfileEditor.svelte \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/lib/ui-messages.ts \
            apps/extension/src/component-rendering.component.spec.ts \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            scripts/validate-parity-docs.mjs \
            docs/DECISIONS.md \
            docs/LOCALE_INVENTORY.json \
            docs/UI_AUDIT_MATRIX.md \
            docs/MILESTONE_8_STATUS.md \
            docs/MILESTONE_8_SESSION_7_CHECKPOINT.md \
            docs/MILESTONE_8_RELEASE_CANDIDATE.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md
          git commit -m 'feat: define proxy protocol browser capabilities'
          git push origin HEAD:feat/m8-profile-workflow
