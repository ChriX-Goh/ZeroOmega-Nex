name: Apply Switch Fixed toolbar trace

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-toolbar-switch-fixed-trace.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply and verify
        run: |
          python scripts/apply-toolbar-switch-fixed-trace.py
          python scripts/fix-toolbar-switch-color-narrowing.py
          pnpm exec prettier --write \
            apps/extension/src/lib/original-toolbar-profile-resolver.ts \
            apps/extension/src/lib/original-toolbar-profile-resolver.test.ts \
            scripts/e2e-chromium-toolbar.mjs \
            scripts/e2e-firefox.mjs
          pnpm verify
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e:chromium-toolbar
          for iteration in 1 2 3; do
            echo ">>>>> FIREFOX SWITCH FIXED ITERATION ${iteration}"
            pnpm test:e2e:firefox-toolbar
          done
      - name: Commit ordinary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/extension/src/lib/original-toolbar-profile-resolver.ts \
            apps/extension/src/lib/original-toolbar-profile-resolver.test.ts \
            scripts/e2e-chromium-toolbar.mjs \
            scripts/e2e-firefox.mjs
          git rm \
            scripts/apply-toolbar-switch-fixed-trace.py \
            scripts/fix-toolbar-switch-color-narrowing.py
          git commit -m 'feat: resolve exact Switch to Fixed toolbar traces'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
