name: Diagnose Original UI Contract Fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-original-ui-contract-fixes.yml
      - scripts/apply-original-ui-contract-fixes.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact pull request Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Apply exact pending correction
        run: python scripts/apply-original-ui-contract-fixes.py

      - name: Format pending correction
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/App.svelte \
            packages/profile-workflow/src/commands.ts \
            scripts/validate-parity-docs.mjs \
            apps/extension/src/component-rendering.component.spec.ts \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            scripts/capture-visual-evidence.mjs

      - name: Run checks with individual diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p original-ui-contract-diagnostics
          : > original-ui-contract-diagnostics/summary.txt
          failed=0
          run_check() {
            name="$1"
            shift
            "$@" >"original-ui-contract-diagnostics/${name}.log" 2>&1
            code=$?
            printf '%s=%s\n' "$name" "$code" | tee -a original-ui-contract-diagnostics/summary.txt
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          run_check architecture pnpm guard:architecture
          run_check parity pnpm validate:parity-docs
          run_check typecheck pnpm check
          run_check unit pnpm test
          run_check components pnpm test:components
          run_check lint pnpm lint
          run_check diff git diff --check
          exit "$failed"

      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ui-contract-diagnostics-${{ github.event.pull_request.head.sha }}
          path: original-ui-contract-diagnostics
          if-no-files-found: error
          retention-days: 7
