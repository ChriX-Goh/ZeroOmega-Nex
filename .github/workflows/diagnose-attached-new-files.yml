name: Diagnose attached Rule List new files

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-attached-new-files.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 1
          show-progress: false
      - name: Inspect new-files archive
        shell: bash
        run: |
          set +e
          {
            wc -c .github/patches/attached-rule-list-new-files.tgz.b64
            sha256sum .github/patches/attached-rule-list-new-files.tgz.b64
            base64 --decode .github/patches/attached-rule-list-new-files.tgz.b64 > /tmp/new-files.tgz
            echo "decode_status=$?"
            wc -c /tmp/new-files.tgz
            sha256sum /tmp/new-files.tgz
            gzip --test /tmp/new-files.tgz
            echo "gzip_status=$?"
            tar --list --gzip --file /tmp/new-files.tgz
            echo "tar_status=$?"
          } > /tmp/attached-new-files-diagnostics.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: attached-new-files-diagnostics
          path: /tmp/attached-new-files-diagnostics.txt
          if-no-files-found: error
