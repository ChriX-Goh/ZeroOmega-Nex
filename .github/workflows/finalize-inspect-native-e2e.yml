name: Finalize native Inspect E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/finalize-inspect-native-e2e.yml

permissions:
  contents: write

concurrency:
  group: finalize-inspect-native-e2e-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Recreate verified product tree
        env:
          INTEGRATION_RUN_ID: '30297644740'
        run: |
          python .github/patches/normalize-inspect-native-doc-anchors.py
          python .github/patches/promote-inspect-native-e2e.py
          pnpm format
      - name: Commit and push non-workflow product files
        shell: bash
        run: |
          set -o pipefail
          {
            set -x
            git checkout HEAD -- .github/workflows/browser-e2e.yml
            rm -f \
              .github/patches/normalize-inspect-native-doc-anchors.py \
              .github/patches/promote-inspect-native-e2e.py \
              inspect-native-menu-before.png \
              inspect-native-menu-failure.png
            git status --short
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git diff --cached --stat
            git commit -m "test: add native Inspect context-menu E2E"
            git fetch origin feat/m8-profile-workflow
            git rebase origin/feat/m8-profile-workflow
            git push origin HEAD:feat/m8-profile-workflow
          } 2>&1 | tee inspect-native-finalize.log
      - name: Upload finalization log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-native-finalize-${{ github.run_id }}
          path: inspect-native-finalize.log
          if-no-files-found: warn
          retention-days: 7
