name: Capture draft validation source context

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/capture-draft-validation-source.yml

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 1
          show-progress: false
      - name: Collect source context
        run: |
          {
            echo '## cloneProfileSpec'
            grep -RIn --exclude-dir=node_modules --exclude-dir=dist 'cloneProfileSpec' packages apps scripts || true
            echo
            echo '## validateProfileSpec'
            grep -RIn --exclude-dir=node_modules --exclude-dir=dist 'validateProfileSpec' packages apps scripts || true
            echo
            echo '## createProfileSpecRevision'
            grep -RIn --exclude-dir=node_modules --exclude-dir=dist 'createProfileSpecRevision' packages apps scripts || true
            echo
            echo '## serializeProfileSpec'
            grep -RIn --exclude-dir=node_modules --exclude-dir=dist 'serializeProfileSpec' packages apps scripts || true
          } > /tmp/draft-validation-call-sites.txt
          tar -czf /tmp/draft-validation-source.tgz \
            packages/profile-spec/src \
            packages/profile-spec/schema \
            packages/profile-workflow/src \
            apps/extension/src/entrypoints/options \
            apps/extension/src/lib \
            scripts/validate-ui-compatibility.mjs \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            docs/MILESTONE_8_STATUS.md
      - uses: actions/upload-artifact@v4
        with:
          name: draft-validation-source-context
          path: |
            /tmp/draft-validation-call-sites.txt
            /tmp/draft-validation-source.tgz
          if-no-files-found: error
