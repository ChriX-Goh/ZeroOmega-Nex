name: Research MIG-01.7 Test Format

on:
  push:
    branches:
      - research/mig01-semantic-productize
    paths:
      - '.github/workflows/research-mig01-productize-test-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-semantic-productize
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/legacy-zeroomega/src/semantic-consolidation.test.ts
      - name: Commit exact formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/legacy-zeroomega/src/semantic-consolidation.test.ts
          git diff --cached --check
          git commit -m 'style: format semantic consolidation test'
          git push origin HEAD:research/mig01-semantic-productize
