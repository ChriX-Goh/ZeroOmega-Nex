name: Integrate visual evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-visual-evidence.yml
      - .github/patches/apply-visual-evidence.py
      - .github/patches/fix-visual-evidence-exact-head.py

permissions:
  contents: write

concurrency:
  group: integrate-visual-evidence-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply consolidated visual evidence slice
        run: |
          python .github/patches/apply-visual-evidence.py
          python .github/patches/fix-visual-evidence-exact-head.py

      - name: Format and verify repository
        run: |
          pnpm format
          pnpm verify

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build exact Chromium candidate
        run: pnpm build:chromium

      - name: Capture consolidated visual evidence
        shell: bash
        env:
          ZEROOMEGA_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          pnpm evidence:visual 2>&1 | tee visual-evidence-integration.log

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-integration-${{ github.run_id }}
          path: |
            artifacts/m8-visual-evidence
            visual-evidence-integration.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit verified visual-evidence infrastructure
        run: |
          git checkout HEAD -- .github/workflows/integrate-visual-evidence.yml
          rm -f \
            .github/patches/apply-visual-evidence.py \
            .github/patches/fix-visual-evidence-exact-head.py \
            .github/workflows/m8-visual-evidence.yml \
            visual-evidence-integration.log
          rm -rf artifacts/m8-visual-evidence
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: add consolidated visual evidence"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
