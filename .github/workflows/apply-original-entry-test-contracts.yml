name: Apply Original Entry Test Contracts

on:
  push:
    branches:
      - feat/m8-profile-workflow

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Correct three redesign-era test assumptions
        run: |
          python <<'PY'
          from pathlib import Path

          validator = Path('scripts/validate-ui-compatibility.mjs')
          source = validator.read_text()
          old = '''      optionsApp.includes("uiText('options.builtin.directHelp', locale)") &&'''
          new = '''      !optionsApp.includes("uiText('options.builtin.directHelp', locale)") &&'''
          assert source.count(old) == 1, source.count(old)
          validator.write_text(source.replace(old, new, 1))

          chromium = Path('scripts/e2e-chromium.mjs')
          source = chromium.read_text()
          old = '''  await options.getByRole('button', { name: '配置历史' }).click();
  await options.getByRole('heading', { name: '配置历史', exact: true, level: 1 }).waitFor();
  await options.getByRole('heading', { name: '已验证的 PAC 快照', exact: true }).waitFor();
  await options.locator('.settings-section').first().waitFor({ timeout: 20_000 });'''
          new = '''  assert.equal(
    await options.getByRole('button', { name: '配置历史', exact: true }).count(),
    0,
    'Original-facing Options exposed Nex-only configuration history navigation',
  );'''
          assert source.count(old) == 1, source.count(old)
          chromium.write_text(source.replace(old, new, 1))

          firefox_restart = Path('scripts/e2e-firefox-toolbar-restart.mjs')
          source = firefox_restart.read_text()
          old = '''  assert.equal(result?.url, url, 'Firefox did not navigate to the extension options page');
  await driver.wait(async () => (await driver.getCurrentUrl()) === url, 20_000);'''
          new = '''  const expectedUrl = `${url}#/about`;
  assert.equal(
    result?.url,
    expectedUrl,
    'Firefox did not navigate to the extension options page',
  );
  await driver.wait(async () => (await driver.getCurrentUrl()) === expectedUrl, 20_000);'''
          assert source.count(old) == 1, source.count(old)
          firefox_restart.write_text(source.replace(old, new, 1))
          PY

      - name: Format and syntax-check exact correction
        run: |
          pnpm exec prettier --write \
            scripts/validate-ui-compatibility.mjs \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox-toolbar-restart.mjs
          node --check scripts/validate-ui-compatibility.mjs
          node --check scripts/e2e-chromium.mjs
          node --check scripts/e2e-firefox-toolbar-restart.mjs
          git diff --check

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-original-entry-test-contracts.yml

      - name: Commit exact test-contract correction
        run: |
          git config user.name 'ZeroOmega Nex automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align entry tests with original UI contract'
          git push origin HEAD:feat/m8-profile-workflow
