name: Sync parity progress

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/sync-parity-progress.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize and format authority documents
        run: |
          python .github/patches/sync-parity-progress.py
          pnpm exec prettier --write \
            docs/ACTIVE_PARITY_AUDIT_INDEX.md \
            docs/AUDIT_EVIDENCE_01_ORIGINAL_TOOLBAR.md \
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md \
            docs/ORIGINAL_NEX_DELIVERY_KNOWLEDGE_GRAPH.md \
            docs/MILESTONE_8_STATUS.md \
            docs/MILESTONE_8_SESSION_7_CHECKPOINT.md \
            docs/PROJECT_PROGRESS_MODEL.md
          rm .github/patches/sync-parity-progress.py
          rm .github/workflows/sync-parity-progress.yml

      - name: Commit synchronized state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: synchronize parity progress baseline"
          git push origin HEAD:feat/m8-profile-workflow

# Triggered after workflow registration so the branch push event can execute it.
