name: Clean toolbar transaction files

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-toolbar-navigation-before.yml

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove transaction files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/apply-toolbar-navigation-before.yml \
            scripts/apply-toolbar-navigation-before.py \
            scripts/fix-global-toolbar-executor-lint.py \
            scripts/fix-global-toolbar-overlay-contract.py \
            scripts/fix-global-toolbar-startup-await.py \
            scripts/fix-profile-workflow-command-serialization.py \
            scripts/fix-firefox-toolbar-focused-mode.py \
            scripts/diagnose-firefox-global-action.py
          git commit -m 'chore: remove toolbar transaction files'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
