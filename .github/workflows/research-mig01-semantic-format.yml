name: Research MIG-01.7 Semantic Format

on:
  push:
    branches:
      - research/mig01-semantic-consolidation
    paths:
      - '.github/workflows/research-mig01-semantic-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-semantic-consolidation
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format MIG-01.7 files
        run: |
          pnpm exec prettier --write \
            packages/legacy-zeroomega/src/semantic-consolidation.test.ts \
            scripts/mig01-semantic-evidence.mjs \
            scripts/validate-mig01-semantic-evidence.mjs \
            scripts/e2e-chromium-mig01-secret-leak.mjs \
            scripts/e2e-firefox-mig01-secret-leak.mjs
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/legacy-zeroomega/src/semantic-consolidation.test.ts \
            scripts/mig01-semantic-evidence.mjs \
            scripts/validate-mig01-semantic-evidence.mjs \
            scripts/e2e-chromium-mig01-secret-leak.mjs \
            scripts/e2e-firefox-mig01-secret-leak.mjs
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: format MIG-01.7 evidence files'
          git push origin HEAD:research/mig01-semantic-consolidation
