name: MIG-01.7B temporary materializer

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/mig-01-7b-materialize-temp.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Materialize MIG-01.7B evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          matrix = Path('docs/MIG_01_SEMANTIC_ROUNDTRIP_SECURITY_MATRIX.md')
          source = matrix.read_text()
          source = source.replace(
              '| rendered browser UI | pending browser-visible scan | `MIG-01.7B` |',
              '| rendered browser UI | no controlled raw sentinel before/after real import | Chromium + Firefox sensitive original migration E2E |',
          )
          source = source.replace(
              '| Actions logs / uploaded diagnostics ZIP | pending artifact scan | `MIG-01.7B` |',
              '| Actions logs / uploaded diagnostics | no controlled raw sentinel | permanent `migration-secret-leak-gate` job |',
          )
          source = source.replace(
              'The remaining repository-controlled `MIG-01.7B` work is narrow: inject a non-credential sentinel\nthrough the real sensitive import surface, prove rendered UI and browser command/PAC views never\ncontain it, and scan permanent browser logs plus uploaded diagnostics artifacts for that sentinel.\nNo new product UI or independent per-field workflow is authorized.',
              '`MIG-01.7B` injects three controlled fake sentinels only into original password and sensitive\nrequest-header values at runtime. Chromium and Firefox must prove the real Options import review,\npost-import rendered UI, workflow command response, public proxy/PAC setting, and ordinary `.bak`\nexport contain none of them. A downstream permanent job downloads both browser diagnostics and\nreads the same run’s Chromium/Firefox Actions job logs, then scans every surface again. The gate\nreports only sentinel ordinals, never raw values. No new product UI or per-field workflow is\nauthorized. `MIG-01.7B` closes only after this exact-head Browser E2E chain passes.',
          )
          matrix.write_text(source)

          original_kg = Path('docs/ORIGINAL_KNOWLEDGE_GRAPH.md')
          original_kg.write_text(original_kg.read_text().rstrip() + """

          ## MIG-01.7B browser secret-surface checkpoint (2026-08-07)

          - Three controlled fake sentinels are injected at runtime only into original v3.5.0 password, `X-Fixture-Token`, and `Authorization` values; no real credential is committed.
          - Packaged Chromium and Firefox use the real Options original-backup file input and `Import & Use` path, then assert the migration review, rendered Options UI, workflow `get` response, public browser proxy/PAC setting, and ordinary `.bak` export contain no sentinel.
          - Browser diagnostics append the sensitive migration run to the existing Chromium/Firefox E2E logs. A permanent downstream `migration-secret-leak-gate` downloads both diagnostics artifacts, requires both upstream browser jobs to succeed, retrieves their Actions job logs through read-only Actions API access, and rescans every file/log. Failure messages expose only sentinel ordinals.
          - This is evidence hardening only. Popup/Options product scope is unchanged, product progress remains 45.15%, Corpus B stays an external owner-data blocker, and release remains NO-GO. Parent `MIG-01.7` may close only after all of its remaining semantic-equivalence requirements are independently satisfied on an exact Head.
          """)

          ui = Path('docs/UI_AUDIT_MATRIX.md')
          ui.write_text(ui.read_text().rstrip() + """

          ## MIG-01.7B browser secret-surface evidence note

          MIG-01.7B adds no UI behavior or refinement. It reuses the existing real Options original-backup
          import/export surface as a security observation point: runtime-only fake password/header sentinels
          must not appear in the compatibility review, rendered body, workflow command response, public
          proxy/PAC setting, ordinary export, Chromium/Firefox Actions logs, or uploaded browser diagnostics.
          The downstream permanent gate reports only sentinel ordinals. This evidence does not alter UI row
          status, release readiness, or the 45.15% product-progress baseline.
          """)

          session = Path('docs/SESSION_17_KNOWLEDGE_GRAPH.md')
          session.write_text(session.read_text().rstrip() + """

          ## Session 18 implementation continuation — MIG-01.7B (2026-08-07)

          - MIG-01.7A exact-head evidence is closed at `c0b23ee765db8b50d86fc8fa61ba105cd7c2a830`; parent MIG-01.7 remains the only product WIP.
          - MIG-01.7B adds runtime-only sensitive original-backup sentinels to packaged Chromium/Firefox and a permanent downstream Actions-log/diagnostics scanner. It changes evidence only, not Popup/Options behavior.
          - Closure rule: do not mark MIG-01.7B green until CI plus the permanent Browser E2E run on the final cleaned Head succeed, including both main browser jobs and `migration-secret-leak-gate`.
          - Product progress remains 45.15%, Corpus B remains external, release remains NO-GO.
          """)
          PY
          pnpm exec prettier --write \
            scripts/migration-secret-sentinels.mjs \
            scripts/e2e-chromium-sensitive-migration.mjs \
            scripts/e2e-firefox-sensitive-migration.mjs \
            scripts/verify-browser-migration-secret-leaks.mjs \
            docs/MIG_01_SEMANTIC_ROUNDTRIP_SECURITY_MATRIX.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            docs/SESSION_17_KNOWLEDGE_GRAPH.md
          git diff --check
      - name: Commit materialized non-workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/migration-secret-sentinels.mjs \
            scripts/e2e-chromium-sensitive-migration.mjs \
            scripts/e2e-firefox-sensitive-migration.mjs \
            scripts/verify-browser-migration-secret-leaks.mjs \
            docs/MIG_01_SEMANTIC_ROUNDTRIP_SECURITY_MATRIX.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            docs/SESSION_17_KNOWLEDGE_GRAPH.md
          git diff --cached --quiet && { echo 'materializer produced no diff'; exit 1; }
          git commit -m 'chore: materialize MIG-01.7B evidence [skip ci]'
          git push origin HEAD:feat/m8-profile-workflow
