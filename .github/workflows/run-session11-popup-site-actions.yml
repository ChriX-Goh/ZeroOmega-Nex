name: Deliver Expanded Popup Evidence Capture

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-session11-popup-site-actions.yml

permissions:
  contents: write

jobs:
  deliver:
    if: github.head_ref == 'wip/session11-popup-site-actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact WIP head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild and verify evidence capture from ordinary Head
        shell: bash
        run: |
          set -euo pipefail
          baseline=6147977da6172cae2fba7880df124aa22082be56
