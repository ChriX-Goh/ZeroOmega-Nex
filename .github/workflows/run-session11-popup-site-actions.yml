name: Run Session 11 Popup Site Actions

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-session11-popup-site-actions.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'wip/session11-popup-site-actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact WIP head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          source_file=.github/workflows/apply-session11-popup-site-actions.yml
          awk '
            /cat > \/tmp\/session11\.patch\.gz\.b64/ { capture=1; next }
            capture && /^PATCH_B64$/ { exit }
            capture { print }
          ' "$source_file" > /tmp/session11.patch.gz.b64
          tr -d '\n' < /tmp/session11.patch.gz.b64 | base64 -d > /tmp/session11.patch.gz
          echo '985612ee0c8709e39ad3216c9d0b72b8e02dc96708750c2a658a3ac3b486bc52  /tmp/session11.patch.gz' | sha256sum -c -
          gzip -dc /tmp/session11.patch.gz > /tmp/session11.patch
          echo '5cb18cc5cd66825b7b407b2b907ec910c19c311d1a414d02a49cca94458cc1d1  /tmp/session11.patch' | sha256sum -c -
          git apply --index /tmp/session11.patch
          rm -f \
            .github/workflows/apply-session11-popup-site-actions.yml \
            .github/workflows/run-session11-popup-site-actions.yml

      - name: Update native Popup UI guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-ui-compatibility.mjs')
          source = path.read_text(encoding='utf-8')
          start_token = "    popupApp.includes('data-popup-locale={locale}') &&\n"
          end_token = "      chromiumE2e.includes(\"getByRole('button', { name: '添加条件', exact: true })\"),\n"
          start = source.index(start_token)
          end = source.index(end_token, start) + len(end_token)
          replacement = """    popupApp.includes('data-popup-locale={locale}') &&
            popupApp.includes("uiMessage('popup.temporaryFor'") &&
            popupApp.includes("uiText('popup.addCondition', locale)") &&
            popupApp.includes('data-popup-temporary-rule-toggle') &&
            popupApp.includes('data-popup-temporary-rule-menu') &&
            popupApp.includes("uiText('popup.ownership.details', locale)") &&
            popupApp.includes("uiText('popup.optionsAria', locale)") &&
            !popupApp.includes('translate(') &&
            !popupApp.includes('errorMessage = response.message') &&
            !popupApp.includes('error instanceof Error ? error.message') &&
            !popupApp.includes('data-popup-temporary-profile-select') &&
            chromiumE2e.includes('Popup typed locale coverage regressed') &&
            chromiumE2e.includes("locator('[data-popup-temporary-rule-toggle]')") &&
            chromiumE2e.includes("locator('[data-popup-temporary-rule-menu]')") &&
            chromiumE2e.includes("getByRole('button', { name: '添加条件', exact: true })"),
          """
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY

      - name: Format final files
        run: |
          pnpm exec prettier --write \
            .github/workflows/original-nex-ui-evidence.yml \
            apps/extension/src/entrypoints/popup/App.svelte \
            apps/extension/src/entrypoints/popup/OriginalPopupIcon.svelte \
            apps/extension/src/entrypoints/popup/main.ts \
            apps/extension/src/entrypoints/popup/original-compat.css \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            scripts/capture-original-nex-popup-site-action-evidence.mjs \
            scripts/validate-ui-compatibility.mjs \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            docs/AUDIT_EVIDENCE_02P_POPUP_SITE_ACTIONS.md

      - name: Verify final WIP tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/extension/src/entrypoints/popup/original-site-action-compat.ts
          test ! -e apps/extension/src/entrypoints/popup/original-site-action-compat.css
          test ! -e .github/workflows/wip-source-archive.yml
          test ! -e .github/workflows/apply-session11-popup-site-actions.yml
          test ! -e .github/workflows/run-session11-popup-site-actions.yml
          git diff --check
          pnpm verify

      - name: Build clean commit from active baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline=5d2b3260f6106fbcf53b3aeeb8bbe230016f98ba
          git config user.name 'ChriX-Goh'
          git config user.email '17531787+ChriX-Goh@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore original Popup current-site actions'
          final_wip="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin "$baseline"
          git diff --binary "$baseline" "$final_wip" -- . \
            ':(exclude).github/workflows/original-nex-ui-evidence.yml' \
            > /tmp/session11-clean.patch
          test -s /tmp/session11-clean.patch
          git switch --detach "$baseline"
          git apply --index /tmp/session11-clean.patch
          python - <<'PY'
          import base64
          from pathlib import Path

          audit_path = Path('docs/UI_AUDIT_MATRIX.md')
          lines = audit_path.read_text(encoding='utf-8').splitlines()
          audit_path.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')

          validator_path = Path('scripts/validate-parity-docs.mjs')
          source = validator_path.read_text(encoding='utf-8')
          marker = 'if (failures.length > 0) {'
          contract_token = 'Popup current-site parity contract'
          if contract_token not in source:
              contract = base64.b64decode('').decode('utf-8')
              contract = contract.replace("'AUDIT_EVIDENCE_02P'", "'Original↔Nex'", 1)
              contract = contract.replace("'AUDIT_EVIDENCE_02P'", "'无常驻 select'", 1)
              source = source.replace(marker, contract + '\n' + marker, 1)
              validator_path.write_text(source, encoding='utf-8')
          PY
          pnpm exec prettier --write docs/UI_AUDIT_MATRIX.md scripts/validate-parity-docs.mjs
          git add docs/UI_AUDIT_MATRIX.md scripts/validate-parity-docs.mjs
          test ! -e .github/workflows/wip-source-archive.yml
          test ! -e .github/workflows/apply-session11-popup-site-actions.yml
          test ! -e .github/workflows/run-session11-popup-site-actions.yml
          git diff --check --cached
          rm -rf dist browser-builds
          pnpm verify
          git commit -m 'fix: restore original Popup current-site actions'
          git push origin HEAD:feat/m8-profile-workflow
