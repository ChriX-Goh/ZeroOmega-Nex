name: Integrate stable source update errors

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-source-update-errors.yml
      - .github/patches/*source-update-error*.py

permissions:
  contents: write

concurrency:
  group: integrate-source-update-errors-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply stable source-update error slice
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/apply-source-update-error-core.py
            python .github/patches/apply-source-update-error-runtime.py
            python .github/patches/fix-source-update-error-test-patch.py
            python .github/patches/apply-source-update-error-ui-tests.py
            python .github/patches/apply-source-update-error-e2e-docs.py
          } 2>&1 | tee source-update-error-apply.log
      - name: Format product slice
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee source-update-error-format.log
      - name: Generate classified locale inventory
        run: |
          set -o pipefail
          pnpm locale:inventory 2>&1 | tee source-update-error-inventory.log
          pnpm exec prettier --write docs/LOCALE_INVENTORY.json
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee source-update-error-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium source-update failure regression
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee source-update-error-chromium.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-update-errors-${{ github.run_id }}
          path: source-update-error-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-source-update-errors.yml
          rm -f \
            .github/patches/apply-source-update-error-core.py \
            .github/patches/apply-source-update-error-runtime.py \
            .github/patches/fix-source-update-error-test-patch.py \
            .github/patches/apply-source-update-error-ui-tests.py \
            .github/patches/apply-source-update-error-e2e-docs.py \
            source-update-error-apply.log \
            source-update-error-format.log \
            source-update-error-inventory.log \
            source-update-error-verify.log \
            source-update-error-chromium.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add stable source update errors"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
