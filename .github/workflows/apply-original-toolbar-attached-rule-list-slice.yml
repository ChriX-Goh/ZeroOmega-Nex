name: Apply original attached Rule List toolbar slice

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-original-toolbar-attached-rule-list-slice.yml
      - scripts/apply-original-toolbar-attached-rule-list-slice.py

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply and verify
        run: |
          python scripts/apply-original-toolbar-attached-rule-list-slice.py
          pnpm exec prettier --write \
            apps/extension/src/lib/original-toolbar-profile-resolver.ts \
            apps/extension/src/lib/original-toolbar-profile-resolver.test.ts \
            scripts/e2e-chromium-toolbar.mjs \
            scripts/e2e-firefox.mjs \
            docs/AUDIT_EVIDENCE_01H_ORIGINAL_ATTACHED_RULE_LIST_RESULTS.md
          pnpm verify
          pnpm exec playwright install --with-deps chromium
          pnpm build:chromium
          pnpm test:e2e:chromium-toolbar
          pnpm build:firefox
          for iteration in 1 2 3; do
            echo ">>>>> FIREFOX ATTACHED RULE LIST ITERATION ${iteration}"
            pnpm test:e2e:firefox-toolbar
          done
      - name: Commit ordinary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/extension/src/lib/original-toolbar-profile-resolver.ts \
            apps/extension/src/lib/original-toolbar-profile-resolver.test.ts \
            scripts/e2e-chromium-toolbar.mjs \
            scripts/e2e-firefox.mjs \
            docs/AUDIT_EVIDENCE_01H_ORIGINAL_ATTACHED_RULE_LIST_RESULTS.md
          git rm -f \
            scripts/apply-original-toolbar-attached-rule-list-slice.py \
            scripts/audit-original-toolbar-attached-rule-list-results.mjs
          git commit -m 'feat: reproduce original attached Rule List toolbar results'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
