name: Bootstrap Milestone 8 Browser E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lock browser automation dependencies
        run: pnpm add -Dw @playwright/test selenium-webdriver

      - name: Format browser E2E slice
        run: |
          pnpm exec prettier --write \
            package.json \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build browser targets
        run: pnpm build

      - name: Run browser E2E
        shell: bash
        run: |
          set -o pipefail
          {
            firefox --version
            pnpm test:e2e
          } 2>&1 | tee m8-browser-e2e.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-browser-e2e-diagnostics
          path: m8-browser-e2e.log
          if-no-files-found: warn

      - name: Commit browser E2E dependencies and scripts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml scripts/e2e-chromium.mjs scripts/e2e-firefox.mjs
          git commit -m 'test: add Chromium and Firefox extension E2E'
          git push origin HEAD:feat/m8-profile-workflow
