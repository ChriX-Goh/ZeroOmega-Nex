name: Format Fixed E2E Once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/e2e-chromium.mjs
      - name: Commit formatted script and remove executor
        run: |
          rm -f .github/workflows/format-fixed-e2e-once.yml .github/format-fixed-e2e-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts/e2e-chromium.mjs .github/workflows/format-fixed-e2e-once.yml .github/format-fixed-e2e-trigger.txt
          git commit -m 'style: format Fixed Profile browser test'
          git push origin HEAD:feat/m8-profile-workflow
