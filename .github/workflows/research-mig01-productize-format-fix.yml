name: Research MIG-01.7 Productize Format Fix

on:
  push:
    branches:
      - research/mig01-semantic-productize
    paths:
      - '.github/workflows/research-mig01-productize-format-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-semantic-productize
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format only MIG-01.7 touched files reported by verify
        run: >-
          pnpm exec prettier --write
          docs/ORIGINAL_KNOWLEDGE_GRAPH.md
          docs/UI_AUDIT_MATRIX.md
          scripts/e2e-chromium-original-large-migration.mjs
          scripts/e2e-firefox-original-large-migration.mjs
          scripts/validate-mig01-semantic-evidence.mjs
      - name: Commit mechanical formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ORIGINAL_KNOWLEDGE_GRAPH.md docs/UI_AUDIT_MATRIX.md scripts/e2e-chromium-original-large-migration.mjs scripts/e2e-firefox-original-large-migration.mjs scripts/validate-mig01-semantic-evidence.mjs
          git diff --cached --check
          git commit -m 'style: format MIG-01.7 consolidation evidence'
          git push origin HEAD:research/mig01-semantic-productize
