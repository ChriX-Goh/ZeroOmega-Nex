name: M6 bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/m6-pac-compiler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m6-pac-compiler
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Register workspace, format, and remove workflow
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/pac-compiler package.json pnpm-lock.yaml
          rm .github/workflows/m6-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml packages/pac-compiler .github/workflows/m6-bootstrap.yml
          git commit -m "build(pac): register compiler workspace"
          git push origin HEAD:feat/m6-pac-compiler
