name: Rebuild Original Options Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild original-compatible Options UI
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/rebuild-original-options.py')
          text = path.read_text()
          text = text.replace(
              """optionsApp.includes("activeSection === 'general'")""",
              r"""optionsApp.includes(\"activeSection === 'general'\")""",
          )
          text = text.replace(
              """optionsApp.includes("activeSection === 'profile'")""",
              r"""optionsApp.includes(\"activeSection === 'profile'\")""",
          )
          path.write_text(text)
          PY
          python .github/scripts/rebuild-original-options.py 2>&1 | tee original-options-patch.log
          python - <<'PY'
          from pathlib import Path
          validator = Path('scripts/validate-ui-compatibility.mjs')
          validator.write_text(
              validator.read_text().replace(
                  "optionsApp.includes('class=\"actions\"')",
                  "optionsApp.includes('class=\"nav-group actions\"')",
              )
          )
          theme = Path('apps/extension/src/entrypoints/options/ThemePanel.svelte')
          theme.write_text(theme.read_text().replace('export type ThemeMode', 'type ThemeMode'))
          app = Path('apps/extension/src/entrypoints/options/App.svelte')
          app.write_text(
              app.read_text().replace(
                  'profileId?: string',
                  'profileId: string | undefined = undefined',
              )
          )
          components = Path('apps/extension/src/component-rendering.component.spec.ts')
          component_text = components.read_text()
          component_text = component_text.replace(
              "expect(body).toContain('Import ZeroOmega / SwitchyOmega backup');",
              "expect(body).toContain('Restore original ZeroOmega / SwitchyOmega backup');",
          )
          component_text = component_text.replace(
              "expect(body).toContain('Import and use now');",
              "expect(body).toContain('Paste backup text instead');",
          )
          components.write_text(component_text)
          PY

      - name: Format rebuilt slice
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/LegacyImportPanel.svelte \
            apps/extension/src/entrypoints/options/ThemePanel.svelte \
            apps/extension/src/entrypoints/options/style.css \
            apps/extension/src/entrypoints/options/index.html \
            apps/extension/src/component-rendering.component.spec.ts \
            scripts/validate-ui-compatibility.mjs

      - name: Verify rebuilt slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm validate:ui
            pnpm --filter @zeroomega-nex/extension check
            pnpm test:components
            pnpm verify
          } 2>&1 | tee original-options-rebuild.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-options-rebuild-diagnostics
          path: |
            original-options-patch.log
            original-options-rebuild.log
          if-no-files-found: warn

      - name: Commit rebuilt Options workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/LegacyImportPanel.svelte \
            apps/extension/src/entrypoints/options/ThemePanel.svelte \
            apps/extension/src/entrypoints/options/style.css \
            apps/extension/src/entrypoints/options/index.html \
            apps/extension/src/component-rendering.component.spec.ts \
            scripts/validate-ui-compatibility.mjs
          git commit -m 'feat: restore original Options workflow and system theme'
          git push origin HEAD:feat/m8-profile-workflow
