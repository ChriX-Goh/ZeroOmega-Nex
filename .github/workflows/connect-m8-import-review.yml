name: Connect Milestone 8 Import Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  connect:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Connect import review
        run: python .github/scripts/connect-m8-import-review.py

      - name: Format import review slice
        shell: bash
        run: |
          set -o pipefail
          pnpm exec prettier --write \
            apps/extension/package.json \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/LegacyImportPanel.svelte \
            pnpm-lock.yaml 2>&1 | tee m8-import-format.log

      - name: Verify import review slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @zeroomega-nex/legacy-zeroomega check
            pnpm --filter @zeroomega-nex/extension check
            pnpm exec vitest run packages/legacy-zeroomega/src
          } 2>&1 | tee m8-import-review.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-import-review-diagnostics
          path: |
            m8-import-format.log
            m8-import-review.log
            apps/extension/package.json
            apps/extension/src/entrypoints/options/App.svelte
            apps/extension/src/entrypoints/options/LegacyImportPanel.svelte
            pnpm-lock.yaml
          if-no-files-found: warn

      - name: Commit import review integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/package.json \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/LegacyImportPanel.svelte \
            pnpm-lock.yaml
          git commit -m 'feat: add inactive legacy import review'
          git push origin HEAD:feat/m8-profile-workflow
