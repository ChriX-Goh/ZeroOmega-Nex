name: Verify and integrate Switch source editor

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-switch-source-editor.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconstruct and apply verified patch
        run: |
          cat .github/patches/switch-source-editor.* | base64 --decode > /tmp/switch-source-editor.patch.gz
          echo '0e46e9c9aa8a8e1a070c1659ff9c595a6e71aca1709c87cc5376dc9949a60b2b  /tmp/switch-source-editor.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/switch-source-editor.patch.gz > /tmp/switch-source-editor.patch
          echo '1ce7cbb64ce970fe7aee3d24f5e56f032ecd9042571db05d609d63cd6b15da1b  /tmp/switch-source-editor.patch' | sha256sum --check
          git apply --check /tmp/switch-source-editor.patch
          git apply /tmp/switch-source-editor.patch
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/extension/src/component-rendering.component.spec.ts \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/SwitchProfileEditor.svelte \
            docs/MILESTONE_8_STATUS.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            packages/profile-workflow/src/index.ts \
            packages/profile-workflow/src/switch-operations.test.ts \
            packages/profile-workflow/src/switch-operations.ts \
            packages/profile-workflow/src/switch-source.test.ts \
            packages/profile-workflow/src/switch-source.ts \
            scripts/validate-ui-compatibility.mjs
      - name: Verify repository
        run: pnpm verify
      - name: Clean generated and temporary files
        run: |
          rm -rf browser-builds browser-builds.tar.gz
          git clean -fdX
          rm -f .github/workflows/capture-switch-source-editor-context.yml
          rm -f .github/workflows/apply-switch-source-editor.yml
          rm -rf .github/patches
          git diff --check
      - name: Commit verified Switch source editor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: restore Switch source editing'
          git pull --rebase origin feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
