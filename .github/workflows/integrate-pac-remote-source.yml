name: Integrate PAC remote source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-pac-remote-source.yml

permissions:
  contents: write

concurrency:
  group: integrate-pac-remote-source-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply PAC remote source slice
        env:
          PAC_REMOTE_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/fix-pac-remote-validator-path.py
            python .github/patches/apply-pac-remote-model.py
            python .github/patches/apply-pac-remote-workflow.py
            python .github/patches/apply-pac-remote-ui.py
            python .github/patches/fix-pac-remote-types.py
            python .github/patches/fix-pac-remote-component-expectation.py
            python .github/patches/fix-pac-remote-validator-loads.py
            pnpm --filter @zeroomega-nex/profile-spec generate:validator
          } 2>&1 | tee pac-remote-apply.log
      - name: Format product slice
        run: pnpm format
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee pac-remote-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E host candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium regression suite
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee pac-remote-e2e.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pac-remote-integration-${{ github.run_id }}
          path: pac-remote-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-pac-remote-source.yml
          rm -f \
            .github/patches/fix-pac-remote-validator-path.py \
            .github/patches/fix-pac-remote-validator-loads.py \
            .github/patches/fix-pac-remote-types.py \
            .github/patches/fix-pac-remote-component-expectation.py \
            .github/patches/apply-pac-remote-model.py \
            .github/patches/apply-pac-remote-workflow.py \
            .github/patches/apply-pac-remote-ui.py \
            pac-remote-apply.log \
            pac-remote-verify.log \
            pac-remote-e2e.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: restore PAC remote source workflow"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
