name: Research MIG-01 Failure Core

on:
  push:
    branches:
      - research/mig01-failure-preservation
    paths:
      - '.github/workflows/research-mig01-failure-core.yml'

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-failure-preservation
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Wire recovery into storage parser, exports, and background startup
        shell: python
        run: |
          from pathlib import Path

          storage = Path('packages/profile-workflow/src/storage-repository.ts')
          text = storage.read_text()
          old = "if (stage !== 'prepare' && stage !== 'activate' && stage !== 'commit' && stage !== 'rollback') {"
          new = "if (\n    stage !== 'prepare' &&\n    stage !== 'activate' &&\n    stage !== 'commit' &&\n    stage !== 'rollback' &&\n    stage !== 'recovery'\n  ) {"
          if old not in text:
            raise SystemExit('lastApply stage parser anchor missing')
          storage.write_text(text.replace(old, new, 1))

          index = Path('packages/profile-workflow/src/index.ts')
          text = index.read_text()
          anchor = "export { applyProfileWorkflow } from './apply.js';\n"
          addition = "export {\n  recoverInterruptedProfileWorkflowApply,\n  type ProfileWorkflowInterruptedApplyRecoveryResult,\n} from './apply-recovery.js';\n"
          if anchor not in text:
            raise SystemExit('index apply export anchor missing')
          index.write_text(text.replace(anchor, anchor + addition, 1))

          background = Path('apps/extension/src/entrypoints/background.ts')
          text = background.read_text()
          old_import = "import { BrowserStorageProfileWorkflowRepository } from '@zeroomega-nex/profile-workflow';"
          new_import = "import {\n  BrowserStorageProfileWorkflowRepository,\n  recoverInterruptedProfileWorkflowApply,\n} from '@zeroomega-nex/profile-workflow';"
          if old_import not in text:
            raise SystemExit('background workflow import anchor missing')
          text = text.replace(old_import, new_import, 1)

          old_toolbar = "  const toolbarRuntime = registerOriginalToolbarRuntime({\n    api: rendererE2eProbe?.api ?? toolbarApi,\n    repository: new BrowserStorageProfileWorkflowRepository(browser.storage.local),"
          new_toolbar = "  const workflowRepository = new BrowserStorageProfileWorkflowRepository(browser.storage.local);\n  const toolbarRuntime = registerOriginalToolbarRuntime({\n    api: rendererE2eProbe?.api ?? toolbarApi,\n    repository: workflowRepository,"
          if old_toolbar not in text:
            raise SystemExit('background toolbar repository anchor missing')
          text = text.replace(old_toolbar, new_toolbar, 1)

          old_recovery = "      if (restoreDisposition === 'failed') return;\n      const restoredRuntime = (await activationDriver.inspectRuntime?.()) ?? {};"
          new_recovery = "      if (restoreDisposition === 'failed') return;\n      if (response.state.pendingApply) {\n        const recoveredApply = await recoverInterruptedProfileWorkflowApply(\n          workflowRepository,\n          activationDriver,\n          new Date().toISOString(),\n        );\n        if (recoveredApply.status === 'recovered') {\n          console.info(\n            `[${productIdentity.name}] interrupted profile Apply ${recoveredApply.applyId} rolled back on restart.`,\n          );\n          await refreshToolbar('interrupted profile Apply recovery');\n          return;\n        }\n        if (recoveredApply.status !== 'nothing-pending') {\n          console.error(\n            `[${productIdentity.name}] interrupted profile Apply recovery did not complete:`,\n            recoveredApply.message,\n          );\n          return;\n        }\n      }\n      const restoredRuntime = (await activationDriver.inspectRuntime?.()) ?? {};"
          if old_recovery not in text:
            raise SystemExit('background restore anchor missing')
          background.write_text(text.replace(old_recovery, new_recovery, 1))
      - name: Add interrupted Apply recovery tests
        shell: bash
        run: |
          cat > packages/profile-workflow/src/apply-recovery.test.ts <<'TS'
          import { cloneProfileSpec } from '@zeroomega-nex/profile-spec';
          import { describe, expect, it } from 'vitest';

          import { recoverInterruptedProfileWorkflowApply } from './apply-recovery.js';
          import type { ProfileWorkflowActivationDriver, ProfileWorkflowState } from './contracts.js';
          import { MemoryProfileWorkflowRepository } from './memory-repository.js';
          import { createProfileWorkflowState, updateProfileWorkflowDraft } from './state.js';
          import { workflowFixture } from './test-fixture.js';

          class RecoveryDriver implements ProfileWorkflowActivationDriver {
            rollbackCount = 0;
            rollbackError?: Error;
            lastRollbackRevision?: string;

            async activate() {
              return { snapshotId: 'unused' };
            }

            async rollback(previousApplied: Parameters<ProfileWorkflowActivationDriver['rollback']>[0]) {
              this.rollbackCount += 1;
              this.lastRollbackRevision = previousApplied.revision.id;
              if (this.rollbackError) throw this.rollbackError;
            }
          }

          function interruptedState(phase: 'activating' | 'committing' | 'rollback-required'): ProfileWorkflowState {
            const clean = createProfileWorkflowState(workflowFixture());
            const dirty = updateProfileWorkflowDraft(clean, (draft) => {
              draft.profiles[0]!.name = 'Interrupted candidate edit';
            });
            const candidate = cloneProfileSpec(dirty.draft);
            candidate.revision = {
              id: 'revision-interrupted-candidate',
              parentId: clean.applied.revision.id,
              createdAt: '2026-08-07T08:00:00.000Z',
              deviceId: 'device-recovery-test',
            };
            return {
              ...dirty,
              generation: dirty.generation + 1,
              pendingApply: {
                applyId: `apply-${phase}`,
                candidate,
                previousAppliedRevisionId: clean.applied.revision.id,
                startedAt: '2026-08-07T08:00:00.000Z',
                phase,
              },
            };
          }

          describe('interrupted profile Apply restart recovery', () => {
            it.each(['activating', 'committing', 'rollback-required'] as const)(
              'restores previous Applied, clears %s pending state, and preserves Draft for retry',
              async (phase) => {
                const state = interruptedState(phase);
                const repository = new MemoryProfileWorkflowRepository(state);
                const driver = new RecoveryDriver();

                const result = await recoverInterruptedProfileWorkflowApply(
                  repository,
                  driver,
                  '2026-08-07T08:01:00.000Z',
                );

                expect(result.status).toBe('recovered');
                if (result.status !== 'recovered') throw new Error(JSON.stringify(result));
                expect(driver.rollbackCount).toBe(1);
                expect(driver.lastRollbackRevision).toBe(state.applied.revision.id);
                expect(result.state.applied).toEqual(state.applied);
                expect(result.state.draft).toEqual(state.draft);
                expect(result.state.pendingApply).toBeUndefined();
                expect(result.state.generation).toBe(state.generation + 1);
                expect(result.state.lastApply).toMatchObject({
                  status: 'failed',
                  applyId: `apply-${phase}`,
                  stage: 'recovery',
                  rollbackSucceeded: true,
                });
              },
            );

            it('keeps rollback-required pending state when previous browser configuration cannot be restored', async () => {
              const state = interruptedState('committing');
              const repository = new MemoryProfileWorkflowRepository(state);
              const driver = new RecoveryDriver();
              driver.rollbackError = new Error('browser restore failed');

              const result = await recoverInterruptedProfileWorkflowApply(
                repository,
                driver,
                '2026-08-07T08:02:00.000Z',
              );

              expect(result).toMatchObject({
                status: 'failed',
                rollbackSucceeded: false,
                state: {
                  applied: state.applied,
                  draft: state.draft,
                  pendingApply: { phase: 'rollback-required' },
                  lastApply: { stage: 'recovery', rollbackSucceeded: false },
                },
              });
            });

            it('does nothing when no Apply is pending', async () => {
              const state = createProfileWorkflowState(workflowFixture());
              const repository = new MemoryProfileWorkflowRepository(state);
              const driver = new RecoveryDriver();
              const result = await recoverInterruptedProfileWorkflowApply(
                repository,
                driver,
                '2026-08-07T08:03:00.000Z',
              );
              expect(result).toMatchObject({ status: 'nothing-pending', state });
              expect(driver.rollbackCount).toBe(0);
              await expect(repository.read()).resolves.toEqual(state);
            });
          });
          TS
      - name: Format and test recovery core
        run: |
          pnpm exec prettier --write \
            packages/profile-workflow/src/apply-recovery.ts \
            packages/profile-workflow/src/apply-recovery.test.ts \
            packages/profile-workflow/src/contracts.ts \
            packages/profile-workflow/src/storage-repository.ts \
            packages/profile-workflow/src/index.ts \
            apps/extension/src/entrypoints/background.ts
          pnpm exec vitest run packages/profile-workflow/src/apply-recovery.test.ts packages/profile-workflow/src/apply.test.ts packages/profile-workflow/src/storage-repository.test.ts packages/browser-adapters/src/activation.test.ts --reporter=verbose
          pnpm --filter @zeroomega-nex/profile-workflow check
          pnpm --filter @zeroomega-nex/extension check
      - name: Commit tested recovery core
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/profile-workflow/src \
            apps/extension/src/entrypoints/background.ts
          git diff --cached --check
          git commit -m 'fix: recover interrupted profile Apply on restart'
          git push origin HEAD:research/mig01-failure-preservation
