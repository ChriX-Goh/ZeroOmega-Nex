  it('rejects URL metadata and non-documentation IPv6 identifiers', async () => {
    const { data } = await fixture();

    const url = structuredClone(data);
    url['+PAC 中文'].pacUrl = 'https://owner:secret@pac.example.com/private?token=secret#owner';
    expect(() => assertSanitizedSafety(url)).toThrow(
      /URL credentials|URL query or fragment|URL path/u,
    );

    const ipv6 = structuredClone(data);
    ipv6['+PAC 中文'].pacScript += '\\nreturn "PROXY [fd00::1234]:8080";';
    expect(() => assertSanitizedSafety(ipv6)).toThrow(/non-reserved network identifier/u);
  });

'''
          if anchor not in source:
              raise SystemExit('test insertion anchor not found')
          source = source.replace(anchor, insert + anchor, 1)
          test.write_text(source)

          doc = Path('docs/MIG_01_CORPUS_B_INTAKE.md')
          source = doc.read_text()
          source = source.replace(
              '- condition, Rule List or PAC text contains non-reserved domain/IP identifiers.\n',
              '- condition, Rule List or PAC text contains non-reserved domain/IP identifiers;\n- URL-bearing fields retain credentials, query/fragment data, or a path other than `/redacted`.\n',
              1,
          )
          source = source.replace(
              '- PAC line/token shape;\n- Rule List line/category shape;\n',
              '- ordered PAC line syntax shape after masking identifiers and literal values;\n- ordered Rule List line/category syntax shape after masking identifiers and literal values;\n',
              1,
          )
          doc.write_text(source)
          PY
          pnpm exec prettier --write scripts/owner-corpus-b-intake.mjs packages/legacy-zeroomega/src/owner-corpus-b-intake.test.mjs docs/MIG_01_CORPUS_B_INTAKE.md
          git diff --check
          pnpm exec vitest run packages/legacy-zeroomega/src/owner-corpus-b-intake.test.mjs
          pnpm verify
      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/owner-corpus-b-intake.mjs packages/legacy-zeroomega/src/owner-corpus-b-intake.test.mjs docs/MIG_01_CORPUS_B_INTAKE.md
          git diff --cached --quiet && { echo 'hardening produced no diff'; exit 1; }
          git commit -m 'test: harden Corpus B intake privacy gates [skip ci]'
          git push origin HEAD:feat/m8-profile-workflow
