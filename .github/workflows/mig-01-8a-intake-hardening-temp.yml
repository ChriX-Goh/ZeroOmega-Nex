  )) {
    if (match[1]) tokens.add(match[1]);
  }
  for (const match of value.matchAll(
'''
          if old not in source:
              raise SystemExit('network token insertion point not found')
          source = source.replace(old, new, 1)

          old = '''    if (NETWORK_KEY.test(key)) {
      let host = value;
      try {
        if (/^[a-z][a-z0-9+.-]*:\\/\\//iu.test(value)) host = new URL(value).hostname;
      } catch {
        problems.add('invalid network URL');
        return;
      }
      if (host && !safeHost(host)) problems.add('usable network endpoint');
    }
'''
          new = '''    if (NETWORK_KEY.test(key)) {
      let host = value;
      try {
        if (/^[a-z][a-z0-9+.-]*:\\/\\//iu.test(value)) {
          const parsed = new URL(value);
          host = parsed.hostname;
          if (parsed.username || parsed.password) problems.add('unredacted URL credentials');
          if (parsed.search || parsed.hash) problems.add('unredacted URL query or fragment');
          if (
            parsed.pathname !== '/' &&
            !/^\\/(?:redacted)(?:\\/redacted)*\\/?$/u.test(parsed.pathname)
          ) {
            problems.add('unredacted URL path');
          }
        }
      } catch {
        problems.add('invalid network URL');
        return;
      }
      if (host && !safeHost(host)) problems.add('usable network endpoint');
    }
'''
          if old not in source:
              raise SystemExit('network URL block not found')
          source = source.replace(old, new, 1)
          script.write_text(source)

          test = Path('packages/legacy-zeroomega/src/owner-corpus-b-intake.test.mjs')
          source = test.read_text()
          old = '''    expect(manifest.containsRawValues).toBe(false);
    expect(JSON.stringify(manifest)).not.toContain('nested.corpus.example.com');
    expect(JSON.stringify(manifest)).not.toContain('corpus proxy');
    expect(verifyAgainstManifest(data, manifest)).toEqual(manifest.metrics);
'''
          new = '''    expect(manifest.containsRawValues).toBe(false);
    expect(JSON.stringify(manifest)).not.toContain('nested.corpus.example.com');
    expect(JSON.stringify(manifest)).not.toContain('corpus proxy');
    const sanitized = structuredClone(data);
    sanitized['+PAC 中文'].pacUrl = 'https://pac.example.com/redacted';
    expect(verifyAgainstManifest(sanitized, manifest)).toEqual(manifest.metrics);
