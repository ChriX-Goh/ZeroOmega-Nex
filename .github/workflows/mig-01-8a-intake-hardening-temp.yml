name: MIG-01.8A temporary intake hardening

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/mig-01-8a-intake-hardening-temp.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply and verify hardening
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mig-01-8a-hardening-patch-temp.py
          pnpm exec prettier --write scripts/owner-corpus-b-intake.mjs packages/legacy-zeroomega/src/owner-corpus-b-intake.test.ts docs/MIG_01_CORPUS_B_INTAKE.md
          git diff --check
          pnpm exec vitest run packages/legacy-zeroomega/src/owner-corpus-b-intake.test.ts
          pnpm verify
      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/owner-corpus-b-intake.mjs packages/legacy-zeroomega/src/owner-corpus-b-intake.test.ts docs/MIG_01_CORPUS_B_INTAKE.md
          git diff --cached --quiet && { echo 'hardening produced no diff'; exit 1; }
          git commit -m 'test: harden Corpus B intake privacy gates [skip ci]'
          git push origin HEAD:feat/m8-profile-workflow

# retry: Node CLI integration is Vitest-only
