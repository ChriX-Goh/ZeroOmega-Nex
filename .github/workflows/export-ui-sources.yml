name: Export UI Sources

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout exact pull request Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Upload UI source slice
        uses: actions/upload-artifact@v4
        with:
          name: zeroomega-ui-source-slice
          path: |
            apps/extension/src/entrypoints/options/App.svelte
            apps/extension/src/entrypoints/options/FixedProfileEditor.svelte
            apps/extension/src/entrypoints/options/style.css
            apps/extension/src/entrypoints/options/main.ts
            apps/extension/src/entrypoints/popup/App.svelte
            apps/extension/src/entrypoints/popup/style.css
            apps/extension/src/entrypoints/popup/main.ts
            apps/extension/src/lib/ui-messages.ts
            packages/core-contracts/src/index.ts
          if-no-files-found: error
