name: Browser E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Chromium extension
        run: WXT_ICON_RENDERER_E2E=1 ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium

      - name: Run Chromium extension E2E
        env:
          ZEROOMEGA_MIG01_SEMANTIC_EVIDENCE_FILE: ${{ github.workspace }}/evidence/chromium.jsonl
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee chromium-e2e.log

      - name: Run Chromium MIG-01.7 secret-leak sentinel
        env:
          ZEROOMEGA_MIG01_SEMANTIC_EVIDENCE_FILE: ${{ github.workspace }}/evidence/chromium.jsonl
        run: node scripts/e2e-chromium-mig01-secret-leak.mjs

      - name: Upload Chromium MIG-01.7 semantic evidence
        uses: actions/upload-artifact@v4
        with:
          name: mig01-semantic-chromium
          path: evidence/chromium.jsonl
          if-no-files-found: error

      - name: Run Chromium toolbar Action E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium-toolbar 2>&1 | tee chromium-toolbar-e2e.log

      - name: Run Chromium toolbar restart E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium-toolbar-restart 2>&1 | tee chromium-toolbar-restart-e2e.log

      - name: Run Chromium attached Rule List toolbar E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium-attached-rule-list-toolbar 2>&1 | tee chromium-attached-rule-list-toolbar-e2e.log

      - name: Run Chromium Toolbar profile trace E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium-profile-traces-toolbar 2>&1 | tee chromium-profile-traces-toolbar-e2e.log

      - name: Run Chromium external-control Toolbar E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium-external-control-toolbar 2>&1 | tee chromium-external-control-toolbar-e2e.log

      - name: Run Chromium Popup external-profile E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium-popup-external-profile 2>&1 | tee chromium-popup-external-profile-e2e.log

      - name: Run Chromium renderer fallback Toolbar E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium-renderer-fallback-toolbar 2>&1 | tee chromium-renderer-fallback-toolbar-e2e.log

      - name: Upload Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-diagnostics
          path: |
            chromium-e2e.log
            chromium-toolbar-e2e.log
            chromium-toolbar-restart-e2e.log
            chromium-attached-rule-list-toolbar-e2e.log
            chromium-profile-traces-toolbar-e2e.log
            chromium-external-control-toolbar-e2e.log
            chromium-popup-external-profile-e2e.log
            chromium-renderer-fallback-toolbar-e2e.log
          if-no-files-found: warn

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Firefox version
        run: firefox --version

      - name: Build Firefox extension
        env:
          WXT_ICON_RENDERER_E2E: '1'
        run: pnpm build:firefox

      - name: Run Firefox extension E2E
        env:
          ZEROOMEGA_MIG01_SEMANTIC_EVIDENCE_FILE: ${{ github.workspace }}/evidence/firefox.jsonl
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox 2>&1 | tee firefox-e2e.log

      - name: Run Firefox MIG-01.7 secret-leak sentinel
        env:
          ZEROOMEGA_MIG01_SEMANTIC_EVIDENCE_FILE: ${{ github.workspace }}/evidence/firefox.jsonl
        run: node scripts/e2e-firefox-mig01-secret-leak.mjs

      - name: Upload Firefox MIG-01.7 semantic evidence
        uses: actions/upload-artifact@v4
        with:
          name: mig01-semantic-firefox
          path: evidence/firefox.jsonl
          if-no-files-found: error

      - name: Run Firefox toolbar Action E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox-toolbar 2>&1 | tee firefox-toolbar-e2e.log

      - name: Run Firefox toolbar restart E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox-toolbar-restart 2>&1 | tee firefox-toolbar-restart-e2e.log

      - name: Run Firefox attached Rule List toolbar E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox-attached-rule-list-toolbar 2>&1 | tee firefox-attached-rule-list-toolbar-e2e.log

      - name: Run Firefox Toolbar profile trace E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox-profile-traces-toolbar 2>&1 | tee firefox-profile-traces-toolbar-e2e.log

      - name: Run Firefox external-control Toolbar E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox-external-control-toolbar 2>&1 | tee firefox-external-control-toolbar-e2e.log

      - name: Run Firefox renderer fallback Toolbar E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox-renderer-fallback-toolbar 2>&1 | tee firefox-renderer-fallback-toolbar-e2e.log

      - name: Upload Firefox diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-e2e-diagnostics
          path: |
            firefox-e2e.log
            firefox-toolbar-e2e.log
            firefox-toolbar-restart-e2e.log
            firefox-attached-rule-list-toolbar-e2e.log
            firefox-profile-traces-toolbar-e2e.log
            firefox-external-control-toolbar-e2e.log
            firefox-renderer-fallback-toolbar-e2e.log
          if-no-files-found: warn

  mig01-semantic-consolidation:
    needs: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Chromium semantic evidence
        uses: actions/download-artifact@v4
        with:
          name: mig01-semantic-chromium
          path: evidence/chromium

      - name: Download Firefox semantic evidence
        uses: actions/download-artifact@v4
        with:
          name: mig01-semantic-firefox
          path: evidence/firefox

      - name: Consolidate MIG-01.7 semantic and secret-leak evidence
        run: >-
          node scripts/validate-mig01-semantic-evidence.mjs
          evidence/chromium/chromium.jsonl
          evidence/firefox/firefox.jsonl

  firefox-policy-owned-popup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install locked Firefox proxy policy
        run: |
          firefox --version
          FIREFOX_BIN="$(readlink -f "$(command -v firefox)")"
          FIREFOX_DIR="$(dirname "$FIREFOX_BIN")"
          POLICY='{"policies":{"Proxy":{"Mode":"manual","HTTPProxy":"127.0.0.1:18199","UseHTTPProxyForAllProtocols":true,"Passthrough":"<local>","Locked":true}}}'
          sudo install -d -m 755 "$FIREFOX_DIR/distribution"
          printf '%s\n' "$POLICY" | sudo tee "$FIREFOX_DIR/distribution/policies.json" >/dev/null
          sudo chmod 444 "$FIREFOX_DIR/distribution/policies.json"
          cat "$FIREFOX_DIR/distribution/policies.json"

      - name: Build Firefox extension
        env:
          WXT_ICON_RENDERER_E2E: '1'
        run: pnpm build:firefox

      - name: Run Firefox policy-owned Popup E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox-policy-owned-popup 2>&1 | tee firefox-policy-owned-popup-e2e.log

      - name: Upload Firefox policy-owned Popup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-policy-owned-popup-e2e
          path: firefox-policy-owned-popup-e2e.log
          if-no-files-found: warn

  chromium-native-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium and native UI tools
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 scrot xauth xdotool xvfb

      - name: Build Chromium extension
        run: ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium

      - name: Run native Inspect context-menu E2E
        shell: bash
        run: |
          set -o pipefail
          dbus-run-session -- bash -lc '
            xvfb-run -a -s "-screen 0 1280x800x24 -ac +extension RANDR" \
              pnpm test:e2e:inspect-native
          ' 2>&1 | tee inspect-native-menu-e2e.log

      - name: Upload native Inspect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-native-menu-e2e
          path: |
            inspect-native-menu-e2e.log
            inspect-native-menu-before.png
            inspect-native-menu-failure.png
          if-no-files-found: warn
