name: Browser E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Chromium extension
        run: ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium

      - name: Run Chromium extension E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee chromium-e2e.log

      - name: Run Chromium toolbar Action E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium-toolbar 2>&1 | tee chromium-toolbar-e2e.log

      - name: Run Chromium attached Rule List toolbar E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:chromium-attached-rule-list-toolbar 2>&1 | tee chromium-attached-rule-list-toolbar-e2e.log

      - name: Upload Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-diagnostics
          path: |
            chromium-e2e.log
            chromium-toolbar-e2e.log
            chromium-attached-rule-list-toolbar-e2e.log
          if-no-files-found: warn

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Firefox version
        run: firefox --version

      - name: Build Firefox extension
        run: pnpm build:firefox

      - name: Run Firefox extension E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox 2>&1 | tee firefox-e2e.log

      - name: Run Firefox toolbar Action E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox-toolbar 2>&1 | tee firefox-toolbar-e2e.log

      - name: Run Firefox attached Rule List toolbar E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox-attached-rule-list-toolbar 2>&1 | tee firefox-attached-rule-list-toolbar-e2e.log

      - name: Upload Firefox diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-e2e-diagnostics
          path: |
            firefox-e2e.log
            firefox-toolbar-e2e.log
            firefox-attached-rule-list-toolbar-e2e.log
          if-no-files-found: warn

  chromium-native-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium and native UI tools
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 scrot xauth xdotool xvfb

      - name: Build Chromium extension
        run: ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium

      - name: Run native Inspect context-menu E2E
        shell: bash
        run: |
          set -o pipefail
          dbus-run-session -- bash -lc '
            xvfb-run -a -s "-screen 0 1280x800x24 -ac +extension RANDR" \
              pnpm test:e2e:inspect-native
          ' 2>&1 | tee inspect-native-menu-e2e.log

      - name: Upload native Inspect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-native-menu-e2e
          path: |
            inspect-native-menu-e2e.log
            inspect-native-menu-before.png
            inspect-native-menu-failure.png
          if-no-files-found: warn
