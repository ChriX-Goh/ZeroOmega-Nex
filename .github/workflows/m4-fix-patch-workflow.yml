name: Fix M4 patch workflow

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/m4-zeroomega-importer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m4-zeroomega-importer
      - name: Correct Vitest invocation
        run: |
          sed -i 's#pnpm test -- --run packages/profile-spec/src/index.test.ts packages/profile-spec/src/serialization.test.ts#pnpm exec vitest run packages/profile-spec/src/index.test.ts packages/profile-spec/src/serialization.test.ts#' .github/workflows/m4-profile-spec-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/m4-profile-spec-compat.yml
          git commit -m "ci: correct M4 compatibility test command"
          git push origin HEAD:feat/m4-zeroomega-importer
