name: Research MIG-01.7 Secret Sentinel Fix

on:
  push:
    branches:
      - research/mig01-semantic-consolidation
    paths:
      - '.github/workflows/research-mig01-secret-sentinel-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-semantic-consolidation
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Fix sentinel injection
        run: node scripts/research-fix-mig01-secret-sentinel.mjs
      - name: Format sentinel scripts
        run: pnpm exec prettier --write scripts/e2e-chromium-mig01-secret-leak.mjs scripts/e2e-firefox-mig01-secret-leak.mjs
      - name: Commit fixed sentinel scripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/e2e-chromium-mig01-secret-leak.mjs scripts/e2e-firefox-mig01-secret-leak.mjs
          git diff --cached --check
          git commit -m 'research: inject only secret-bearing sentinel fields'
          git push origin HEAD:research/mig01-semantic-consolidation
