name: Apply default integrity slice

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/apply-default-integrity-slice.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Apply source-backed default integrity corrections
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: replacement count for {old!r} was {text.count(old)}')
              p.write_text(text.replace(old, new))

          editor = 'apps/extension/src/entrypoints/options/AdvancedProfileEditor.svelte'
          replace_once(editor, """      target.location =
                  kind === 'inline'
                    ? { kind: 'inline', content: '! Add rules here.\\n' }
                    : { kind: 'url', url: 'https://example.invalid/rules.txt' };""",
              """      target.location =
                  kind === 'inline' ? { kind: 'inline', content: '' } : { kind: 'url', url: '' };""")
          replace_once(editor, """      target.source =
                  kind === 'inline'
                    ? {
                        kind: 'inline',
                        script: \"function FindProxyForURL(url, host) {\\n  return 'DIRECT';\\n}\\n\",
                      }
                    : { kind: 'url', url: 'https://example.invalid/proxy.pac' };""",
              """      target.source =
                  kind === 'inline' ? { kind: 'inline', script: '' } : { kind: 'url', url: '' };""")
          replace_once(editor, """      headers.push({
                  name: 'User-Agent',
                  value: { kind: 'literal', value: 'ZeroOmega Nex' },
                });""",
              """      headers.push({
                  name: '',
                  value: { kind: 'literal', value: '' },
                });""")

          operations = 'packages/profile-workflow/src/advanced-profile-operations.ts'
          replace_once(operations, """    location: {
                kind: 'inline',
                content: '! Add AutoProxy rules here.\\n',
              },""",
              """    location: {
                kind: 'inline',
                content: '',
              },""")
          replace_once('packages/profile-workflow/src/advanced-profile-operations.test.ts',
              """        format: 'autoproxy',
                  location: expect.objectContaining({ kind: 'inline' }),""",
              """        format: 'autoproxy',
                  location: { kind: 'inline', content: '' },""")

          p = Path('scripts/validate-ui-compatibility.mjs')
          text = p.read_text()
          inserts = [
              ("const defaultsPath = 'packages/profile-workflow/src/defaults.ts';\n", """const defaultsPath = 'packages/profile-workflow/src/defaults.ts';
          const advancedProfileEditorPath =
            'apps/extension/src/entrypoints/options/AdvancedProfileEditor.svelte';
          const advancedProfileOperationsPath =
            'packages/profile-workflow/src/advanced-profile-operations.ts';
          """),
              ("""  manifest,
            defaults,
          ] = await Promise.all([""", """  manifest,
            defaults,
            advancedProfileEditor,
            advancedProfileOperations,
          ] = await Promise.all(["""),
              ("""  readFile(manifestPath, 'utf8'),
            readFile(defaultsPath, 'utf8'),
          ]);""", """  readFile(manifestPath, 'utf8'),
            readFile(defaultsPath, 'utf8'),
            readFile(advancedProfileEditorPath, 'utf8'),
            readFile(advancedProfileOperationsPath, 'utf8'),
          ]);"""),
          ]
          for old, new in inserts:
              if text.count(old) != 1:
                  raise SystemExit(f'validate-ui insertion mismatch: {old!r}')
              text = text.replace(old, new)
          old = """  [
              snapshotHistory.includes('Extension reference-safety check plus browser install confirmation'),
              'Snapshot history must disclose browser-safe runtime verification mode.',
            ],
          ];"""
          new = """  [
              snapshotHistory.includes('Extension reference-safety check plus browser install confirmation'),
              'Snapshot history must disclose browser-safe runtime verification mode.',
            ],
            [
              !advancedProfileEditor.includes('https://example.invalid/') &&
                !advancedProfileEditor.includes('! Add rules here.') &&
                !advancedProfileEditor.includes(\"value: 'ZeroOmega Nex'\"),
              'Profile source controls must create blank URL, rule text, and request-header values.',
            ],
            [
              !advancedProfileOperations.includes('! Add AutoProxy rules here.'),
              'New Rule List profiles must not persist instructional text as rule data.',
            ],
          ];"""
          if text.count(old) != 1:
              raise SystemExit('validate-ui requirement insertion mismatch')
          p.write_text(text.replace(old, new))

          p = Path('docs/ORIGINAL_KNOWLEDGE_GRAPH.md')
          text = p.read_text()
          for old, new in [
              ('- 当前 Nex 的“Fixed / Switch / Rule List / PAC / Auto Detect”五选一分类是错误基线：误暴露 Rule List、误新增 Auto Detect、漏掉 Virtual。', '- 历史 Nex 曾采用错误的五选一分类；当前普通新建入口已经修正为 Fixed / Switch / PAC / Virtual 四类，Rule List 与 Auto Detect 仅保留导入/兼容路径。'),
              ('禁止做法：切换“URL”选项时自动写入 `https://example.invalid/proxy.pac`；该字符串只能作为 placeholder/示例，不得变成用户配置。', '禁止做法：切换“URL”选项时自动写入 `https://example.invalid/proxy.pac`；该字符串只能作为 placeholder/示例，不得变成用户配置。Nex 的模式切换现以空值初始化，并由永久 UI compatibility guard 阻止该回归。'),
              ('| `User-Agent: ZeroOmega Nex`             | Nex 临时 header                | 不得在点击“添加请求头”时自动写入有语义的值；应为空白行/placeholder     |', '| `User-Agent: ZeroOmega Nex`             | Nex 临时 header                | 新增请求头必须为空白行；名称和值只可由用户输入，永久守卫阻止回归       |'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'knowledge graph replacement mismatch: {old}')
              text = text.replace(old, new)
          last = '| 2026-07-26 | 新建流程按原版四类模态框实现；新增 Virtual 数据模型、引用图、PAC、认证、迁移与编辑器；Rule List/Auto Detect 退出普通新建入口 | 原版 `new_profile.jade`、`profile_virtual.jade`、`profiles.coffee` |'
          if text.count(last) != 1:
              raise SystemExit('knowledge graph revision insertion mismatch')
          p.write_text(text.replace(last, last + '\n| 2026-07-26 | 清除 PAC/Rule List 模式切换和新增请求头时写入配置的 Nex 假默认值；新增永久防回归守卫 | 原版 `profile_pac.jade`、`profile_rule_list.jade` 的空输入与 placeholder 语义 |'))

          p = Path('docs/UI_AUDIT_MATRIX.md')
          lines = p.read_text().splitlines()
          rows = {
              '| D-18 |': '| D-18 | 附属请求头 | 同上 | 空白可增删 header 行 | MUST_MATCH | PARTIAL | MISSING | 新增 header 已为空白，不再注入 User-Agent；附属布局未完成 | 补附属区布局与 locale |',
              '| E-06 |': '| E-06 | URL 与清除 | 同上 | URL input | MUST_MATCH | PARTIAL | MISSING | URL 模式已从空值开始，不再写入 invalid URL；专属布局仍不同 | 重建专属模板 |',
              '| E-08 |': '| E-08 | 规则文本只读语义 | 同上 | 有 URL 只读，无 URL 可编辑 | MUST_MATCH | PARTIAL | MISSING | 切换位置不再写示例正文；URL 只读与下载状态仍待重构 | 完成状态关系 |',
              '| F-03 |': '| F-03 | PAC 请求头 | 同上 | 远程 URL 时可展开 | MUST_MATCH | PARTIAL | MISSING | 新增 header 已为空白；展示条件、布局和翻译仍不等价 | 对齐原版区块 |',
              '| F-08 |': '| F-08 | invalid PAC URL 默认值 | 原版无此强制默认 | 示例只能是 placeholder | MUST_MATCH | DONE | N/A | URL 模式以空值初始化；永久守卫拒绝 example.invalid 回归 | 保持测试 |',
              '| H-09 |': '| H-09 | example.invalid URL | 非原版默认 | 不得写入配置 | MUST_MATCH | DONE | N/A | PAC/Rule List URL 模式均从空值开始，守卫已覆盖 | 保持守卫 |',
              '| H-10 |': '| H-10 | `! Add rules here.` | 非原版默认 | 不得自动保存 | MUST_MATCH | DONE | N/A | 新建及模式切换均为空规则正文，守卫已覆盖 | 保持守卫 |',
              '| H-11 |': '| H-11 | 自动填 User-Agent | 非原版默认 | 新 header 应为空 | MUST_MATCH | DONE | N/A | 新增 header 名称和值均为空，守卫已覆盖 | 保持守卫 |',
          }
          seen = set()
          for index, line in enumerate(lines):
              for prefix, replacement in rows.items():
                  if line.startswith(prefix):
                      lines[index] = replacement
                      seen.add(prefix)
              if line.startswith('- **明确 BROKEN**：'):
                  lines[index] = '- **明确 BROKEN**：Fixed/Switch 编辑器结构、真实备份导入、完整导出、编辑器翻译。会污染配置的 Nex 假默认值已在本切片清除。'
              elif line.startswith('- **明确 MISSING**：'):
                  lines[index] = '- **明确 MISSING**：在线恢复、单 Profile 导出、附属 RuleList 完整流程、Popup 当前站点/临时规则/网络检查；Virtual 已实现但浏览器 E2E 仍不完整。'
          if seen != set(rows):
              raise SystemExit(f'audit rows missing: {set(rows) - seen}')
          update = '| 2026-07-26 | 首次从 ZeroOmega v3.5.0 源码建立逐项巡查；诚实标记现有编辑器、翻译和 I/O 缺口 |'
          if update not in lines:
              raise SystemExit('audit update row missing')
          lines.insert(lines.index(update) + 1, '| 2026-07-26 | 清除 URL、规则正文和请求头的 Nex 假默认值；H-09/H-10/H-11 以代码、单测和永久守卫验证 |')
          p.write_text('\n'.join(lines) + '\n')

          p = Path('docs/MILESTONE_8_STATUS.md')
          text = p.read_text()
          start = text.index('**PR state:**')
          end = text.index('The earlier candidate at')
          current = """**PR state:** Draft; original-parity implementation continues
          **Last fully verified parity implementation head:** `bb3fa10871e5ee62fd231e79c56998bba2046e76`
          **Verification:** CI `30183999834`, Browser E2E `30183999830`, Parity Documentation `30183999833` passed
          **Installable release candidate:** none; all previously frozen artifacts are obsolete
          **Current-head rule:** read PR #11 and the exact GitHub Actions runs; never infer completion from this document alone

          """
          text = text[:start] + current + text[end:]
          paragraph_start = text.index('The earlier candidate at')
          paragraph_end = text.index('\n\n', paragraph_start)
          text = text[:paragraph_start] + 'All previously frozen Milestone 8 candidates and artifacts failed or were superseded by source-backed parity review. They must not be installed, accepted, or used as evidence of functional completeness.' + text[paragraph_end:]
          remaining = text.index('## Remaining closure')
          tail = """## Remaining closure

          PR #11 is not a replacement release candidate. The original v3.5.0 source-backed audit remains the acceptance authority, and every incomplete `MUST_MATCH` row keeps the PR Draft.

          Current blockers include:

          - original per-scheme Fixed editor and authentication layout,
          - original compact Switch table, source mode, and attached Rule List workflow,
          - dedicated Rule List and PAC download/update semantics,
          - full Options `.bak` export and a real original backup round-trip,
          - complete Simplified/Traditional Chinese coverage,
          - Popup result-profile, current-site, temporary-rule, external-ownership, and bounded diagnostic functions.

          ## Current next action

          Continue verified parity slices on `feat/m8-profile-workflow`. The semantic placeholder cleanup is the current slice; Fixed Profile parity follows after its exact Head passes CI, Browser E2E, and Parity Documentation. Do not request repository-owner installation until a new consolidated candidate is explicitly declared with a fresh artifact digest and QC checklist.
          """
          p.write_text(text[:remaining] + tail)

          for path in ['.github/workflows/capture-fixed-parity-source.yml', '.github/capture-fixed-trigger.txt']:
              Path(path).unlink(missing_ok=True)
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and verify
        run: |
          pnpm format
          pnpm verify
          git diff --check
      - name: Commit verified slice
        run: |
          rm -f .github/workflows/apply-default-integrity-slice.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: remove semantic placeholder defaults"
          git push origin HEAD:feat/m8-profile-workflow
