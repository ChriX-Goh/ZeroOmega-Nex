name: Research MIG-01 Failure Finalize

on:
  push:
    branches:
      - research/mig01-failure-preservation
    paths:
      - '.github/workflows/research-mig01-failure-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-failure-preservation
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Synchronize canonical evidence docs
        shell: python
        run: |
          from pathlib import Path

          kg_path = Path('docs/ORIGINAL_KNOWLEDGE_GRAPH.md')
          kg = kg_path.read_text()
          kg_marker = 'MIG-01.6 failure-preservation checkpoint (2026-08-07)'
          kg_block = "\n\n## MIG-01.6 failure-preservation checkpoint (2026-08-07)\n\n- 原版 v3.5.0 的 Options / Browser Target 行为仍是兼容语义事实来源；Nex 不复制原版可能留下半事务或明文秘密的缺陷。\n- 对真实迁移而言，Nex 的 `Applied` 是唯一已确认配置；候选配置在完整 activation/confirmation 前不得取代它。持久 `pendingApply` 表示真实两阶段事务，不是 UI busy 标记。\n- 若浏览器在 Apply 的 `activating` / `committing` / `rollback-required` 阶段退出，重启必须先用同一 activation rollback 路径恢复旧 `Applied` 与 startup route；只有浏览器恢复成功后才能清除 pending，用户 Draft 必须保留供检查/重试。\n- 恢复失败不得静默继续：pending 保持 `rollback-required`，并记录 `lastApply.stage = recovery` 与 `rollbackSucceeded = false`。\n- blocking 原版 `.bak` 兼容性分析不得写入 workflow storage，也不得改变已经确认的浏览器代理；Chromium/Firefox 已在 large 原版迁移链后用 missing-reference 负向备份实跑验证。\n- 该检查点属于 `CONTRACT-EXACT` 的失败恢复/原子性，不新增原版普通 UI 概念，也不改变 Popup/Options 的视觉验收状态。\n"
          if kg_marker not in kg:
              kg_path.write_text(kg + kg_block)

          ui_path = Path('docs/UI_AUDIT_MATRIX.md')
          ui = ui_path.read_text()
          ui_marker = 'MIG-01.6 failure-preservation evidence note'
          ui_block = "\n\n## MIG-01.6 failure-preservation evidence note\n\nThis checkpoint changes migration/recovery evidence only; it changes no UI row status and adds no\nPopup/Options refinement. Blocking original-backup analysis is now browser-tested to leave the\nworkflow storage namespace and confirmed PAC route unchanged. A persisted interrupted Apply is\nbrowser-tested to recover the previous Applied configuration on full Chromium/Firefox restart,\npreserve the dirty Draft, clear `pendingApply` only after successful rollback, and record a\n`recovery` failure result. The auditable layer-by-layer matrix is\n`docs/MIG_01_FAILURE_PRESERVATION_MATRIX.md`.\n"
          if ui_marker not in ui:
              ui_path.write_text(ui + ui_block)
      - name: Format final MIG-01.6 files
        run: |
          pnpm exec prettier --write \
            packages/legacy-zeroomega/src/failure-preservation.test.ts \
            docs/MIG_01_FAILURE_PRESERVATION_MATRIX.md \
            docs/MIG_01_BATCH_CONTRACT.md \
            docs/SESSION_17_KNOWLEDGE_GRAPH.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md
      - name: Full repository verification
        run: pnpm verify
      - name: Commit canonical synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/legacy-zeroomega/src/failure-preservation.test.ts \
            docs/MIG_01_FAILURE_PRESERVATION_MATRIX.md \
            docs/MIG_01_BATCH_CONTRACT.md \
            docs/SESSION_17_KNOWLEDGE_GRAPH.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md
          git diff --cached --check
          git commit -m 'docs: reconcile MIG-01.6 failure evidence'
          git push origin HEAD:research/mig01-failure-preservation

# Rerun after freezing the exporter's exact missing-startup-reference code.
