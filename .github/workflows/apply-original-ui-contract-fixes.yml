name: Apply Original UI Contract Fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-original-ui-contract-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'ChriX-Goh/ZeroOmega-Nex' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Apply original-derived contract corrections
        run: python scripts/apply-original-ui-contract-fixes.py

      - name: Format and validate
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/App.svelte \
            packages/profile-workflow/src/commands.ts \
            scripts/validate-parity-docs.mjs \
            apps/extension/src/component-rendering.component.spec.ts \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            scripts/capture-visual-evidence.mjs
          pnpm guard:architecture
          pnpm validate:parity-docs
          pnpm check
          pnpm test
          pnpm test:components
          pnpm lint
          git diff --check

      - name: Remove temporary migration resources
        run: |
          rm -f .github/workflows/apply-original-ui-contract-fixes.yml
          rm -f .github/workflows/export-original-ui-contract-sources.yml
          rm -f scripts/apply-original-ui-contract-fixes.py

      - name: Commit exact correction
        run: |
          git config user.name 'ZeroOmega Nex automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce original UI contract boundaries'
          git push origin HEAD:feat/m8-profile-workflow
