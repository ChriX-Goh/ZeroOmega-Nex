name: Format M8 commands
on:
  push:
    branches: [feat/m8-profile-workflow]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/profile-workflow/src/commands.ts packages/profile-workflow/src/commands.test.ts packages/profile-workflow/src/defaults.ts packages/profile-workflow/src/defaults.test.ts packages/profile-workflow/src/index.ts
      - run: |
          rm .github/workflows/format-m8-commands.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/profile-workflow/src .github/workflows/format-m8-commands.yml
          git commit -m "style: format profile workflow commands"
          git push origin HEAD:feat/m8-profile-workflow
