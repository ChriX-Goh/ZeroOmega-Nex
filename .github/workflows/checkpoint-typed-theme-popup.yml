name: Checkpoint typed Theme and Popup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/checkpoint-typed-theme-popup.yml
      - .github/patches/checkpoint-typed-theme-popup.py

permissions:
  contents: write

concurrency:
  group: checkpoint-typed-theme-popup-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Update durable checkpoint
        run: |
          python .github/patches/checkpoint-typed-theme-popup.py
          pnpm exec prettier --write docs/MILESTONE_8_STATUS.md
          node scripts/validate-parity-docs.mjs
      - name: Commit checkpoint
        run: |
          git checkout HEAD -- .github/workflows/checkpoint-typed-theme-popup.yml
          rm -f .github/patches/checkpoint-typed-theme-popup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: checkpoint typed Theme and Popup"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
