name: Integrate typed locale batch two

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-typed-locale-batch-two.yml

permissions:
  contents: write

concurrency:
  group: integrate-typed-locale-batch-two-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply typed locale batch two
        env:
          TYPED_LOCALE_BATCH_TWO_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/prepare-locale-batch-two-patches.py
            python .github/patches/fix-locale-batch-two-test-signature.py
            python .github/patches/fix-locale-batch-two-clear-anchor.py
            python .github/patches/fix-locale-batch-two-header-aria-anchor.py
            python .github/patches/apply-locale-batch-two-catalog.py
            python .github/patches/apply-locale-batch-two-switch.py
            python .github/patches/apply-locale-batch-two-rule-lists.py
            python .github/patches/apply-locale-batch-two-integration.py
          } 2>&1 | tee typed-locale-batch-two-apply.log
      - name: Format product slice
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee typed-locale-batch-two-format.log
      - name: Generate locale inventory
        run: |
          set -o pipefail
          pnpm locale:inventory 2>&1 | tee typed-locale-batch-two-inventory.log
          pnpm exec prettier --write docs/LOCALE_INVENTORY.json
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee typed-locale-batch-two-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium locale regression suite
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee typed-locale-batch-two-e2e.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-locale-batch-two-${{ github.run_id }}
          path: typed-locale-batch-two-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-typed-locale-batch-two.yml
          rm -f \
            .github/patches/prepare-locale-batch-two-patches.py \
            .github/patches/fix-locale-batch-two-test-signature.py \
            .github/patches/fix-locale-batch-two-clear-anchor.py \
            .github/patches/fix-locale-batch-two-header-aria-anchor.py \
            .github/patches/apply-locale-batch-two-catalog.py \
            .github/patches/apply-locale-batch-two-switch.py \
            .github/patches/apply-locale-batch-two-rule-lists.py \
            .github/patches/apply-locale-batch-two-integration.py \
            typed-locale-batch-two-apply.log \
            typed-locale-batch-two-format.log \
            typed-locale-batch-two-inventory.log \
            typed-locale-batch-two-verify.log \
            typed-locale-batch-two-e2e.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add typed locale batch two"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
