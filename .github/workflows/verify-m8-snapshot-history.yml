name: Verify Milestone 8 Snapshot History

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Correct snapshot history fixtures
        run: python .github/scripts/fix-m8-snapshot-history-fixtures.py

      - name: Format snapshot history slice
        run: |
          pnpm exec prettier --write \
            packages/browser-adapters/src/index.ts \
            packages/browser-adapters/src/memory-repository.ts \
            packages/browser-adapters/src/snapshot-history.ts \
            packages/browser-adapters/src/snapshot-history.test.ts \
            packages/browser-adapters/src/storage-repository.ts \
            packages/browser-adapters/src/storage-repository.test.ts

      - name: Verify snapshot history slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @zeroomega-nex/browser-adapters check
            pnpm exec vitest run \
              packages/browser-adapters/src/snapshot-history.test.ts \
              packages/browser-adapters/src/storage-repository.test.ts
          } 2>&1 | tee m8-snapshot-history.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-snapshot-history-diagnostics
          path: m8-snapshot-history.log
          if-no-files-found: warn

      - name: Commit snapshot history slice
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/browser-adapters/src/index.ts \
            packages/browser-adapters/src/memory-repository.ts \
            packages/browser-adapters/src/snapshot-history.ts \
            packages/browser-adapters/src/snapshot-history.test.ts \
            packages/browser-adapters/src/storage-repository.ts \
            packages/browser-adapters/src/storage-repository.test.ts
          git commit -m 'feat: add validated redacted snapshot history'
          git push origin HEAD:feat/m8-profile-workflow
