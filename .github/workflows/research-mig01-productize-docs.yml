name: Research MIG-01.7 Productize Docs

on:
  push:
    branches:
      - research/mig01-semantic-productize
    paths:
      - '.github/workflows/research-mig01-productize-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-semantic-productize
      - name: Synchronize MIG-01.7 governance notes
        shell: python
        run: |
          from pathlib import Path

          contract = Path('docs/MIG_01_BATCH_CONTRACT.md')
          text = contract.read_text()
          marker = '### MIG-01.7 semantic export/re-import checkpoint'
          section = '''\n### MIG-01.7 semantic export/re-import checkpoint\n\nCross-browser export equivalence is judged on a frozen canonical semantic projection, not raw JSON object-key insertion order. The projection is first asserted value-exact against the provenance-bound source fixture, then recursively canonicalized by sorting object keys while preserving array order before SHA-256. Raw bytes and raw SHA-256 remain diagnostics. Generated RuleList `pacScript` remains excluded as rebuildable generated state; original-compatible `revision` remains preserved and is not normalized merely for hash equality.\n\nA/C/D/large ordinary exports must be accepted by review-only re-import without mutating the workflow storage namespace or changing the confirmed browser route. The package-level fixed point additionally requires `import -> export#1 -> re-import -> export#2` to stabilize byte-for-byte after sanitization.\n\nThe sensitive vector injects a unique password/header-value sentinel and requires it to remain absent from compatibility UI, workflow command responses, the profile-workflow storage namespace, ordinary export, sanitized re-import review, and permanent evidence. Ordinary export must not contain secret references or sensitive header metadata. SecretStore itself is not treated as a leak surface because it is the designated secret boundary.\n\nMIG-01.7 uses the existing permanent Browser E2E workflow with one dependent consolidation job; it does not create a permanent workflow per corpus or field. Closing this checkpoint does not fabricate Corpus B, does not by itself close MIG-01, and does not change audited progress.\n'''
          if marker not in text:
              text = text.replace('\n## 10. Stop rules\n', section + '\n## 10. Stop rules\n')
              contract.write_text(text)

          kg = Path('docs/ORIGINAL_KNOWLEDGE_GRAPH.md')
          text = kg.read_text()
          marker = '## MIG-01.7 semantic-export evidence note'
          if marker not in text:
              text += '''\n\n## MIG-01.7 semantic-export evidence note\n\n- Pinned original v3.5.0 `Profiles` uses `revision` as its attached-cache tag and `Options` may compare profile revisions during revision-checked updates; Nex therefore preserves compatible `revision` values rather than deleting them for deterministic hashes.\n- Browser attribution proved the C/D Chromium/Firefox export discrepancy was confined to object insertion order inside the already value-equal safe opaque `x-benign-metadata`; routing/settings/profile content, RuleList text, revision, and Unicode PAC content matched.\n- MIG-01.7 cross-browser evidence therefore canonicalizes object-key order only for evidence hashing. Ordinary `.bak` content is not rewritten by the evidence layer.\n'''
              kg.write_text(text)

          matrix = Path('docs/UI_AUDIT_MATRIX.md')
          text = matrix.read_text()
          marker = 'MIG-01.7 semantic-export consolidation'
          if marker not in text:
              text += '''\n\n### MIG-01.7 semantic-export consolidation\n\nThe existing Import / Export journey now carries permanent evidence for A/C/D/large ordinary export, review-only re-import without persistent mutation, canonical cross-browser semantic equivalence, and a password/sensitive-header-value leak sentinel across review UI, command response, workflow persistence, ordinary export, and sanitized re-import review. This is migration evidence on the existing Options surface, not a new UI scope or status increase.\n'''
              matrix.write_text(text)
      - name: Commit synchronized governance docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MIG_01_BATCH_CONTRACT.md docs/ORIGINAL_KNOWLEDGE_GRAPH.md docs/UI_AUDIT_MATRIX.md
          git diff --cached --check
          git commit -m 'docs: freeze MIG-01.7 semantic projection contract'
          git push origin HEAD:research/mig01-semantic-productize
