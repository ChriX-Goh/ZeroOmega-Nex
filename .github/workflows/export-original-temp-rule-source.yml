name: Fix Chromium Temporary Overlay Expectation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-original-temp-rule-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Replace outdated Chromium expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/e2e-chromium.mjs')
          text = path.read_text()
          old = """  await assertEventually(async () => {
    const [local, session] = await worker.evaluate(async () =>
      Promise.all([chrome.storage.local.get(null), chrome.storage.session.get(null)]),
    );
    return (
      session['zeroomega-nex/popup-temporary-rules/v1/state'] === undefined &&
      !String(local['zeroomega-nex/browser-proxy/v1/state']?.activeSnapshotId ?? '').startsWith(
        'popup-temporary-v1/',
      )
    );
  }, 'Deleting the final temporary rule did not restore the underlying route');
  await temporaryManager.close();
"""
          new = """  await assertEventually(async () => {
    const [local, session] = await worker.evaluate(async () =>
      Promise.all([chrome.storage.local.get(null), chrome.storage.session.get(null)]),
    );
    const temporaryState = session['zeroomega-nex/popup-temporary-rules/v1/state'];
    return (
      temporaryState?.overlayActive === true &&
      Array.isArray(temporaryState.rules) &&
      temporaryState.rules.length === 0 &&
      String(local['zeroomega-nex/browser-proxy/v1/state']?.activeSnapshotId ?? '').startsWith(
        'popup-temporary-v1/',
      )
    );
  }, 'Deleting the final temporary rule did not retain the original empty overlay');

  const temporaryCleanup = await worker.evaluate(async (expectedAppliedRevisionId) =>
    chrome.runtime.sendMessage({
      channel: 'zeroomega-nex/profile-workflow/v1',
      action: 'activate-route',
      expectedAppliedRevisionId,
      route: { kind: 'system' },
    }), popupWorkflow.applied.revision.id);
  assert.equal(
    temporaryCleanup?.ok,
    true,
    `System cleanup after temporary-rule evidence failed: ${JSON.stringify(temporaryCleanup)}`,
  );
  await assertEventually(async () => {
    const local = await worker.evaluate(async () => chrome.storage.local.get(null));
    return !String(
      local['zeroomega-nex/browser-proxy/v1/state']?.activeSnapshotId ?? '',
    ).startsWith('popup-temporary-v1/');
  }, 'System cleanup did not leave the temporary overlay');
  await temporaryManager.close();
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one outdated Chromium assertion, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format and verify repository
        run: |
          pnpm exec prettier --write scripts/e2e-chromium.mjs
          pnpm run verify

      - name: Commit correction and self-delete
        run: |
          rm .github/workflows/export-original-temp-rule-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test(chromium): preserve empty temporary overlay contract'
          git push origin HEAD:${{ github.head_ref }}
