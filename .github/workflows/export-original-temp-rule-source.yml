name: Apply Original Temporary Rule Scenario

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-original-temp-rule-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact temporary-rule scenario patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              target.write_text(text.replace(old, new, 1))

          scenario = 'scripts/original-toolbar-evidence-scenarios.mjs'
          replace_once(
              scenario,
              "const runtimePac = {\n  name: 'Runtime PAC',\n  profileType: 'PacProfile',\n  color: '#4db6ac',\n  pacUrl: `data:application/x-ns-proxy-autoconfig;charset=utf-8,${encodeURIComponent(runtimePacScript)}`,\n  pacScript: runtimePacScript,\n};\n\nexport const ORIGINAL_TOOLBAR_EVIDENCE_SCENARIOS = Object.freeze({",
              "const runtimePac = {\n  name: 'Runtime PAC',\n  profileType: 'PacProfile',\n  color: '#4db6ac',\n  pacUrl: `data:application/x-ns-proxy-autoconfig;charset=utf-8,${encodeURIComponent(runtimePacScript)}`,\n  pacScript: runtimePacScript,\n};\n\nconst temporaryRuleFixed = {\n  name: 'Runtime Temporary Fixed',\n  profileType: 'FixedProfile',\n  color: '#64b5f6',\n  bypassList: [],\n  fallbackProxy: {\n    scheme: 'http',\n    host: '127.0.0.1',\n    port: 18187,\n  },\n};\n\nconst temporaryRuleBase = {\n  name: 'Runtime Temporary Base',\n  profileType: 'SwitchProfile',\n  color: '#ffb74d',\n  rules: [],\n  defaultProfileName: 'direct',\n};\n\nexport const ORIGINAL_TOOLBAR_EVIDENCE_SCENARIOS = Object.freeze({",
          )
          replace_once(
              scenario,
              "  pac: Object.freeze({\n    id: 'pac',",
              "  'temporary-rule': Object.freeze({\n    id: 'temporary-rule',\n    description:\n      'A temporary host rule overrides a base Switch profile, leaves unmatched hosts on the base default, and restores the base behavior after removal.',\n    profiles: Object.freeze([temporaryRuleFixed, temporaryRuleBase]),\n    captures: Object.freeze([\n      Object.freeze({\n        label: 'temporary-rule-match-fixed',\n        profileName: temporaryRuleBase.name,\n        url: 'http://temp-rule.test/path',\n        commands: Object.freeze([\n          Object.freeze({\n            method: 'addTempRule',\n            args: Object.freeze(['temp-rule.test', temporaryRuleFixed.name, 1]),\n          }),\n        ]),\n      }),\n      Object.freeze({\n        label: 'temporary-rule-default-direct',\n        profileName: temporaryRuleBase.name,\n        url: 'http://temp-rule-default.test/path',\n      }),\n      Object.freeze({\n        label: 'temporary-rule-removed-base-direct',\n        profileName: temporaryRuleBase.name,\n        url: 'http://temp-rule.test/path',\n        commands: Object.freeze([\n          Object.freeze({\n            method: 'addTempRule',\n            args: Object.freeze(['temp-rule.test', temporaryRuleFixed.name, -1]),\n          }),\n        ]),\n      }),\n    ]),\n  }),\n  pac: Object.freeze({\n    id: 'pac',",
          )

          runner = 'scripts/audit-original-toolbar-scenarios.mjs'
          replace_once(
              runner,
              "    assert.doesNotThrow(\n      () => new URL(capture.url),\n      `Scenario ${scenario.id} capture ${capture.label} has an invalid URL`,\n    );\n  }\n}",
              "    assert.doesNotThrow(\n      () => new URL(capture.url),\n      `Scenario ${scenario.id} capture ${capture.label} has an invalid URL`,\n    );\n    const commands = capture.commands ?? [];\n    assert.ok(\n      Array.isArray(commands),\n      `Scenario ${scenario.id}/${capture.label} commands must be an array`,\n    );\n    for (const [index, command] of commands.entries()) {\n      assert.ok(\n        command && typeof command === 'object' && !Array.isArray(command),\n        `Scenario ${scenario.id}/${capture.label} command ${index} must be an object`,\n      );\n      assert.equal(\n        typeof command.method,\n        'string',\n        `Scenario ${scenario.id}/${capture.label} command ${index} method is required`,\n      );\n      assert.ok(\n        command.args === undefined || Array.isArray(command.args),\n        `Scenario ${scenario.id}/${capture.label} command ${index} args must be an array`,\n      );\n    }\n  }\n}",
          )
          replace_once(
              runner,
              "      await sendOriginalMessage('applyProfile', [capture.profileName]);\n      const runtimeState = await waitForCurrentProfile(capture.profileName);\n      await pause(300);\n      const action = await sendOriginalMessage('_actionForUrl', [capture.url, { skipIcon: true }]);\n      assert.ok(\n        action,\n        `Original _actionForUrl returned no result for ${scenario.id}/${capture.label}`,\n      );\n      captures.push({ ...capture, runtimeState, action });",
              "      await sendOriginalMessage('applyProfile', [capture.profileName]);\n      await waitForCurrentProfile(capture.profileName);\n      const commandResults = [];\n      for (const command of capture.commands ?? []) {\n        commandResults.push({\n          method: command.method,\n          result: await sendOriginalMessage(command.method, command.args ?? []),\n        });\n      }\n      const runtimeState = await waitForCurrentProfile(capture.profileName);\n      await pause(300);\n      const action = await sendOriginalMessage('_actionForUrl', [capture.url, { skipIcon: true }]);\n      assert.ok(\n        action,\n        `Original _actionForUrl returned no result for ${scenario.id}/${capture.label}`,\n      );\n      captures.push({\n        ...capture,\n        runtimeState,\n        action,\n        ...(commandResults.length === 0 ? {} : { commandResults }),\n      });",
          )

          Path('.github/workflows/export-original-temp-rule-source.yml').unlink()
          PY

      - name: Commit atomic evidence-harness update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/original-toolbar-evidence-scenarios.mjs scripts/audit-original-toolbar-scenarios.mjs .github/workflows/export-original-temp-rule-source.yml
          git diff --cached --check
          git commit -m 'test(toolbar): capture original temporary-rule transitions'
          git push origin HEAD:${{ github.head_ref }}
