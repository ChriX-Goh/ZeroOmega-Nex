name: Format Milestone 8 Authentication Plan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format authentication plan slice
        run: |
          pnpm exec prettier --write \
            packages/browser-adapters/src/authentication-plan.ts \
            packages/browser-adapters/src/authentication-plan.test.ts \
            packages/browser-adapters/src/index.ts

      - name: Type-check authentication plan slice
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @zeroomega-nex/browser-adapters check 2>&1 | tee m8-auth-plan-typecheck.log

      - name: Test authentication plan slice
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run packages/browser-adapters/src/authentication-plan.test.ts 2>&1 | tee m8-auth-plan-test.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-auth-plan-diagnostics
          path: |
            m8-auth-plan-typecheck.log
            m8-auth-plan-test.log
            packages/browser-adapters/src/authentication-plan.ts
            packages/browser-adapters/src/authentication-plan.test.ts
          if-no-files-found: warn

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/browser-adapters/src/authentication-plan.ts \
            packages/browser-adapters/src/authentication-plan.test.ts \
            packages/browser-adapters/src/index.ts
          git commit -m 'style: format route authentication plan'
          git push origin HEAD:feat/m8-profile-workflow
