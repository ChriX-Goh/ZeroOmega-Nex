name: Format Milestone 8 Authentication Plan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format authentication plan slice
        run: |
          pnpm exec prettier --write \
            packages/browser-adapters/src/authentication-plan.ts \
            packages/browser-adapters/src/authentication-plan.test.ts \
            packages/browser-adapters/src/index.ts

      - name: Verify authentication plan slice
        run: |
          pnpm --filter @zeroomega-nex/browser-adapters check
          pnpm exec vitest run packages/browser-adapters/src/authentication-plan.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/browser-adapters/src/authentication-plan.ts \
            packages/browser-adapters/src/authentication-plan.test.ts \
            packages/browser-adapters/src/index.ts
          git commit -m 'style: format route authentication plan'
          git push origin HEAD:feat/m8-profile-workflow
