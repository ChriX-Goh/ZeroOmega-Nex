name: Sync toolbar Action knowledge

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sync-toolbar-action-knowledge.yml
      - scripts/sync-toolbar-action-knowledge.py

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Sync and verify
        run: |
          python scripts/sync-toolbar-action-knowledge.py
          pnpm exec prettier --write \
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md \
            docs/ORIGINAL_NEX_DELIVERY_KNOWLEDGE_GRAPH.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md
          pnpm verify
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md \
            docs/ORIGINAL_NEX_DELIVERY_KNOWLEDGE_GRAPH.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md
          git commit -m 'docs: sync verified toolbar Action checkpoint'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
