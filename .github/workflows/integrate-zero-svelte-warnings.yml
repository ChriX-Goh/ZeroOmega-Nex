# integration revision 2
name: Integrate zero Svelte warnings

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-zero-svelte-warnings.yml

permissions:
  contents: write

concurrency:
  group: integrate-zero-svelte-warnings-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply zero-warning accessibility slice
        env:
          ZERO_WARNING_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/fix-zero-warning-validator-wiring.py
            python .github/patches/fix-zero-warning-guard-strings.py
            python .github/patches/apply-zero-svelte-warnings.py
          } 2>&1 | tee zero-warning-apply.log
      - name: Format product slice
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee zero-warning-format.log
      - name: Verify repository with warnings fatal
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee zero-warning-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium focus regression suite
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee zero-warning-e2e.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-warning-integration-${{ github.run_id }}
          path: zero-warning-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-zero-svelte-warnings.yml
          rm -f \
            .github/patches/fix-zero-warning-validator-wiring.py \
            .github/patches/fix-zero-warning-guard-strings.py \
            .github/patches/apply-zero-svelte-warnings.py \
            zero-warning-apply.log \
            zero-warning-format.log \
            zero-warning-verify.log \
            zero-warning-e2e.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: eliminate Options accessibility warnings"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
