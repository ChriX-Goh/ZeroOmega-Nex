name: Integrate Switch table with fixed guard

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-switch-table-parity-guard-fixed.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Switch patch with indentation-safe replacements
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-switch-table-parity.yml').read_text().splitlines()
          marker = workflow.index('      - name: Apply Switch table parity slice')
          start = workflow.index('        run: |', marker) + 1
          extracted = []
          for line in workflow[start:]:
              if line.startswith('      - name:'):
                  break
              extracted.append(line[10:] if line.startswith('          ') else line)

          helper_start = next(i for i, line in enumerate(extracted) if line.strip().startswith('def replace_once('))
          helper_end = next(i for i in range(helper_start + 1, len(extracted)) if extracted[i].strip() == '')
          indent = extracted[helper_start][:-len(extracted[helper_start].lstrip())]
          extracted[helper_start:helper_end] = [
              indent + 'def replace_once(path: str, old: str, new: str) -> None:',
              indent + '    target = Path(path)',
              indent + '    source = target.read_text()',
              indent + '    matches = []',
              indent + "    for base_indent in ('', '  ', '    ', '      '):",
              indent + "        candidate = '\\n'.join(",
              indent + "            base_indent + line if line else '' for line in old.split('\\n')",
              indent + '        )',
              indent + '        if source.count(candidate) == 1:',
              indent + "            replacement = '\\n'.join(",
              indent + "                base_indent + line if line else '' for line in new.split('\\n')",
              indent + '            )',
              indent + '            matches.append((candidate, replacement))',
              indent + '    if len(matches) != 1:',
              indent + '        raise SystemExit(',
              indent + "            f'{path}: expected one indentation-aware match, found {len(matches)}: {old[:80]!r}'",
              indent + '        )',
              indent + '    old_value, new_value = matches[0]',
              indent + '    target.write_text(source.replace(old_value, new_value))',
          ]

          guard_index = next(
              i for i, line in enumerate(extracted) if line.strip() == 'if guard.count(guard_marker) != 1:'
          )
          guard_indent = extracted[guard_index][:-len(extracted[guard_index].lstrip())]
          extracted[guard_index:guard_index + 3] = [
              guard_indent + "guard_marker_indented = '\\n'.join(",
              guard_indent + "    '  ' + line if line else '' for line in guard_marker.split('\\n')",
              guard_indent + ')',
              guard_indent + "switch_guard_indented = '\\n'.join(",
              guard_indent + "    '  ' + line if line else '' for line in switch_guard.split('\\n')",
              guard_indent + ')',
              guard_indent + 'if guard.count(guard_marker_indented) != 1:',
              guard_indent + "    raise SystemExit(f'Switch guard marker mismatch: {guard.count(guard_marker_indented)}')",
              guard_indent + 'Path(guard_path).write_text(',
              guard_indent + '    guard.replace(',
              guard_indent + '        guard_marker_indented, switch_guard_indented + guard_marker_indented',
              guard_indent + '    )',
              guard_indent + ')',
          ]
          Path('/tmp/apply-switch-table-guard-fixed.sh').write_text('\n'.join(extracted) + '\n')
          PY
          bash /tmp/apply-switch-table-guard-fixed.sh
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/SwitchProfileEditor.svelte \
            apps/extension/src/component-rendering.component.spec.ts \
            packages/profile-workflow/src/switch-operations.ts \
            packages/profile-workflow/src/switch-operations.test.ts \
            scripts/validate-ui-compatibility.mjs \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md
      - name: Verify repository
        run: pnpm verify
      - name: Clean generated and temporary files
        run: |
          rm -rf browser-builds browser-builds.tar.gz
          git clean -fdX
          rm -f .github/workflows/apply-switch-table-parity.yml
          rm -f .github/workflows/diagnose-switch-table-parity.yml
          rm -f .github/workflows/diagnose-switch-fixed-run.yml
          rm -f .github/workflows/diagnose-switch-final-run.yml
          rm -f .github/workflows/fix-switch-parity-patcher.yml
          rm -f .github/workflows/fix-switch-parity-patcher-v2.yml
          rm -f .github/workflows/run-switch-table-parity-fixed.yml
          rm -f .github/workflows/run-switch-table-parity-final.yml
          rm -f .github/workflows/run-switch-table-parity-guard-fixed.yml
          git diff --check
      - name: Commit verified Switch slice
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: restore original Switch rule table'
          git pull --rebase origin feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
