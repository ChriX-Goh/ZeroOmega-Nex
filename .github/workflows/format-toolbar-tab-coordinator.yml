name: Format toolbar tab coordinator

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-toolbar-tab-coordinator.yml
      - apps/extension/src/lib/original-toolbar-tab-coordinator.ts
      - apps/extension/src/lib/original-toolbar-tab-coordinator.test.ts

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Format and commit coordinator files
        run: |
          pnpm exec prettier --write \
            apps/extension/src/lib/original-toolbar-tab-coordinator.ts \
            apps/extension/src/lib/original-toolbar-tab-coordinator.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/extension/src/lib/original-toolbar-tab-coordinator.ts \
            apps/extension/src/lib/original-toolbar-tab-coordinator.test.ts
          git commit -m 'style: format original toolbar tab coordinator'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
