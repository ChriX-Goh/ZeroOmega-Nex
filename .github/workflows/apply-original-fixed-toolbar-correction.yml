name: Apply original Fixed toolbar correction

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-original-fixed-toolbar-correction.yml
      - scripts/apply-original-fixed-toolbar-correction.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply and verify
        run: |
          python scripts/apply-original-fixed-toolbar-correction.py
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/extension/src/lib/inspect-runtime.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "      color: '#bdbdbd',"
          new = "      color: '#aaaaaa',"
          if text.count(old) != 1:
              raise SystemExit(f'Inspect Direct color: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          pnpm exec prettier --write \
            packages/profile-workflow/src/defaults.ts \
            packages/profile-workflow/src/defaults.test.ts \
            apps/extension/src/lib/original-toolbar-profile-resolver.ts \
            apps/extension/src/lib/original-toolbar-profile-resolver.test.ts \
            apps/extension/src/lib/inspect-runtime.test.ts
          pnpm verify
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/profile-workflow/src/defaults.ts \
            packages/profile-workflow/src/defaults.test.ts \
            apps/extension/src/lib/original-toolbar-profile-resolver.ts \
            apps/extension/src/lib/original-toolbar-profile-resolver.test.ts \
            apps/extension/src/lib/inspect-runtime.test.ts
          git commit -m 'fix: reproduce original Fixed toolbar results'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
