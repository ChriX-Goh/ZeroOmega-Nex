name: Checkpoint online restore

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/checkpoint-online-restore.yml
      - .github/patches/checkpoint-online-restore.py

permissions:
  contents: write

concurrency:
  group: checkpoint-online-restore-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply durable checkpoint
        run: python .github/patches/checkpoint-online-restore.py

      - name: Format and verify repository
        run: |
          pnpm exec prettier --write docs/MILESTONE_8_STATUS.md docs/MILESTONE_STATUS.md
          pnpm verify

      - name: Commit checkpoint
        run: |
          git checkout HEAD -- .github/workflows/checkpoint-online-restore.yml
          rm -f .github/patches/checkpoint-online-restore.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: checkpoint online restore closure"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
