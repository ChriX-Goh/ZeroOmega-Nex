name: Format M7 auth integration
on:
  push:
    branches: [feat/m7-browser-adapters]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-browser-adapters
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/browser-adapters/src/authentication-listener.ts packages/browser-adapters/src/authentication-listener.test.ts packages/browser-adapters/src/index.ts apps/extension/src/lib/proxy-auth-runtime.ts apps/extension/src/entrypoints/background.ts apps/extension/wxt.config.ts scripts/guard-architecture.mjs scripts/inspect-manifests.mjs
      - run: |
          rm .github/workflows/format-m7-auth-integration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/browser-adapters/src apps/extension scripts/guard-architecture.mjs scripts/inspect-manifests.mjs .github/workflows/format-m7-auth-integration.yml
          git commit -m "style: format proxy authentication integration"
          git push origin HEAD:feat/m7-browser-adapters
