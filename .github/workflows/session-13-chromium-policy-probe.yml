name: Session 13 Chromium Policy Probe

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/session-13-chromium-policy-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout active product branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Show system Chrome
        run: google-chrome --version

      - name: Build Chromium extension
        run: WXT_ICON_RENDERER_E2E=1 ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium

      - name: Install managed proxy policy
        run: |
          POLICY='{"ProxySettings":{"ProxyMode":"fixed_servers","ProxyServer":"127.0.0.1:18199","ProxyBypassList":"<local>"}}'
          sudo install -d -m 755 /etc/chromium/policies/managed
          sudo install -d -m 755 /etc/opt/chrome/policies/managed
          printf '%s\n' "$POLICY" | sudo tee /etc/chromium/policies/managed/zeroomega-policy.json >/dev/null
          printf '%s\n' "$POLICY" | sudo tee /etc/opt/chrome/policies/managed/zeroomega-policy.json >/dev/null
          sudo chmod 444 /etc/chromium/policies/managed/zeroomega-policy.json
          sudo chmod 444 /etc/opt/chrome/policies/managed/zeroomega-policy.json
          cat /etc/opt/chrome/policies/managed/zeroomega-policy.json

      - name: Run policy-owned Popup probe
        env:
          ZEROOMEGA_POLICY_BROWSER_CHANNEL: chrome
        run: node scripts/e2e-chromium-policy-owned-popup.mjs
