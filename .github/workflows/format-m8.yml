name: Format Milestone 8

on:
  push:
    branches:
      - 'feat/m8-profile-workflow'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Milestone 8 files
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/popup/App.svelte \
            apps/extension/src/lib/profile-workflow-activation.test.ts \
            apps/extension/src/lib/profile-workflow-activation.ts \
            packages/browser-adapters/src/activation.ts \
            packages/profile-workflow/src/commands-quick-switch.test.ts \
            packages/profile-workflow/src/commands.ts \
            packages/profile-workflow/src/profile-operations.test.ts \
            packages/profile-workflow/src/profile-operations.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/popup/App.svelte \
            apps/extension/src/lib/profile-workflow-activation.test.ts \
            apps/extension/src/lib/profile-workflow-activation.ts \
            packages/browser-adapters/src/activation.ts \
            packages/profile-workflow/src/commands-quick-switch.test.ts \
            packages/profile-workflow/src/commands.ts \
            packages/profile-workflow/src/profile-operations.test.ts \
            packages/profile-workflow/src/profile-operations.ts
          git commit -m 'style: format Milestone 8 implementation'
          git push origin HEAD:feat/m8-profile-workflow
