name: Diagnose Switch rule table parity

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-switch-table-parity.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 1
          show-progress: false
      - name: Extract and run Switch apply script
        id: apply
        continue-on-error: true
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-switch-table-parity.yml').read_text().splitlines()
          marker = source.index('      - name: Apply Switch table parity slice')
          start = source.index('        run: |', marker) + 1
          output = []
          for line in source[start:]:
              if line.startswith('      - name:'):
                  break
              output.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-switch-table.sh').write_text('\n'.join(output) + '\n')
          PY
          set +e
          bash -x /tmp/apply-switch-table.sh >/tmp/apply-switch-table.log 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >>/tmp/apply-switch-table.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-table-apply-diagnostics
          path: /tmp/apply-switch-table.log
          if-no-files-found: error
