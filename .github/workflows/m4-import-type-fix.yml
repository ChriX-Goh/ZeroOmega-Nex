name: M4 importer type fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/m4-zeroomega-importer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m4-zeroomega-importer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve Weekday string narrowing
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/legacy-zeroomega/src/import.ts')
          text = path.read_text()
          old = """      if (typeof raw.days === 'string' && raw.days.length === 7) {
            days = WEEKDAYS.filter((_, index) => !['-', '_', '0'].includes(raw.days![index]!));
          } else {"""
          new = """      if (typeof raw.days === 'string' && raw.days.length === 7) {
            const dayMask = raw.days;
            days = WEEKDAYS.filter((_, index) => !['-', '_', '0'].includes(dayMask[index]!));
          } else {"""
          if old not in text:
              raise SystemExit('Weekday narrowing block not found')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write packages/legacy-zeroomega/src/import.ts packages/legacy-zeroomega/src/report.ts packages/legacy-zeroomega/src/node-fs-promises.d.ts
          pnpm --filter @zeroomega-nex/legacy-zeroomega check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/legacy-zeroomega
          git commit -m "fix(import): preserve Weekday narrowing in callbacks"
          git push origin HEAD:feat/m4-zeroomega-importer
