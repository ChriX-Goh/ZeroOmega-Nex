name: Apply Original New Profile And Virtual

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply reviewed product patch
        shell: bash
        run: |
          set -o pipefail
          {
            cat \
              .github/patches/virtual-new-profile.part00 \
              .github/patches/virtual-new-profile.part01 \
              .github/patches/virtual-new-profile.part02 \
              > /tmp/virtual-new-profile.b64
            test "$(wc -c < /tmp/virtual-new-profile.b64)" -eq 20428
            base64 --decode /tmp/virtual-new-profile.b64 > /tmp/virtual-new-profile.patch.gz
            gzip --test /tmp/virtual-new-profile.patch.gz
            gzip --decompress --stdout /tmp/virtual-new-profile.patch.gz > /tmp/virtual-new-profile.patch
            test "$(wc -c < /tmp/virtual-new-profile.patch)" -eq 66381
            git apply --check --verbose /tmp/virtual-new-profile.patch
            git apply /tmp/virtual-new-profile.patch
          } 2>&1 | tee patch-application.log

      - name: Normalize optional route rewrites
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/profile-workflow/src/profile-operations.ts')
          text = path.read_text()
          old = """  draft.settings.startup.route = replaceRouteReference(
            draft.settings.startup.route,
            fromProfileId,
            toProfileId,
          );
          """
          new = """  const startupRoute = replaceRouteReference(
            draft.settings.startup.route,
            fromProfileId,
            toProfileId,
          );
          if (startupRoute === undefined) delete draft.settings.startup.route;
          else draft.settings.startup.route = startupRoute;
          """
          if text.count(old) != 1:
              raise SystemExit('startup route rewrite anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Generate CSP-safe validator
        run: pnpm --filter @zeroomega-nex/profile-spec generate:validator

      - name: Format complete slice
        run: |
          pnpm exec prettier --write \
            apps/extension/src \
            packages/profile-spec \
            packages/profile-workflow \
            packages/legacy-zeroomega \
            packages/reference-interpreter \
            packages/pac-compiler \
            packages/browser-adapters \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md

      - name: Verify complete repository
        shell: bash
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee original-new-profile-virtual.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-new-profile-virtual-log
          path: |
            patch-application.log
            original-new-profile-virtual.log
          if-no-files-found: warn

      - name: Commit verified slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src \
            packages/profile-spec \
            packages/profile-workflow \
            packages/legacy-zeroomega \
            packages/reference-interpreter \
            packages/pac-compiler \
            packages/browser-adapters \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md
          git commit -m 'feat: restore original new-profile flow and virtual profiles'
          git push origin HEAD:feat/m8-profile-workflow
