name: Apply Original New Profile And Virtual

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply reviewed product patch
        shell: bash
        run: |
          base64 --decode .github/patches/virtual-new-profile.patch.gz.b64 | gzip --decompress > /tmp/virtual-new-profile.patch
          git apply --check /tmp/virtual-new-profile.patch
          git apply /tmp/virtual-new-profile.patch

      - name: Generate CSP-safe validator
        run: pnpm --filter @zeroomega-nex/profile-spec generate:validator

      - name: Format complete slice
        run: |
          pnpm exec prettier --write \
            apps/extension/src \
            packages/profile-spec \
            packages/profile-workflow \
            packages/legacy-zeroomega \
            packages/reference-interpreter \
            packages/pac-compiler \
            packages/browser-adapters \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md

      - name: Verify complete repository
        shell: bash
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee original-new-profile-virtual.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-new-profile-virtual-log
          path: original-new-profile-virtual.log
          if-no-files-found: warn

      - name: Commit verified slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src \
            packages/profile-spec \
            packages/profile-workflow \
            packages/legacy-zeroomega \
            packages/reference-interpreter \
            packages/pac-compiler \
            packages/browser-adapters \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md
          git commit -m 'feat: restore original new-profile flow and virtual profiles'
          git push origin HEAD:feat/m8-profile-workflow
