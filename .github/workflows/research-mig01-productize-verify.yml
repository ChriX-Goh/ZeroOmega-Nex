name: Research MIG-01.7 Productize Verify

on:
  push:
    branches:
      - research/mig01-semantic-productize
    paths:
      - '.github/workflows/research-mig01-productize-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium extension
        run: WXT_ICON_RENDERER_E2E=1 ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium
      - name: Run Chromium semantic migration chain
        env:
          ZEROOMEGA_MIG01_SEMANTIC_EVIDENCE_FILE: ${{ github.workspace }}/evidence/chromium.jsonl
        run: pnpm test:e2e:chromium
      - name: Run Chromium secret sentinel
        env:
          ZEROOMEGA_MIG01_SEMANTIC_EVIDENCE_FILE: ${{ github.workspace }}/evidence/chromium.jsonl
        run: node scripts/e2e-chromium-mig01-secret-leak.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: staging-mig01-semantic-chromium
          path: evidence/chromium.jsonl
          if-no-files-found: error

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: firefox --version
      - name: Build Firefox extension
        env:
          WXT_ICON_RENDERER_E2E: '1'
        run: pnpm build:firefox
      - name: Run Firefox semantic migration chain
        env:
          ZEROOMEGA_MIG01_SEMANTIC_EVIDENCE_FILE: ${{ github.workspace }}/evidence/firefox.jsonl
        run: pnpm test:e2e:firefox
      - name: Run Firefox secret sentinel
        env:
          ZEROOMEGA_MIG01_SEMANTIC_EVIDENCE_FILE: ${{ github.workspace }}/evidence/firefox.jsonl
        run: node scripts/e2e-firefox-mig01-secret-leak.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: staging-mig01-semantic-firefox
          path: evidence/firefox.jsonl
          if-no-files-found: error

  consolidate:
    needs: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: staging-mig01-semantic-chromium
          path: evidence/chromium
      - uses: actions/download-artifact@v4
        with:
          name: staging-mig01-semantic-firefox
          path: evidence/firefox
      - name: Validate canonical semantic evidence
        run: node scripts/validate-mig01-semantic-evidence.mjs evidence/chromium/chromium.jsonl evidence/firefox/firefox.jsonl

# Final staging pass after locked Prettier formatting.
