name: Stabilize M8 History E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Add language-neutral history selectors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/extension/src/entrypoints/options/SnapshotHistoryPanel.svelte')
          text = path.read_text()
          old = '    <article class="settings-section">'
          new = '    <article class="settings-section" data-snapshot-id={entry.snapshotId}>'
          if text.count(old) != 1:
              raise SystemExit(f'snapshot article anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('scripts/e2e-chromium.mjs')
          text = path.read_text()
          old = "  await options\n    .getByText(/^Snapshot pac-/u)\n    .first()\n    .waitFor({ timeout: 20_000 });"
          new = "  await options.locator('article[data-snapshot-id]').first().waitFor({ timeout: 20_000 });"
          if text.count(old) != 1:
              raise SystemExit(f'Chromium snapshot selector anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('scripts/e2e-firefox.mjs')
          text = path.read_text()
          old = '''  await driver.wait(
    until.elementLocated(By.xpath("//*[starts-with(normalize-space(.), 'Snapshot pac-')]")),
    20_000,
  );'''
          new = '''  await driver.wait(
    until.elementLocated(By.css('article[data-snapshot-id]')),
    20_000,
  );'''
          if text.count(old) != 1:
              raise SystemExit(f'Firefox snapshot selector anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/SnapshotHistoryPanel.svelte \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs
      - name: Verify selector contract
        run: |
          pnpm --filter @zeroomega-nex/extension check
          pnpm test:components
          pnpm verify
      - name: Commit selector contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/entrypoints/options/SnapshotHistoryPanel.svelte \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs
          git commit -m 'test: stabilize localized snapshot history E2E'
          git push origin HEAD:feat/m8-profile-workflow
