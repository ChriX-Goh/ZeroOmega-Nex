          runtime = 'apps/extension/src/lib/popup-temporary-rule-runtime.ts'
          replace_once(
              runtime,
              "    if (normalized.rules.length === 0) {\n      await this.#area.remove(POPUP_TEMPORARY_RULE_STORAGE_KEY);\n      return;\n    }",
              "    const overlayActive = normalized.overlayActive ?? normalized.rules.length > 0;\n    if (normalized.rules.length === 0 && !overlayActive) {\n      await this.#area.remove(POPUP_TEMPORARY_RULE_STORAGE_KEY);\n      return;\n    }",
          )
          replace_once(
