          replace_once(
              model,
              "export interface PopupTemporaryRuleState {\n  readonly schemaVersion: typeof POPUP_TEMPORARY_RULE_SCHEMA_VERSION;\n  readonly generation: number;\n  readonly rules: readonly PopupTemporaryRule[];",
