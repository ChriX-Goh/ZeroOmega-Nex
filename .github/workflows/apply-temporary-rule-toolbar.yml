              "function baseRouteFromRuntime(runtime: ProfileWorkflowRuntimeView): ProfileRouteTarget | undefined {\n  const temporaryBase = runtime.activeSnapshotId\n    ? decodePopupTemporarySnapshotId(runtime.activeSnapshotId)\n    : undefined;\n  return temporaryBase ?? runtime.activeRoute;\n}\n\nfunction temporaryOverlayActive(state: PopupTemporaryRuleState): boolean {\n  return state.overlayActive ?? state.rules.length > 0;\n}\n\nexport interface PopupTemporaryToolbarRuntimeView extends ProfileWorkflowRuntimeView {\n  readonly toolbarProjection?: {\n    readonly spec: ProfileSpec;\n    readonly activeRoute: ProfileRouteTarget;\n  };\n}\n\nexport class PopupTemporaryRuleCoordinator",
          )
          replace_once(
              runtime,
              "    if (state.rules.length > 0 && isPopupTemporaryBaseRouteSupported(candidate, baseRoute)) {\n      const sanitized = sanitizePopupTemporaryRuleState(state, candidate, baseRoute);\n      if (sanitized !== state) {\n        state = sanitized;\n        await this.#repository.write(state);\n      }\n      if (state.rules.length > 0) {\n        const overlay = buildPopupTemporaryRuleOverlay(candidate, state, baseRoute);\n        const activated = await this.#base.activate(overlay.spec, overlay.startRoute);\n        if (previousRuntime?.activeSnapshotId !== activated.snapshotId) {\n          await this.#cleanupSnapshot(previousRuntime?.activeSnapshotId);\n        }\n        return activated;\n      }\n    }",
              "    if (temporaryOverlayActive(state) && isPopupTemporaryBaseRouteSupported(candidate, baseRoute)) {\n      const sanitized = sanitizePopupTemporaryRuleState(state, candidate, baseRoute);\n      if (sanitized !== state) {\n        state = sanitized;\n        await this.#repository.write(state);\n      }\n      if (temporaryOverlayActive(state)) {\n        const overlay = buildPopupTemporaryRuleOverlay(candidate, state, baseRoute);\n        const activated = await this.#base.activate(overlay.spec, overlay.startRoute);\n        if (previousRuntime?.activeSnapshotId !== activated.snapshotId) {\n          await this.#cleanupSnapshot(previousRuntime?.activeSnapshotId);\n        }\n        return activated;\n      }\n    }",
          )
          replace_once(
              runtime,
              "  async inspectRuntime(): Promise<ProfileWorkflowRuntimeView> {\n    const runtime = (await this.#base.inspectRuntime?.()) ?? {};\n    const baseRoute = baseRouteFromRuntime(runtime);\n    return {\n      ...runtime,\n      ...(baseRoute === undefined ? {} : { activeRoute: baseRoute }),\n    };\n  }\n\n  async view(applied: ProfileSpec): Promise<PopupTemporaryRuleView> {",
              "  async inspectRuntime(): Promise<ProfileWorkflowRuntimeView> {\n    const runtime = (await this.#base.inspectRuntime?.()) ?? {};\n    const baseRoute = baseRouteFromRuntime(runtime);\n    return {\n      ...runtime,\n      ...(baseRoute === undefined ? {} : { activeRoute: baseRoute }),\n    };\n  }\n\n  async inspectToolbarRuntime(applied: ProfileSpec): Promise<PopupTemporaryToolbarRuntimeView> {\n    const runtime = (await this.#base.inspectRuntime?.()) ?? {};\n    const baseRoute = baseRouteFromRuntime(runtime);\n    const baseView = {\n      ...runtime,\n      ...(baseRoute === undefined ? {} : { activeRoute: baseRoute }),\n    };\n    if (\n      baseRoute === undefined ||\n      runtime.activeSnapshotId === undefined ||\n      !isPopupTemporarySnapshotId(runtime.activeSnapshotId) ||\n      !isPopupTemporaryBaseRouteSupported(applied, baseRoute)\n    ) {\n      return baseView;\n    }\n\n    let state = await this.#repository.read();\n    if (!temporaryOverlayActive(state)) return baseView;\n    const sanitized = sanitizePopupTemporaryRuleState(state, applied, baseRoute);\n    if (sanitized !== state) {\n      state = sanitized;\n      await this.#repository.write(state);\n    }\n    if (!temporaryOverlayActive(state)) return baseView;\n    const overlay = buildPopupTemporaryRuleOverlay(applied, state, baseRoute);\n    return {\n      ...baseView,\n      toolbarProjection: { spec: overlay.spec, activeRoute: overlay.startRoute },\n    };\n  }\n\n  async view(applied: ProfileSpec): Promise<PopupTemporaryRuleView> {",
          )
          replace_once(
              runtime,
              "    if (!hadTemporarySnapshot && state.rules.length === 0) return false;",
              "    if (!hadTemporarySnapshot && !temporaryOverlayActive(state)) return false;",
          )
          replace_once(
              runtime,
              "export interface RegisteredPopupTemporaryRuleRuntime {\n  dispose(): void;\n}\n\nexport function registerPopupTemporaryRuleRuntime(\n  api: PopupTemporaryRuleRuntimeApi,\n  coordinator: PopupTemporaryRuleCoordinator,\n): RegisteredPopupTemporaryRuleRuntime {",
              "export interface RegisteredPopupTemporaryRuleRuntime {\n  dispose(): void;\n}\n\nexport interface PopupTemporaryRuleRuntimeOptions {\n  readonly onActivationSucceeded?: () => void | Promise<void>;\n}\n\nexport function registerPopupTemporaryRuleRuntime(\n  api: PopupTemporaryRuleRuntimeApi,\n  coordinator: PopupTemporaryRuleCoordinator,\n  options: PopupTemporaryRuleRuntimeOptions = {},\n): RegisteredPopupTemporaryRuleRuntime {",
          )
          replace_once(
              runtime,
              "      if (message.action === 'toggle') {\n        return response(await coordinator.toggle(state.applied, message.domain, message.route));\n      }\n      if (message.action === 'remove') {\n        return response(await coordinator.remove(state.applied, message.domain));\n      }\n      return response(await coordinator.clear(state.applied));",
              "      let view: PopupTemporaryRuleView;\n      if (message.action === 'toggle') {\n        view = await coordinator.toggle(state.applied, message.domain, message.route);\n      } else if (message.action === 'remove') {\n        view = await coordinator.remove(state.applied, message.domain);\n      } else {\n        view = await coordinator.clear(state.applied);\n      }\n      await options.onActivationSucceeded?.();\n      return response(view);",
          )

          resolver = 'apps/extension/src/lib/original-toolbar-profile-resolver.ts'
          replace_once(
              resolver,
              "import type {\n  ProfileWorkflowRuntimeView,\n  ProfileWorkflowState,\n} from '@zeroomega-nex/profile-workflow';",
              "import type { ProfileRouteTarget, ProfileSpec } from '@zeroomega-nex/profile-spec';\nimport type {\n  ProfileWorkflowRuntimeView,\n  ProfileWorkflowState,\n} from '@zeroomega-nex/profile-workflow';",
          )
          replace_once(
              resolver,
              "export interface OriginalToolbarRuntimeInspector {\n  inspectRuntime(): Promise<ProfileWorkflowRuntimeView>;\n}",
              "export interface OriginalToolbarRuntimeView extends ProfileWorkflowRuntimeView {\n  readonly toolbarProjection?: {\n    readonly spec: ProfileSpec;\n    readonly activeRoute: ProfileRouteTarget;\n  };\n}\n\nexport interface OriginalToolbarRuntimeInspector {\n  inspectRuntime(applied: ProfileSpec): Promise<OriginalToolbarRuntimeView>;\n}",
          )
          replace_once(
              resolver,
              "    const runtime = await this.#runtime.inspectRuntime();\n    const activeRoute = runtime.activeRoute;\n    if (activeRoute === undefined) return undefined;\n\n    if (activeRoute.kind === 'direct' || activeRoute.kind === 'system') {\n      const trace = projectOriginalObservableResult({\n        spec: state.applied,",
              "    const runtime = await this.#runtime.inspectRuntime(state.applied);\n    const projectionSpec = runtime.toolbarProjection?.spec ?? state.applied;\n    const activeRoute = runtime.toolbarProjection?.activeRoute ?? runtime.activeRoute;\n    if (activeRoute === undefined) return undefined;\n\n    if (activeRoute.kind === 'direct' || activeRoute.kind === 'system') {\n      const trace = projectOriginalObservableResult({\n        spec: projectionSpec,",
          )
          replace_once(
              resolver,
              "    const decision = evaluateProfileGraph(state.applied, activeRoute, request);\n    const trace = projectOriginalObservableResult({\n      spec: state.applied,",
              "    const decision = evaluateProfileGraph(projectionSpec, activeRoute, request);\n    const trace = projectOriginalObservableResult({\n      spec: projectionSpec,",
          )

          projector = 'apps/extension/src/lib/original-observable-result-projector.ts'
          replace_once(
              projector,
              "import { projectOriginalPacTrace } from './original-observable-pac';",
              "import { projectOriginalPacTrace } from './original-observable-pac';\nimport { projectOriginalTemporaryRuleTrace } from './original-observable-temporary-rule';",
          )
          replace_once(
              projector,
              "    if (activeProfile?.kind === 'pac') {",
              "    if (activeProfile?.kind === 'switch' && activeProfile.id === 'zeroomega-nex.popup-temporary') {\n      return projectOriginalTemporaryRuleTrace({\n        spec: input.spec,\n        temporary: activeProfile,\n        decision: input.decision,\n        request: input.request,\n        i18n: input.i18n,\n        directColor,\n      });\n    }\n\n    if (activeProfile?.kind === 'pac') {",
          )

          background = 'apps/extension/src/entrypoints/background.ts'
          replace_once(
              background,
              "    runtime: {\n      inspectRuntime: async () => (await activationDriver.inspectRuntime?.()) ?? {},\n    },",
              "    runtime: {\n      inspectRuntime: async (applied) =>\n        temporaryRuleCoordinator\n          ? temporaryRuleCoordinator.inspectToolbarRuntime(applied)\n          : (await baseActivationDriver.inspectRuntime?.()) ?? {},\n    },",
          )
          replace_once(
              background,
              "  popupTemporaryRuleRuntime = temporaryRuleCoordinator\n    ? registerPopupTemporaryRuleRuntime(temporaryRuleApi, temporaryRuleCoordinator)\n    : undefined;",
              "  popupTemporaryRuleRuntime = temporaryRuleCoordinator\n    ? registerPopupTemporaryRuleRuntime(temporaryRuleApi, temporaryRuleCoordinator, {\n        onActivationSucceeded: () => refreshToolbar('temporary rule'),\n      })\n    : undefined;",
          )

          Path('apps/extension/src/lib/original-observable-temporary-rule.ts').write_text(r'''import type { FixedProfile, ProfileSpec, SwitchProfile } from '@zeroomega-nex/profile-spec';
import { POPUP_TEMPORARY_PROFILE_ID_PREFIX } from '@zeroomega-nex/profile-workflow';
import type { GraphDecision, ReferenceRequest } from '@zeroomega-nex/reference-interpreter';

import {
  localizeOriginalToolbarDetail,
  ORIGINAL_TOOLBAR_DETAIL_KEYS,
  type OriginalToolbarI18nApi,
} from './original-toolbar-i18n';
import type {
  OriginalObservableProfileReference,
  OriginalObservableResultTrace,
} from './original-observable-result-trace';

interface ProjectOriginalTemporaryRuleTraceInput {
  readonly spec: ProfileSpec;
  readonly temporary: SwitchProfile;
  readonly decision: GraphDecision;
  readonly request: ReferenceRequest;
  readonly i18n: OriginalToolbarI18nApi;
  readonly directColor: string;
}

function userProfile(name: string, color: string): OriginalObservableProfileReference {
  return { displayName: name, badgeName: name, color, builtin: false };
}

function directProfile(
  i18n: OriginalToolbarI18nApi,
  color: string,
): OriginalObservableProfileReference | undefined {
  const name = i18n.getMessage('routeDirect');
  return name.length === 0
    ? undefined
    : { displayName: `[${name}]`, badgeName: name, color, builtin: true };
}

function baseProfile(spec: ProfileSpec, temporary: SwitchProfile): SwitchProfile | undefined {
  if (
    temporary.id !== POPUP_TEMPORARY_PROFILE_ID_PREFIX ||
    temporary.name !== POPUP_TEMPORARY_PROFILE_ID_PREFIX ||
    temporary.defaultRoute.kind !== 'profile' ||
    temporary.attachedRuleListProfileId !== undefined ||
    temporary.rules.length > 1
  ) {
    return undefined;
  }
  const base = spec.profiles.find(
    (profile): profile is SwitchProfile =>
      profile.id === temporary.defaultRoute.profileId &&
      profile.kind === 'switch' &&
      profile.enabled !== false &&
      profile.color !== undefined &&
      profile.rules.length === 0 &&
      profile.defaultRoute.kind === 'direct' &&
      profile.attachedRuleListProfileId === undefined,
  );
  if (base === undefined || temporary.color !== base.color) return undefined;
  return base;
}

function fixedResult(
  spec: ProfileSpec,
  temporary: SwitchProfile,
): FixedProfile | undefined {
  const rule = temporary.rules[0];
  if (
    rule === undefined ||
    rule.enabled === false ||
    rule.condition.kind !== 'host-wildcard' ||
    !rule.condition.pattern.startsWith('*.') ||
    rule.condition.pattern.length <= 2 ||
    rule.condition.pattern.includes('\n') ||
    rule.condition.pattern.includes('\r') ||
    rule.route.kind !== 'profile'
  ) {
    return undefined;
  }
  return spec.profiles.find(
    (profile): profile is FixedProfile =>
      profile.id === rule.route.profileId &&
      profile.kind === 'fixed' &&
      profile.enabled !== false &&
      profile.color !== undefined &&
      profile.bypass.length === 0,
  );
}

export function projectOriginalTemporaryRuleTrace(
  input: ProjectOriginalTemporaryRuleTraceInput,
): OriginalObservableResultTrace | undefined {
  const { decision, i18n, spec, temporary } = input;
  if (decision.status !== 'resolved' || decision.support !== 'exact') return undefined;
  const base = baseProfile(spec, temporary);
  if (base === undefined || base.color === undefined) return undefined;
  const trace = decision.trace;
  let index = 0;
  if (trace[index]?.action !== 'enter-profile' || trace[index]?.profileId !== temporary.id) {
    return undefined;
  }
  index += 1;

  const rule = temporary.rules[0];
  if (rule !== undefined) {
    const ruleEntry = trace[index];
    if (
      ruleEntry?.action !== 'switch-rule' ||
      ruleEntry.profileId !== temporary.id ||
      ruleEntry.ruleId !== rule.id
    ) {
      return undefined;
    }
    index += 1;

    if (ruleEntry.matched === true) {
      const fixed = fixedResult(spec, temporary);
      if (
        fixed === undefined ||
        fixed.color === undefined ||
        decision.route.kind !== 'proxy' ||
        decision.route.endpoint.protocol !== 'http' ||
        fixed.proxyByScheme.fallback !== decision.route.endpointId ||
        fixed.proxyByScheme.http !== undefined ||
        trace[index]?.action !== 'enter-profile' ||
        trace[index]?.profileId !== fixed.id ||
        trace[index + 1]?.action !== 'fixed-endpoint' ||
        trace[index + 1]?.profileId !== fixed.id ||
        trace[index + 1]?.endpointId !== decision.route.endpointId ||
        trace.length !== index + 2
      ) {
        return undefined;
      }
      const prefix = localizeOriginalToolbarDetail(
        i18n,
        ORIGINAL_TOOLBAR_DETAIL_KEYS.temporaryRulePrefix,
      );
      return {
        currentProfile: userProfile(base.name, base.color),
        resultProfile: userProfile(fixed.name, fixed.color),
        details:
          `${prefix}${rule.condition.kind === 'host-wildcard' ? rule.condition.pattern : ''} => ${fixed.name}\n` +
          `PROXY ${decision.route.endpoint.host}:${decision.route.endpoint.port}\n`,
        routeKind: 'proxy',
        directProfileColor: input.directColor,
        directResult: false,
        currentProfileStatic: false,
        matchedProfileIsCurrent: false,
        detailPrefix: prefix,
      };
    }
    if (ruleEntry.matched !== false) return undefined;
  }

  if (
    decision.route.kind !== 'direct' ||
    trace[index]?.action !== 'switch-default' ||
    trace[index]?.profileId !== temporary.id ||
    trace[index + 1]?.action !== 'enter-profile' ||
    trace[index + 1]?.profileId !== base.id ||
    trace[index + 2]?.action !== 'switch-default' ||
    trace[index + 2]?.profileId !== base.id ||
    trace[index + 3]?.action !== 'direct' ||
    trace.length !== index + 4
  ) {
    return undefined;
  }
  const direct = directProfile(i18n, input.directColor);
  const defaultDetail = localizeOriginalToolbarDetail(
    i18n,
    ORIGINAL_TOOLBAR_DETAIL_KEYS.defaultRule,
  );
  if (direct === undefined) return undefined;
  return {
    currentProfile: userProfile(base.name, base.color),
    resultProfile: direct,
    details:
      `${defaultDetail} => ${base.name}\n` + `${defaultDetail} => ${direct.displayName}\n`,
    routeKind: 'direct',
    directProfileColor: input.directColor,
    directResult: true,
    currentProfileStatic: false,
    matchedProfileIsCurrent: false,
  };
}
''')

          Path('apps/extension/src/lib/original-toolbar-temporary-rule.test.ts').write_text(r'''import type { ProfileRouteTarget, ProfileSpec } from '@zeroomega-nex/profile-spec';
import {
  buildPopupTemporaryRuleOverlay,
  createPopupTemporaryRuleState,
  createProfileWorkflowState,
  removePopupTemporaryRule,
  togglePopupTemporaryRule,
  type ProfileWorkflowRuntimeView,
  type ProfileWorkflowState,
} from '@zeroomega-nex/profile-workflow';
import { describe, expect, it } from 'vitest';

import type { OriginalToolbarI18nApi } from './original-toolbar-i18n';
import {
  OriginalToolbarProfileResolver,
  type OriginalToolbarProfileStateRepository,
  type OriginalToolbarRuntimeInspector,
  type OriginalToolbarRuntimeView,
} from './original-toolbar-profile-resolver';

class MemoryRepository implements OriginalToolbarProfileStateRepository {
  constructor(readonly state: ProfileWorkflowState) {}
  async read(): Promise<ProfileWorkflowState> {
    return this.state;
  }
}

class ProjectedRuntime implements OriginalToolbarRuntimeInspector {
  constructor(readonly view: OriginalToolbarRuntimeView) {}
  async inspectRuntime(): Promise<OriginalToolbarRuntimeView> {
    return this.view;
  }
}

class EnglishI18n implements OriginalToolbarI18nApi {
  getMessage(name: string): string {
    if (name === 'routeDirect') return 'Direct';
    if (name === 'browserAction_defaultRuleDetails') return '(default)';
    if (name === 'browserAction_tempRulePrefix') return '(TEMP) ';
    return '';
  }
}

function fixture(): {
  readonly state: ProfileWorkflowState;
  readonly baseRoute: ProfileRouteTarget;
  readonly fixedRoute: ProfileRouteTarget;
} {
  const spec: ProfileSpec = {
    schemaVersion: '1.0',
    documentId: 'temporary-rule-toolbar',
    revision: { id: 'temporary-rule-revision', createdAt: '2026-08-02T04:42:00.000Z' },
    profiles: [
      {
        id: 'temporary-fixed',
        name: 'Runtime Temporary Fixed',
        color: '#64b5f6',
        kind: 'fixed',
        proxyByScheme: { fallback: 'temporary-endpoint' },
        bypass: [],
      },
      {
        id: 'temporary-base',
        name: 'Runtime Temporary Base',
        color: '#ffb74d',
        kind: 'switch',
        rules: [],
        defaultRoute: { kind: 'direct' },
      },
    ],
    proxyEndpoints: [
      {
        id: 'temporary-endpoint',
        name: 'Temporary endpoint',
        protocol: 'http',
        host: '127.0.0.1',
        port: 18187,
      },
    ],
    ruleSources: [],
    settings: {
      startup: {
        route: { kind: 'profile', profileId: 'temporary-base' },
        revertProxyChanges: true,
      },
      quickSwitch: { enabled: true, routes: [], refreshOnChange: false },
      interface: {
        confirmDeletion: true,
        showInspectMenu: true,
        addConditionsToBottom: false,
        showResultProfileOnActionBadgeText: true,
        showExternalProfile: true,
        showAdvancedConditions: false,
        exportLegacyRuleList: false,
        builtInProfiles: { direct: { color: '#aaaaaa' } },
      },
      ruleSourceUpdateIntervalMinutes: 1440,
    },
  };
  return {
    state: createProfileWorkflowState(spec),
    baseRoute: { kind: 'profile', profileId: 'temporary-base' },
    fixedRoute: { kind: 'profile', profileId: 'temporary-fixed' },
  };
}

async function resolve(
  state: ProfileWorkflowState,
  projection: { readonly spec: ProfileSpec; readonly activeRoute: ProfileRouteTarget },
  url: string,
) {
  const runtime: ProfileWorkflowRuntimeView = { activeRoute: { kind: 'profile', profileId: 'temporary-base' } };
  return new OriginalToolbarProfileResolver({
    repository: new MemoryRepository(state),
    runtime: new ProjectedRuntime({ ...runtime, toolbarProjection: projection }),
    i18n: new EnglishI18n(),
  }).resolve({ tabId: 71, url });
}

describe('original temporary-rule Toolbar projection', () => {
  it('reproduces the matched Fixed result and TEMP prefix', async () => {
