name: Staged Chromium Extension Page Cleanup

on:
  workflow_dispatch:

jobs:
  staged:
    runs-on: ubuntu-latest
    steps:
      - name: Staged patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('scripts/e2e-chromium.mjs')
          text = path.read_text()
          old = '  const temporaryCleanup = await worker.evaluate(\n'
          new = '  const temporaryCleanup = await temporaryManager.evaluate(\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one worker cleanup sender, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          Path('.github/workflows/export-original-temp-rule-source.yml').write_text(
              "name: Temporary Launcher Cleanup\n\n"
              "on:\n"
              "  workflow_dispatch:\n\n"
              "permissions:\n"
              "  contents: read\n\n"
              "jobs:\n"
              "  noop:\n"
              "    runs-on: ubuntu-24.04\n"
              "    steps:\n"
              "      - run: echo cleanup\n"
          )
          subprocess.run(
              ['pnpm', 'exec', 'prettier', '--write', 'scripts/e2e-chromium.mjs'],
              check=True,
          )
          Path('.github/workflows/apply-temporary-rule-toolbar.yml').unlink()
          PY

      - name: Format and verify repository
