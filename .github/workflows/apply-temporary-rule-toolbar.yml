name: Staged Chromium Temporary Overlay Patch

on:
  workflow_dispatch:

jobs:
  staged:
    runs-on: ubuntu-latest
    steps:
      - name: Staged patch
        run: |
          python - <<'PY'
          from base64 import b64decode
          from pathlib import Path
          import subprocess

          path = Path('scripts/e2e-chromium.mjs')
          text = path.read_text()
          failure = "'Deleting the final temporary rule did not restore the underlying route'"
          if text.count(failure) != 1:
              raise SystemExit(f'expected one outdated failure marker, found {text.count(failure)}')
          marker_index = text.index(failure)
          start = text.rfind('  await assertEventually(async () => {', 0, marker_index)
          close = '  await temporaryManager.close();\n'
          end = text.find(close, marker_index)
          if start < 0 or end < 0:
              raise SystemExit('could not bound the outdated Chromium assertion')
          end += len(close)
          replacement = """  await assertEventually(async () => {
            const [local, session] = await worker.evaluate(async () =>
              Promise.all([chrome.storage.local.get(null), chrome.storage.session.get(null)]),
            );
            const temporaryState = session['zeroomega-nex/popup-temporary-rules/v1/state'];
            return (
              temporaryState?.overlayActive === true &&
              Array.isArray(temporaryState.rules) &&
              temporaryState.rules.length === 0 &&
              String(local['zeroomega-nex/browser-proxy/v1/state']?.activeSnapshotId ?? '').startsWith(
                'popup-temporary-v1/',
              )
            );
          }, 'Deleting the final temporary rule did not retain the original empty overlay');

          const temporaryCleanup = await worker.evaluate(
            async (expectedAppliedRevisionId) =>
              chrome.runtime.sendMessage({
                channel: 'zeroomega-nex/profile-workflow/v1',
                action: 'activate-route',
                expectedAppliedRevisionId,
                route: { kind: 'system' },
              }),
            popupWorkflow.applied.revision.id,
          );
          assert.equal(
            temporaryCleanup?.ok,
            true,
            `System cleanup after temporary-rule evidence failed: ${JSON.stringify(temporaryCleanup)}`,
          );
          await assertEventually(async () => {
            const local = await worker.evaluate(async () => chrome.storage.local.get(null));
            return !String(
              local['zeroomega-nex/browser-proxy/v1/state']?.activeSnapshotId ?? '',
            ).startsWith('popup-temporary-v1/');
          }, 'System cleanup did not leave the temporary overlay');
          await temporaryManager.close();
          """
          path.write_text(text[:start] + replacement + text[end:])

          permanent_workflow = b64decode(
              '',
          ).decode('utf-8')
          Path('.github/workflows/original-toolbar-evidence.yml').write_text(permanent_workflow)
          Path('.github/workflows/export-original-temp-rule-source.yml').write_text(
              "name: Temporary Launcher Cleanup\n\n"
              "on:\n"
              "  workflow_dispatch:\n\n"
              "permissions:\n"
              "  contents: read\n\n"
              "jobs:\n"
              "  noop:\n"
              "    runs-on: ubuntu-24.04\n"
              "    steps:\n"
              "      - run: echo cleanup\n"
          )
          subprocess.run(
              ['pnpm', 'exec', 'prettier', '--write', 'scripts/e2e-chromium.mjs'],
              check=True,
          )
          Path('.github/workflows/apply-temporary-rule-toolbar.yml').unlink()
          PY

      - name: Format and verify repository
