name: Audit original ZeroOmega v3.5.0 release

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/audit-original-zeroomega-v3.5.0.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Download official release assets
        run: |
          set -euo pipefail
          mkdir -p original-release/chromium original-release/firefox
          curl --fail --location --retry 3 \
            --output original-release/chromium-release.zip \
            https://github.com/zero-peak/ZeroOmega/releases/download/v3.5.0/chromium-release.zip
          curl --fail --location --retry 3 \
            --output original-release/firefox-release.zip \
            https://github.com/zero-peak/ZeroOmega/releases/download/v3.5.0/firefox-release.zip

      - name: Verify and inventory exact packages
        run: |
          set -euo pipefail
          sha256sum \
            original-release/chromium-release.zip \
            original-release/firefox-release.zip \
            | tee original-release/SHA256SUMS
          unzip -t original-release/chromium-release.zip | tee original-release/chromium-zip-test.txt
          unzip -t original-release/firefox-release.zip | tee original-release/firefox-zip-test.txt
          unzip -q original-release/chromium-release.zip -d original-release/chromium
          unzip -q original-release/firefox-release.zip -d original-release/firefox
          find original-release/chromium -type f -printf '%P\n' | sort > original-release/chromium-files.txt
          find original-release/firefox -type f -printf '%P\n' | sort > original-release/firefox-files.txt
          find original-release/chromium -name manifest.json -print -exec cp '{}' original-release/chromium-manifest.json \;
          find original-release/firefox -name manifest.json -print -exec cp '{}' original-release/firefox-manifest.json \;
          python - <<'PY'
          import json
          from pathlib import Path
          for target in ('chromium', 'firefox'):
              path = Path(f'original-release/{target}-manifest.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              summary = {
                  'target': target,
                  'name': data.get('name'),
                  'version': data.get('version'),
                  'manifest_version': data.get('manifest_version'),
                  'action': data.get('action'),
                  'permissions': data.get('permissions'),
                  'host_permissions': data.get('host_permissions'),
                  'commands': data.get('commands'),
                  'background': data.get('background'),
                  'options_page': data.get('options_page'),
                  'options_ui': data.get('options_ui'),
                  'browser_specific_settings': data.get('browser_specific_settings'),
              }
              Path(f'original-release/{target}-manifest-summary.json').write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Write durable release evidence
        run: |
          set -euo pipefail
          chromium_sha=$(awk '/chromium-release.zip/ {print $1}' original-release/SHA256SUMS)
          firefox_sha=$(awk '/firefox-release.zip/ {print $1}' original-release/SHA256SUMS)
          chromium_count=$(wc -l < original-release/chromium-files.txt)
          firefox_count=$(wc -l < original-release/firefox-files.txt)
          chromium_size=$(stat -c '%s' original-release/chromium-release.zip)
          firefox_size=$(stat -c '%s' original-release/firefox-release.zip)
          cat > docs/AUDIT_EVIDENCE_01_ORIGINAL_RELEASE.md <<EOF
          # Audit Evidence 01B — Official ZeroOmega v3.5.0 Release Packages

          ## Authority

          - Repository: \`zero-peak/ZeroOmega\`.
          - Release tag: \`v3.5.0\`.
          - Download source: official GitHub release assets only.
          - Capture runner: Ubuntu 24.04 GitHub-hosted runner.

          ## Exact packages

          | Target | Asset | Bytes | SHA-256 | Extracted files |
          | --- | --- | ---: | --- | ---: |
          | Chromium | \`chromium-release.zip\` | ${chromium_size} | \`${chromium_sha}\` | ${chromium_count} |
          | Firefox | \`firefox-release.zip\` | ${firefox_size} | \`${firefox_sha}\` | ${firefox_count} |

          Both ZIP integrity tests passed before extraction.

          ## Manifest evidence

          ### Chromium

          \`\`\`json
          $(cat original-release/chromium-manifest-summary.json)
          \`\`\`

          ### Firefox

          \`\`\`json
          $(cat original-release/firefox-manifest-summary.json)
          \`\`\`

          ## Acceptance boundary

          These are the exact official installable packages required for runtime reference. Package integrity and manifest identity are source-captured. Installed toolbar screenshots, per-tab transitions and browser-specific runtime observations remain open and must not be inferred from package inspection alone.
          EOF
          sed -i 's/^          //' docs/AUDIT_EVIDENCE_01_ORIGINAL_RELEASE.md

      - name: Upload immutable original release evidence
        uses: actions/upload-artifact@v4
        with:
          name: original-zeroomega-v3.5.0-release-evidence
          path: original-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Commit evidence and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/audit-original-zeroomega-v3.5.0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/AUDIT_EVIDENCE_01_ORIGINAL_RELEASE.md .github/workflows/audit-original-zeroomega-v3.5.0.yml
          git commit -m "docs: capture official original v3.5.0 release packages"
          git push origin HEAD:feat/m8-profile-workflow

# The update after registration triggers this one-time audit.
