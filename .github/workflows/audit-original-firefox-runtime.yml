name: Audit original Firefox toolbar runtime

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/audit-original-firefox-runtime.yml
      - scripts/audit-original-toolbar-firefox.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/audit-original-firefox-runtime.yml
      - scripts/audit-original-toolbar-firefox.mjs

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Format audit source
        run: pnpm exec prettier --write scripts/audit-original-toolbar-firefox.mjs

      - name: Show Firefox version
        run: firefox --version

      - name: Download exact official Firefox package
        run: |
          set -euo pipefail
          mkdir -p original-release/firefox original-runtime/firefox
          curl --fail --location --retry 3 \
            --output original-release/firefox-release.zip \
            https://github.com/zero-peak/ZeroOmega/releases/download/v3.5.0/firefox-release.zip
          echo '666ce976022ed379601b896f9138ada82a29aabfe0154bf2bf1ae779e3319cda  original-release/firefox-release.zip' \
            | sha256sum --check
          unzip -q original-release/firefox-release.zip -d original-release/firefox

      - name: Run original Firefox runtime audit
        env:
          ZEROOMEGA_ORIGINAL_FIREFOX_PATH: original-release/firefox
          ZEROOMEGA_ORIGINAL_RUNTIME_OUTPUT: original-runtime/firefox
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-original-toolbar-firefox.mjs \
            2>&1 | tee original-runtime/firefox/audit.log

      - name: Write durable runtime evidence
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('original-runtime/firefox/runtime.json').read_text(encoding='utf-8'))
          lines = [
              '# Audit Evidence 01D — Original ZeroOmega v3.5.0 Firefox Runtime',
              '',
              '## Authority',
              '',
              '- Package: official `firefox-release.zip` from release `v3.5.0`.',
              '- Package SHA-256: `666ce976022ed379601b896f9138ada82a29aabfe0154bf2bf1ae779e3319cda`.',
              f"- Runtime browser: Firefox `{data['browserVersion']}` on Ubuntu 24.04 GitHub runner.",
              f"- Add-on ID: `{data['addonId']}`.",
              f"- Audit runtime UUID: `{data['extensionUuid']}`.",
              '',
              '## Captured Action states',
              '',
              '| State | URL | Title | Badge | Popup |',
              '| --- | --- | --- | --- | --- |',
          ]
          for state in data['states']:
              action = state['action']
              title = str(action.get('title', '')).replace('|', '\\|').replace('\n', '<br>')
              badge = str(action.get('badgeText', '')).replace('|', '\\|')
              popup = str(action.get('popup', '')).replace('|', '\\|')
              url = str(state.get('url', '')).replace('|', '\\|')
              lines.append(f"| `{state['label']}` | `{url}` | {title} | `{badge}` | `{popup}` |")
          popup = data['popup']
          viewport = popup['viewport']
          lines.extend([
              '',
              '## Installed UI capture',
              '',
              f"- Options title: `{data['options']['title']}`.",
              f"- Popup title: `{popup['title']}`.",
              f"- Popup viewport: `{viewport['innerWidth']} × {viewport['innerHeight']}`.",
              f"- Popup document extent: `{viewport['scrollWidth']} × {viewport['scrollHeight']}`.",
              '- Screenshots: `options-zh-CN.png` and `popup-zh-CN.png` in the workflow Artifact.',
              '',
              '## Acceptance boundary',
              '',
              'This is real execution of the exact official Firefox package through Selenium WebDriver and WebDriver BiDi installation. It captures runtime title/Badge/Popup state and installed extension pages. Headless execution does not provide an operating-system screenshot of the browser toolbar icon itself; exact icon geometry/assets remain covered by source and package evidence. User-profile, Switch/PAC result, temporary-rule, Inspect and external-control states remain open.',
              '',
          ])
          Path('docs/AUDIT_EVIDENCE_01D_ORIGINAL_FIREFOX_RUNTIME.md').write_text(
              '\n'.join(lines), encoding='utf-8'
          )
          PY
          pnpm exec prettier --write \
            scripts/audit-original-toolbar-firefox.mjs \
            docs/AUDIT_EVIDENCE_01D_ORIGINAL_FIREFOX_RUNTIME.md

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-zeroomega-v3.5.0-firefox-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: original-runtime/firefox
          if-no-files-found: error
          retention-days: 90

      - name: Commit evidence and remove one-time workflow
        if: success() && github.event_name == 'push'
        run: |
          rm .github/workflows/audit-original-firefox-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/audit-original-toolbar-firefox.mjs \
            docs/AUDIT_EVIDENCE_01D_ORIGINAL_FIREFOX_RUNTIME.md \
            .github/workflows/audit-original-firefox-runtime.yml
          git commit -m 'docs: capture original Firefox toolbar runtime'
          git push origin HEAD:feat/m8-profile-workflow
