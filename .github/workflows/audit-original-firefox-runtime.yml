name: Audit original Firefox toolbar runtime

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/audit-original-firefox-runtime.yml
      - scripts/audit-original-toolbar-firefox.mjs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Show Firefox version
        run: firefox --version

      - name: Download exact official Firefox package
        run: |
          set -euo pipefail
          mkdir -p original-release/firefox original-runtime/firefox
          curl --fail --location --retry 3 \
            --output original-release/firefox-release.zip \
            https://github.com/zero-peak/ZeroOmega/releases/download/v3.5.0/firefox-release.zip
          echo '666ce976022ed379601b896f9138ada82a29aabfe0154bf2bf1ae779e3319cda  original-release/firefox-release.zip' \
            | sha256sum --check
          unzip -q original-release/firefox-release.zip -d original-release/firefox

      - name: Run original Firefox runtime audit
        env:
          ZEROOMEGA_ORIGINAL_FIREFOX_PATH: original-release/firefox
          ZEROOMEGA_ORIGINAL_RUNTIME_OUTPUT: original-runtime/firefox
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-original-toolbar-firefox.mjs \
            2>&1 | tee original-runtime/firefox/audit.log

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-zeroomega-v3.5.0-firefox-runtime-${{ github.sha }}
          path: original-runtime/firefox
          if-no-files-found: error
          retention-days: 90
