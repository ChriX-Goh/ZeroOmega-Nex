# integration revision 4
name: Integrate typed History

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-typed-history.yml
      - .github/patches/*typed-history*.py
      - .github/patches/apply-history-delivery-reconciliation.py
      - .github/patches/fix-parity-status-guard.py

permissions:
  contents: write

concurrency:
  group: integrate-typed-history-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply typed History slice
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/fix-typed-history-patches.py
            python .github/patches/apply-typed-history-catalog.py
            python .github/patches/apply-typed-history-integration.py
            python .github/patches/fix-typed-history-legacy-guards.py
            python .github/patches/apply-history-delivery-reconciliation.py
            python .github/patches/fix-parity-status-guard.py
          } 2>&1 | tee typed-history-apply.log
      - name: Format product slice
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee typed-history-format.log
      - name: Generate locale inventory
        run: |
          set -o pipefail
          pnpm locale:inventory 2>&1 | tee typed-history-inventory.log
          pnpm exec prettier --write docs/LOCALE_INVENTORY.json
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee typed-history-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium History rollback regression
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee typed-history-chromium.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-history-${{ github.run_id }}
          path: typed-history-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-typed-history.yml
          rm -f \
            .github/patches/fix-typed-history-patches.py \
            .github/patches/fix-typed-history-legacy-guards.py \
            .github/patches/apply-typed-history-catalog.py \
            .github/patches/apply-typed-history-integration.py \
            .github/patches/apply-history-delivery-reconciliation.py \
            .github/patches/fix-parity-status-guard.py \
            typed-history-apply.log \
            typed-history-format.log \
            typed-history-inventory.log \
            typed-history-verify.log \
            typed-history-chromium.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add typed History and real snapshot rollback"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow