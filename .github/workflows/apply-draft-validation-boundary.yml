name: Apply Draft validation boundary

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-draft-validation-boundary.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconstruct and apply verified patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            git fetch --no-tags origin tmp/draft-validation-package
            for part in 00 01 02 03 04 05a 05b 06 07 08 09 10 11 12 13 14 15 16; do
              git show FETCH_HEAD:patch.$part
            done > /tmp/draft-validation.patch.gz.b64
            base64 --decode /tmp/draft-validation.patch.gz.b64 > /tmp/draft-validation.patch.gz
            sha256sum /tmp/draft-validation.patch.gz
            echo '412ffb0e3b3c8c9ccaf44a5da9bfcb3fd38e44497f30dd7ef97c3e0091617d9a  /tmp/draft-validation.patch.gz' | sha256sum --check
            gzip --decompress --stdout /tmp/draft-validation.patch.gz > /tmp/draft-validation.patch
            sha256sum /tmp/draft-validation.patch
            echo '213ffb83ecfbb83163fe313f43cf3868dc6188e348d9773daeb0df9eb31a828c  /tmp/draft-validation.patch' | sha256sum --check
            git apply --check --verbose /tmp/draft-validation.patch
            git apply /tmp/draft-validation.patch
          } 2>&1 | tee /tmp/draft-validation-patch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-validation-patch-diagnostics
          path: /tmp/draft-validation-patch.log
          if-no-files-found: error
      - name: Enforce patch result
        if: steps.patch.outcome != 'success'
        run: exit 1
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/AdvancedProfileEditor.svelte \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/FixedProfileEditor.svelte \
            apps/extension/src/entrypoints/options/SwitchProfileEditor.svelte \
            apps/extension/src/entrypoints/options/VirtualProfileEditor.svelte \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            packages/profile-spec/src/index.test.ts \
            packages/profile-spec/src/index.ts \
            packages/profile-spec/src/serialization.test.ts \
            packages/profile-spec/src/serialization.ts \
            packages/profile-spec/src/validation.ts \
            packages/profile-workflow/src/advanced-profile-operations.ts \
            packages/profile-workflow/src/apply.test.ts \
            packages/profile-workflow/src/profile-operations.ts \
            packages/profile-workflow/src/state.test.ts \
            packages/profile-workflow/src/state.ts \
            packages/profile-workflow/src/storage-repository.test.ts \
            packages/profile-workflow/src/storage-repository.ts \
            packages/profile-workflow/src/switch-operations.test.ts \
            packages/profile-workflow/src/switch-operations.ts \
            scripts/validate-ui-compatibility.mjs
      - name: Verify repository
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee /tmp/draft-validation-verify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-validation-verify-log
          path: /tmp/draft-validation-verify.log
          if-no-files-found: error
      - name: Enforce verification result
        if: steps.verify.outcome != 'success'
        run: exit 1
      - name: Remove temporary transport files
        run: |
          rm -rf browser-builds browser-builds.tar.gz .github/patches
          rm -f .github/workflows/capture-draft-validation-call-sites.yml
          rm -f .github/workflows/capture-draft-validation-source.yml
          rm -f .github/workflows/apply-draft-validation-boundary.yml
          git diff --check
      - name: Commit verified product slice
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: separate Draft and Apply validation'
          git push origin HEAD:feat/m8-profile-workflow
