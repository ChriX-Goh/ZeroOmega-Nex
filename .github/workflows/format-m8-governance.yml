name: Format Milestone 8 governance

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-m8-governance.yml
      - docs/MILESTONE_8_SESSION_7_CHECKPOINT.md
      - docs/MILESTONE_8_STATUS.md
      - docs/MILESTONE_8_RELEASE_CANDIDATE.md
      - docs/UI_AUDIT_MATRIX.md

permissions:
  contents: write

concurrency:
  group: format-m8-governance-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch Head
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format governance documents
        run: |
          pnpm exec prettier --write \
            docs/MILESTONE_8_SESSION_7_CHECKPOINT.md \
            docs/MILESTONE_8_STATUS.md \
            docs/MILESTONE_8_RELEASE_CANDIDATE.md \
            docs/UI_AUDIT_MATRIX.md
          git rm .github/workflows/format-m8-governance.yml

      - name: Commit formatted documents and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MILESTONE_8_SESSION_7_CHECKPOINT.md \
            docs/MILESTONE_8_STATUS.md \
            docs/MILESTONE_8_RELEASE_CANDIDATE.md \
            docs/UI_AUDIT_MATRIX.md
          git diff --cached --quiet && exit 0
          git commit -m 'style: format milestone 8 governance documents'
          git push origin HEAD:feat/m8-profile-workflow
