name: MIG-01.7B temporary closure sync

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/mig-01-7b-closure-sync-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 2
      - name: Synchronize MIG-01.7 closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          evidence_head = '83451c1b313057e45fb954a47fc5fb08bb9268c6'

          matrix = Path('docs/MIG_01_SEMANTIC_ROUNDTRIP_SECURITY_MATRIX.md')
          text = matrix.read_text()
          text = text.replace(
              'Status: active repository-controlled evidence for `MIG-01.7`.',
              f'Status: repository-controlled `MIG-01.7` evidence closed at code/evidence Head `{evidence_head}`; `MIG-01` remains open because Corpus B is absent.',
              1,
          )
          text = text.replace(
              '| rendered browser UI                     | pending browser-visible scan                          | `MIG-01.7B`                                     |',
              '| rendered browser UI                     | no raw secret value                                   | Chromium + Firefox sensitive migration E2E      |',
              1,
          )
          text = text.replace(
              '| Actions logs / uploaded diagnostics ZIP | pending artifact scan                                 | `MIG-01.7B`                                     |',
              '| Actions logs / uploaded diagnostics ZIP | no raw secret value                                   | downstream `migration-secret-leak-gate`         |',
              1,
          )
          marker = 'No new product UI or per-field workflow is\nauthorized. `MIG-01.7B` closes only after this exact-head Browser E2E chain passes.\n'
          if marker not in text:
              raise SystemExit('MIG-01.7B closure marker not found')
          closure = f'''\n## 4. Closure evidence\n\n`MIG-01.7A` remains closed at `c0b23ee765db8b50d86fc8fa61ba105cd7c2a830`.\n\n`MIG-01.7B` closed at code/evidence Head `{evidence_head}` after the final cleaned branch passed all\nsix permanent workflows:\n\n- CI `31185198202`: SUCCESS;\n- Browser E2E `31185199106`: SUCCESS;\n- Parity Documentation `31185196419`: SUCCESS;\n- Milestone 8 Visual Evidence `31185196254`: SUCCESS;\n- Original Nex UI Evidence `31185200569`: SUCCESS;\n- Original Toolbar Evidence `31185201981`: SUCCESS.\n\nBrowser E2E jobs were Chromium `92887883714` SUCCESS and Firefox `92887883688` SUCCESS. Both\npackaged browsers passed their runtime-only sensitive original-migration gate. Downstream\n`migration-secret-leak-gate` job `92888843896` also SUCCESS and reported that the controlled\nsentinels were absent across 15 diagnostics files and both browser job logs. Diagnostics artifacts:\n\n- Chromium `8996480031`, SHA-256 `6c06fa9399ac1fb0cef55bdf2693290eb790ee45f2f749db7d1cd1f1155dc8d5`;\n- Firefox `8996523043`, SHA-256 `fbbc00652e10d9879652fabe8f0193b0e77d3bdec85899239645b0b76ca04fd9`.\n\nA Firefox large-migration teardown defect discovered during exact-head closure was corrected without\nrelaxing migration assertions: repeated `driver.quit()` now treats only an already-ended WebDriver\nsession as idempotent cleanup, while every other teardown error still fails. This removed a\n`NoSuchSessionError` cleanup false negative and passes the full lint/build/browser gate set.\n\nThe repository-controlled scope of `MIG-01.7` is therefore closed. This does **not** close `MIG-01`:\nCorpus B is still the required external owner representative backup and must not be fabricated. The\nnext sequence position is `MIG-01.8`, but batch-final closure is blocked until Corpus B can complete\nthe A-D acceptance set. Product completion remains `45.15%` (reported `45%`), owner retest remains\nprohibited, PR #11 remains Draft, and release remains `NO-GO`.\n'''
          text = text.replace(marker, marker + closure, 1)
          matrix.write_text(text)

          state_path = Path('docs/PROJECT_STATE.json')
          state = json.loads(state_path.read_text())
          state['active_batch']['phase'] = 'MIG_01_7_REPOSITORY_CONTROLLED_CLOSED_MIG_01_8_BLOCKED_CORPUS_B'
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n')

          kg = Path('docs/SESSION_17_KNOWLEDGE_GRAPH.md')
          kg_text = kg.read_text()
          appendix = f'''\n\n## Session 17 actual continuation — MIG-01.7B closure and handoff (2026-08-07)\n\nThis ordinary-chat continuation revalidated the handoff against the repository rather than trusting\nthe prior summary. Session-start Head was `e3f7965a229734ab1daf6dc76cf1ddd415aa7f1c`. Five permanent\nworkflows were green there, while Browser E2E `31181996638` was red because Firefox lost its\nWebDriver session during the pre-existing large-migration chain; the downstream secret scanner\ncorrectly refused to pass when the required Firefox job was red. Chromium's new sensitive migration\ngate itself was already green, so no sentinel leak was observed.\n\nThe stale one-shot `mig-01-7b-materialize-temp.yml` was removed first, producing clean checkpoint\n`96ff2cc108c94850dae035be383d4f951ef36dfd`. Firefox then reproduced the same teardown failure. A\nsecond old-Head rerun failed at a different Firefox lifecycle point, confirming runner/browser\nlifecycle instability rather than deterministic sentinel leakage. The large-migration fixture was\ntherefore changed only at teardown: an already-ended WebDriver session is accepted as idempotent\ncleanup, while all other quit errors continue to fail. The initial inline implementation exposed an\nESLint `no-unsafe-finally` error on clean Head `b3a783446d7560716e8b523e552c5eb7a5c07cc6`; the same\nsemantics were moved into a helper outside `finally`, yielding code/evidence Head\n`{evidence_head}`. No product UI behavior changed.\n\nExact-head evidence on `{evidence_head}`:\n\n- CI `31185198202`: SUCCESS;\n- Browser E2E `31185199106`: SUCCESS; Chromium `92887883714`, Firefox `92887883688`, and downstream\n  `migration-secret-leak-gate` `92888843896` all SUCCESS;\n- downstream scanner: 15 diagnostics files + 2 browser job logs scanned with no controlled sentinel\n  found;\n- Chromium diagnostics artifact `8996480031`, SHA-256\n  `6c06fa9399ac1fb0cef55bdf2693290eb790ee45f2f749db7d1cd1f1155dc8d5`;\n- Firefox diagnostics artifact `8996523043`, SHA-256\n  `fbbc00652e10d9879652fabe8f0193b0e77d3bdec85899239645b0b76ca04fd9`;\n- Parity Documentation `31185196419`, Milestone 8 Visual `31185196254`, Original Nex UI\n  `31185200569`, and Original Toolbar `31185201981`: all SUCCESS.\n\n`MIG-01.7B` and the repository-controlled scope of parent `MIG-01.7` are closed. WIP remains the\nsingle parent `MIG-01`. Per the batch contract, `MIG-01.8` is the next sequence position, but final\nbatch closure cannot satisfy the four-corpus acceptance set while Corpus B is absent. Corpus B\nremains an external owner-data blocker; it must be a sanitized representative original export and\nmust not be synthesized from repository guesses. Owner micro-slice retest remains prohibited.\nProduct completion remains exactly `45.15%` (reported `45%`), PR #11 remains Draft, and release\nremains `NO-GO`.\n'''
          if '## Session 17 actual continuation — MIG-01.7B closure and handoff (2026-08-07)' in kg_text:
              raise SystemExit('closure appendix already present')
          kg.write_text(kg_text.rstrip() + appendix + '\n')
          PY
          git diff --check
          node scripts/validate-parity-docs.mjs
      - name: Commit closure synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/MIG_01_SEMANTIC_ROUNDTRIP_SECURITY_MATRIX.md docs/PROJECT_STATE.json docs/SESSION_17_KNOWLEDGE_GRAPH.md
          git diff --cached --quiet && { echo 'closure sync produced no diff'; exit 1; }
          git commit -m 'docs: close repository-controlled MIG-01.7 [skip ci]'
          git push origin HEAD:feat/m8-profile-workflow
