name: Export Original UI Contract Sources

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-original-ui-contract-sources.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: original-ui-contract-source-slice
          path: |
            apps/extension/src/entrypoints/options/App.svelte
            packages/profile-workflow/src/commands.ts
            packages/profile-workflow/src/commands.test.ts
            scripts/validate-parity-docs.mjs
            scripts/e2e-chromium.mjs
            scripts/e2e-firefox.mjs
            scripts/capture-visual-evidence.mjs
            apps/extension/src/component-rendering.component.spec.ts
          if-no-files-found: error
