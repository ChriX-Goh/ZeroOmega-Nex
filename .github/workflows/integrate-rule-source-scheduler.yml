# revision 5
name: Integrate automatic Rule Source scheduler

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-rule-source-scheduler.yml

permissions:
  contents: write

concurrency:
  group: integrate-rule-source-scheduler-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply reviewed scheduler slice
        id: apply_slice
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python .github/patches/apply-rule-source-scheduler.py
            python .github/patches/fix-scheduler-coalescing-test.py
            python .github/patches/fix-scheduler-manifest-inspection.py
            python .github/patches/add-scheduler-e2e-diagnostics.py
            pnpm exec prettier --write \
              packages/profile-workflow/src/rule-source-update.ts \
              packages/profile-workflow/src/rule-source-schedule.test.ts \
              packages/profile-workflow/src/index.ts \
              apps/extension/wxt.config.ts \
              apps/extension/src/lib/profile-workflow-runtime.ts \
              apps/extension/src/lib/rule-source-scheduler.ts \
              apps/extension/src/lib/rule-source-scheduler.test.ts \
              scripts/e2e-chromium.mjs \
              scripts/inspect-manifests.mjs \
              scripts/validate-ui-compatibility.mjs \
              docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
              docs/UI_AUDIT_MATRIX.md \
              docs/MILESTONE_8_STATUS.md
            git diff --check
          } 2>&1 | tee /tmp/rule-source-scheduler-apply.log
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-source-scheduler-apply
          path: /tmp/rule-source-scheduler-apply.log
          if-no-files-found: warn
      - name: Enforce patch result
        if: steps.apply_slice.outcome != 'success'
        run: exit 1
      - name: Verify complete repository
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee /tmp/rule-source-scheduler-verify.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-source-scheduler-verification
          path: /tmp/rule-source-scheduler-verify.log
          if-no-files-found: warn
      - name: Enforce verification result
        if: steps.verify.outcome != 'success'
        run: exit 1
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Chromium scheduler E2E
        id: chromium
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium
          pnpm test:e2e:chromium 2>&1 | tee /tmp/rule-source-scheduler-chromium.log
      - name: Upload Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-source-scheduler-chromium
          path: /tmp/rule-source-scheduler-chromium.log
          if-no-files-found: warn
      - name: Enforce Chromium result
        if: steps.chromium.outcome != 'success'
        run: exit 1
      - name: Clean temporary integration files
        run: |
          rm -rf browser-builds browser-builds.tar.gz
          git clean -fdX
          rm -rf .github/patches
          rm -f .github/workflows/integrate-rule-source-scheduler.yml
          git diff --check
      - name: Commit verified product slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/m8-profile-workflow
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/m8-profile-workflow)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m 'feat: schedule due Rule Source updates'
          git push origin HEAD:feat/m8-profile-workflow
