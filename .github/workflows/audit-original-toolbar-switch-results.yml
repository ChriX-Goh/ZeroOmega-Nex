name: Audit original toolbar Switch results

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/audit-original-toolbar-switch-results.yml

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Download exact official Chromium package
        run: |
          curl -L --fail --retry 3 \
            https://github.com/zero-peak/ZeroOmega/releases/download/v3.5.0/chromium-release.zip \
            -o chromium-release.zip
          echo '4fc320af32461a7efc7d6b7a700100522af29afa6bd1270aef193f9121b160ce  chromium-release.zip' | sha256sum -c -
          mkdir -p original-release/chromium
          unzip -q chromium-release.zip -d original-release/chromium
          test -f original-release/chromium/manifest.json
      - name: Run exact original Switch result probe
        run: |
          ZEROOMEGA_ORIGINAL_CHROMIUM_PATH=original-release/chromium \
          ZEROOMEGA_ORIGINAL_RUNTIME_OUTPUT=original-runtime/switch-results \
            node scripts/audit-original-toolbar-switch-results.mjs | tee original-switch-results.log
      - name: Upload exact original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-toolbar-switch-results-v3.5.0
          path: |
            original-runtime/switch-results/runtime.json
            original-switch-results.log
          if-no-files-found: warn
