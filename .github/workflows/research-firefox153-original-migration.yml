name: Research Firefox 153 original migration

on:
  push:
    branches:
      - 'feat/m8-profile-workflow'
    paths:
      - '.github/workflows/research-firefox153-original-migration.yml'

permissions:
  contents: write

jobs:
  firefox153-original-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Replace locale-coupled selectors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/e2e-firefox-original-migration.mjs')
          s = p.read_text()
          old_nav = 'By.xpath("//button[normalize-space(.)=\'匯入 / 匯出\']")'
          if s.count(old_nav) != 3: raise SystemExit(f'nav count {s.count(old_nav)}')
          s = s.replace(old_nav, 'By.xpath("//button[.//*[@data-options-nav-icon=\'import\']]")')
          old_heading = 'until.elementLocated(By.xpath("//h2[normalize-space(.)=\'相容性檢查\']"))'
          if s.count(old_heading) != 1: raise SystemExit('review selector mismatch')
          s = s.replace(old_heading, "until.elementLocated(By.css('[data-legacy-import-review]'))")
          old_apply = 'until.elementLocated(By.xpath("//button[normalize-space(.)=\'匯入並立即使用\']"))'
          if s.count(old_apply) != 1: raise SystemExit('apply selector mismatch')
          s = s.replace(old_apply, "until.elementLocated(By.css('[data-legacy-import-and-use]'))")
          old_success = 'until.elementLocated(By.xpath("//*[normalize-space(.)=\'匯入完成，原版設定現已啟用。\']"))'
          if s.count(old_success) != 1: raise SystemExit('success selector mismatch')
          s = s.replace(old_success, "until.elementLocated(By.xpath(\"//*[@data-legacy-import-review]/following-sibling::section[1]//p[@role='status']\"))")
          p.write_text(s)
          PY
          pnpm exec prettier --write scripts/e2e-firefox-original-migration.mjs
          git diff --check
      - name: Install official Firefox 153.0.3 zh-TW
        shell: bash
        run: |
          set -euo pipefail
          R=153.0.3; L=zh-TW; A="firefox-$R.tar.xz"; B="https://archive.mozilla.org/pub/firefox/releases/$R"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$A" "$B/linux-x86_64/$L/$A"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/SHA512SUMS" "$B/SHA512SUMS"
          E="$(grep "linux-x86_64/$L/$A" "$RUNNER_TEMP/SHA512SUMS" | awk '{print $1}')"
          printf '%s  %s\n' "$E" "$RUNNER_TEMP/$A" | sha512sum --check --strict
          mkdir -p "$RUNNER_TEMP/ff"; tar -xJf "$RUNNER_TEMP/$A" -C "$RUNNER_TEMP/ff"
          sudo ln -sfn "$RUNNER_TEMP/ff/firefox/firefox" /usr/bin/firefox
          firefox --version
      - run: pnpm build:firefox
      - name: Verify Firefox 153 original migration
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e:firefox-original-migration 2>&1 | tee firefox153-original-migration.log
          grep -F '"geckodriverSystemAccess":true' firefox153-original-migration.log
          grep -F 'Firefox original Corpus A import, route, restart, and semantic export passed.' firefox153-original-migration.log
          grep -F 'Firefox original Corpus C/D import, route, restart, and semantic export passed.' firefox153-original-migration.log
      - name: Commit verified selector hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/e2e-firefox-original-migration.mjs
          git commit -m 'test: make Firefox migration selectors locale independent'
          git push origin HEAD:feat/m8-profile-workflow
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox153-original-migration-evidence
          path: firefox153-original-migration.log
          if-no-files-found: warn
