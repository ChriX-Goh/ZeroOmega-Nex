name: Format Chromium toolbar Action E2E

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/format-chromium-toolbar-action-e2e.yml
      - scripts/e2e-chromium-toolbar.mjs

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Format and verify
        run: |
          pnpm exec prettier --write scripts/e2e-chromium-toolbar.mjs
          pnpm verify
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/e2e-chromium-toolbar.mjs
          git commit -m 'style: format Chromium toolbar Action E2E'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
