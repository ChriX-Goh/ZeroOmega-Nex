name: CI

on:
  push:
    branches:
      - main
      - 'docs/**'
      - 'feat/**'
      - 'research/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        shell: bash
        run: |
          if ! pnpm install --frozen-lockfile >pnpm-install.log 2>&1; then
            tail -n 80 pnpm-install.log
            exit 1
          fi
          tail -n 20 pnpm-install.log

      - name: Preserve dependency failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-log
          path: pnpm-install.log
          if-no-files-found: error

      - name: Verify, test, build, inspect, and package both browser targets
        shell: bash
        run: |
          if ! pnpm run verify >pnpm-verify.log 2>&1; then
            tail -n 160 pnpm-verify.log
            exit 1
          fi
          tail -n 60 pnpm-verify.log

      - name: Preserve verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-verify-log
          path: pnpm-verify.log
          if-no-files-found: error

      - name: Upload browser build archive
        uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          path: browser-builds.tar.gz
          if-no-files-found: error

  migrate-original-entry:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/m8-profile-workflow' &&
      github.repository == 'ChriX-Goh/ZeroOmega-Nex'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Apply original-derived entry corrections
        run: python scripts/apply-original-entry-contract-fixes.py

      - name: Format and verify the complete repository
        run: |
          pnpm exec prettier --write \
            scripts/validate-ui-compatibility.mjs \
            apps/extension/src/lib/ui-messages.ts \
            scripts/e2e-firefox.mjs \
            scripts/e2e-chromium.mjs
          pnpm verify

      - name: Remove temporary migration surface
        run: |
          git checkout HEAD^ -- .github/workflows/ci.yml
          rm -f scripts/apply-original-entry-contract-fixes.py
          rm -f .github/workflows/finalize-original-entry-contract.yml
          rm -f .github/workflows/fix-original-ui-validator.yml
          rm -f .github/workflows/export-ui-validator.yml

      - name: Commit verified original-entry correction
        run: |
          git config user.name 'ZeroOmega Nex automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close first original entry contract slice'
          git push origin HEAD:feat/m8-profile-workflow
