name: CI

on:
  push:
    branches:
      - main
      - 'docs/**'
      - 'feat/**'
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install dependencies
        shell: bash
        run: |
          if ! pnpm install --no-frozen-lockfile >pnpm-install.log 2>&1; then
            tail -n 80 pnpm-install.log
            exit 1
          fi
          tail -n 20 pnpm-install.log

      - name: Commit generated lockfile once
        if: github.event_name == 'push' && github.ref_name == 'feat/m1-tooling-shell'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- pnpm-lock.yaml)" ]]; then
            echo "Lockfile already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: lock workspace dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Preserve dependency failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-log
          path: pnpm-install.log
          if-no-files-found: error

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Verify, test, build, and inspect both browser targets
        shell: bash
        run: |
          if ! pnpm ci >pnpm-ci.log 2>&1; then
            tail -n 120 pnpm-ci.log
            exit 1
          fi
          tail -n 40 pnpm-ci.log

      - name: Preserve verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-ci-log
          path: pnpm-ci.log
          if-no-files-found: error

      - name: Upload browser build outputs
        uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          path: apps/extension/.output
          include-hidden-files: true
          if-no-files-found: error
