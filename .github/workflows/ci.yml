name: CI

on:
  push:
    branches:
      - 'research/**'

permissions:
  contents: write

jobs:
  prettier-capture:
    if: github.event.head_commit.message != 'research: capture formatted Firefox migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Commit exact Prettier output
        shell: bash
        run: |
          pnpm exec prettier --write scripts/e2e-firefox-original-migration.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/e2e-firefox-original-migration.mjs
          git commit -m 'research: capture formatted Firefox migration'
          git push
