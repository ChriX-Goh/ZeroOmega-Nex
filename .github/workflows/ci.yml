name: CI

on:
  push:
    branches:
      - main
      - 'docs/**'
      - 'feat/**'
      - 'research/**'
  pull_request:

permissions:
  contents: read

jobs:
  apply-original-ui-contract:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/m8-profile-workflow'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Apply original-derived contract corrections
        run: |
          python scripts/apply-original-ui-contract-fixes.py
          python <<'PY'
          from pathlib import Path
          path = Path('apps/extension/src/entrypoints/options/App.svelte')
          source = path.read_text()
          old = '      deviceId: state.applied.revision.deviceId,\n'
          new = '''      ...(state.applied.revision.deviceId === undefined
        ? {}
        : { deviceId: state.applied.revision.deviceId }),
'''
          assert source.count(old) == 1, source.count(old)
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Format and validate correction
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/App.svelte \
            packages/profile-workflow/src/commands.ts \
            scripts/validate-parity-docs.mjs \
            apps/extension/src/component-rendering.component.spec.ts \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            scripts/capture-visual-evidence.mjs
          pnpm guard:architecture
          pnpm validate:parity-docs
          pnpm check
          pnpm test
          pnpm test:components
          pnpm lint
          git diff --check

      - name: Remove one-time migration resources
        run: |
          git checkout HEAD^ -- .github/workflows/ci.yml
          rm -f .github/workflows/apply-original-ui-contract-fixes.yml
          rm -f .github/workflows/export-original-ui-contract-sources.yml
          rm -f scripts/apply-original-ui-contract-fixes.py

      - name: Commit exact correction
        run: |
          git config user.name 'ZeroOmega Nex automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce original UI contract boundaries'
          git push origin HEAD:feat/m8-profile-workflow

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        shell: bash
        run: |
          if ! pnpm install --frozen-lockfile >pnpm-install.log 2>&1; then
            tail -n 80 pnpm-install.log
            exit 1
          fi
          tail -n 20 pnpm-install.log

      - name: Preserve dependency failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-log
          path: pnpm-install.log
          if-no-files-found: error

      - name: Verify, test, build, inspect, and package both browser targets
        shell: bash
        run: |
          if ! pnpm run verify >pnpm-verify.log 2>&1; then
            tail -n 160 pnpm-verify.log
            exit 1
          fi
          tail -n 60 pnpm-verify.log

      - name: Preserve verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-verify-log
          path: pnpm-verify.log
          if-no-files-found: error

      - name: Upload browser build archive
        uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          path: browser-builds.tar.gz
          if-no-files-found: error
