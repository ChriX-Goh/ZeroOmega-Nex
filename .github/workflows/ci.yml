name: CI

on:
  push:
    branches:
      - main
      - 'docs/**'
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install dependencies
        shell: bash
        run: |
          if ! pnpm install --no-frozen-lockfile >pnpm-install.log 2>&1; then
            tail -n 80 pnpm-install.log
            exit 1
          fi
          tail -n 20 pnpm-install.log

      - name: Preserve dependency failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-log
          path: pnpm-install.log
          if-no-files-found: error

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Verify, test, build, and inspect both browser targets
        shell: bash
        run: |
          if ! pnpm ci >pnpm-ci.log 2>&1; then
            tail -n 120 pnpm-ci.log
            exit 1
          fi
          tail -n 40 pnpm-ci.log

      - name: Preserve verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-ci-log
          path: pnpm-ci.log
          if-no-files-found: error

      - name: Upload browser build outputs
        uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          path: apps/extension/.output
          if-no-files-found: error
