name: CI

on:
  push:
    branches:
      - main
      - 'docs/**'
      - 'feat/**'
      - 'research/**'
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Correct ProfileSpec import compatibility once
        if: github.event_name == 'push' && github.ref_name == 'feat/m4-zeroomega-importer'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          types = Path('packages/profile-spec/src/types.ts')
          text = types.read_text()
          text = text.replace(
              """export interface PacProfile extends ProfileBase {
            kind: 'pac';
            source: PacSource;
            fallbackRoute?: ProfileRouteTarget;
          }""",
              """export interface PacProfile extends ProfileBase {
            kind: 'pac';
            source: PacSource;
            headers?: RuleSourceHeader[];
            fallbackRoute?: ProfileRouteTarget;
          }""",
          )
          text = text.replace(
              """export interface QuickSwitchSettings {
            enabled: boolean;
            profileIds: Identifier[];
            refreshOnChange: boolean;
          }""",
              """export interface QuickSwitchSettings {
            enabled: boolean;
            routes: ProfileRouteTarget[];
            refreshOnChange: boolean;
          }""",
          )
          types.write_text(text)

          schema_path = Path('packages/profile-spec/schema/profile-spec-v1.schema.json')
          schema = json.loads(schema_path.read_text())
          defs = schema['$defs']
          header_item = defs['ruleSource']['properties']['headers']['items']
          defs['ruleSourceHeader'] = header_item
          defs['ruleSource']['properties']['headers']['items'] = {'$ref': '#/$defs/ruleSourceHeader'}
          pac = next(
              item for item in defs['profile']['oneOf']
              if item['properties']['kind'].get('const') == 'pac'
          )
          pac['properties']['headers'] = {
              'type': 'array',
              'items': {'$ref': '#/$defs/ruleSourceHeader'},
          }
          quick = defs['settings']['properties']['quickSwitch']
          quick['required'] = [
              'routes' if item == 'profileIds' else item for item in quick['required']
          ]
          quick['properties'].pop('profileIds', None)
          quick['properties']['routes'] = {
              'type': 'array',
              'items': {'$ref': '#/$defs/routeTarget'},
          }
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, indent=2) + '\n')

          validation = Path('packages/profile-spec/src/validation.ts')
          text = validation.read_text()
          text = text.replace(
              """  ProfileRouteTarget,
            ProfileSpec,
            UserProfile,""",
              """  ProfileRouteTarget,
            ProfileSpec,
            RuleSourceHeader,
            UserProfile,""",
          )
          marker = "function validateSync(spec: ProfileSpec, issues: ValidationIssue[]): void {"
          helper = """function validateHeaders(
            headers: readonly RuleSourceHeader[] | undefined,
            path: string,
            issues: ValidationIssue[],
          ): void {
            const headerNames = new Set<string>();
            headers?.forEach((header, headerIndex) => {
              const normalizedName = header.name.trim().toLowerCase();
              if (headerNames.has(normalizedName)) {
                issues.push(
                  issue(
                    'source.duplicate-header',
                    `${path}/${headerIndex}/name`,
                    `header "${header.name}" is duplicated`,
                  ),
                );
              }
              headerNames.add(normalizedName);

              if (header.value.kind === 'literal' && SENSITIVE_HEADER_NAME.test(normalizedName)) {
                issues.push(
                  issue(
                    'source.sensitive-literal-header',
                    `${path}/${headerIndex}/value`,
                    `header "${header.name}" must use a secret reference`,
                  ),
                );
              }
            });
          }

          """
          if helper.strip() not in text:
              text = text.replace(marker, helper + marker)

          old_pac = """    if (profile.kind === 'pac' && profile.source.kind === 'url') {
              validateUrl(
                profile.source.url,
                `/profiles/${profileIndex}/source/url`,
                ['http:', 'https:', 'file:'],
                issues,
              );
              if (profile.source.url.startsWith('file:')) {
                issues.push(
                  issue(
                    'profile.target-dependent-file-pac',
                    `/profiles/${profileIndex}/source/url`,
                    'file PAC support depends on browser permissions and target capabilities',
                    'warning',
                  ),
                );
              }
            }"""
          new_pac = """    if (profile.kind === 'pac') {
              validateHeaders(profile.headers, `/profiles/${profileIndex}/headers`, issues);
              if (profile.source.kind === 'url') {
                validateUrl(
                  profile.source.url,
                  `/profiles/${profileIndex}/source/url`,
                  ['http:', 'https:', 'file:'],
                  issues,
                );
                if (profile.source.url.startsWith('file:')) {
                  issues.push(
                    issue(
                      'profile.target-dependent-file-pac',
                      `/profiles/${profileIndex}/source/url`,
                      'file PAC support depends on browser permissions and target capabilities',
                      'warning',
                    ),
                  );
                }
              }
            }"""
          if old_pac not in text:
              raise SystemExit('PAC validation block not found')
          text = text.replace(old_pac, new_pac)

          old_headers = """    const headerNames = new Set<string>();
            source.headers?.forEach((header, headerIndex) => {
              const normalizedName = header.name.trim().toLowerCase();
              if (headerNames.has(normalizedName)) {
                issues.push(
                  issue(
                    'source.duplicate-header',
                    `/ruleSources/${sourceIndex}/headers/${headerIndex}/name`,
                    `header "${header.name}" is duplicated`,
                  ),
                );
              }
              headerNames.add(normalizedName);

              if (header.value.kind === 'literal' && SENSITIVE_HEADER_NAME.test(normalizedName)) {
                issues.push(
                  issue(
                    'source.sensitive-literal-header',
                    `/ruleSources/${sourceIndex}/headers/${headerIndex}/value`,
                    `header "${header.name}" must use a secret reference`,
                  ),
                );
              }
            });"""
          if old_headers not in text:
              raise SystemExit('rule source header block not found')
          text = text.replace(
              old_headers,
              "    validateHeaders(source.headers, `/ruleSources/${sourceIndex}/headers`, issues);",
          )
          old_quick = """  for (const profileId of spec.settings.quickSwitch.profileIds) {
            if (!profileIds.has(profileId)) {
              issues.push(
                issue(
                  'profile.missing-quick-switch-reference',
                  '/settings/quickSwitch/profileIds',
                  `quick-switch profile "${profileId}" does not exist`,
                ),
              );
            }
          }"""
          new_quick = """  spec.settings.quickSwitch.routes.forEach((route, routeIndex) => {
            const profileId = routeProfileId(route);
            if (profileId && !profileIds.has(profileId)) {
              issues.push(
                issue(
                  'profile.missing-quick-switch-reference',
                  `/settings/quickSwitch/routes/${routeIndex}`,
                  `quick-switch profile "${profileId}" does not exist`,
                ),
              );
            }
          });"""
          if old_quick not in text:
              raise SystemExit('quick switch validation block not found')
          validation.write_text(text.replace(old_quick, new_quick))

          index_test = Path('packages/profile-spec/src/index.test.ts')
          text = index_test.read_text()
          text = text.replace(
              """        fallbackRoute: { kind: 'direct' },
              },""",
              """        headers: [
                  {
                    name: 'Authorization',
                    value: { kind: 'secret', secretRef: 'secret-pac-authorization' },
                  },
                ],
                fallbackRoute: { kind: 'direct' },
              },""",
              1,
          )
          text = text.replace(
              "profileIds: ['profile-switch', 'profile-fixed'],",
              """routes: [
                  { kind: 'profile', profileId: 'profile-switch' },
                  { kind: 'profile', profileId: 'profile-fixed' },
                  { kind: 'direct' },
                  { kind: 'system' },
                ],""",
          )
          insertion = """

            it('requires sensitive PAC request headers to use secret references', () => {
              const value = validSpec();
              const pac = value.profiles[3]!;
              if (pac.kind !== 'pac') throw new Error('fixture mismatch');
              pac.headers = [
                {
                  name: 'Authorization',
                  value: { kind: 'literal', value: 'Bearer plaintext' },
                },
              ];
              expect(issueCodes(value)).toContain('source.sensitive-literal-header');
            });"""
          anchor = "  it('rejects remote sync without HTTPS and a secret reference', () => {"
          if insertion.strip() not in text:
              text = text.replace(anchor, insertion + '\n\n' + anchor)
          index_test.write_text(text)

          serial_test = Path('packages/profile-spec/src/serialization.test.ts')
          text = serial_test.read_text().replace(
              "profileIds: ['profile-a', 'profile-b'],",
              """routes: [
                  { kind: 'profile', profileId: 'profile-a' },
                  { kind: 'direct' },
                  { kind: 'system' },
                  { kind: 'profile', profileId: 'profile-b' },
                ],""",
          )
          serial_test.write_text(text)
          PY
          pnpm exec prettier --write \
            packages/profile-spec/src/types.ts \
            packages/profile-spec/schema/profile-spec-v1.schema.json \
            packages/profile-spec/src/validation.ts \
            packages/profile-spec/src/index.test.ts \
            packages/profile-spec/src/serialization.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profile-spec
          git commit -m "fix(profile-spec): preserve built-in quick routes and PAC headers"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Install locked dependencies
        shell: bash
        run: |
          if ! pnpm install --frozen-lockfile >pnpm-install.log 2>&1; then
            tail -n 80 pnpm-install.log
            exit 1
          fi
          tail -n 20 pnpm-install.log

      - name: Preserve dependency failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-log
          path: pnpm-install.log
          if-no-files-found: error

      - name: Verify, test, build, inspect, and package both browser targets
        shell: bash
        run: |
          if ! pnpm run verify >pnpm-verify.log 2>&1; then
            tail -n 160 pnpm-verify.log
            exit 1
          fi
          tail -n 60 pnpm-verify.log

      - name: Preserve verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-verify-log
          path: pnpm-verify.log
          if-no-files-found: error

      - name: Upload browser build archive
        uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          path: browser-builds.tar.gz
          if-no-files-found: error
