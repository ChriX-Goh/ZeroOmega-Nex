name: CI

on:
  push:
    branches:
      - main
      - 'docs/**'
      - 'feat/**'
      - 'research/**'
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        shell: bash
        run: |
          if ! pnpm install --frozen-lockfile >pnpm-install.log 2>&1; then
            tail -n 80 pnpm-install.log
            exit 1
          fi
          tail -n 20 pnpm-install.log

      - name: Use semantic timestamp validation once
        if: github.event_name == 'push' && github.ref_name == 'feat/m3-profile-spec'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/profile-spec/src/validation.ts')
          text = path.read_text()
          old = """  allowUnionTypes: true,
            strict: true,
          });"""
          new = """  allowUnionTypes: true,
            strict: true,
            validateFormats: false,
          });"""
          if old not in text:
              raise SystemExit('expected Ajv options block not found')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write packages/profile-spec/src/validation.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profile-spec/src/validation.ts
          git commit -m "fix(profile-spec): validate timestamps semantically"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Preserve dependency failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-log
          path: pnpm-install.log
          if-no-files-found: error

      - name: Verify, test, build, inspect, and package both browser targets
        shell: bash
        run: |
          if ! pnpm run verify >pnpm-verify.log 2>&1; then
            tail -n 160 pnpm-verify.log
            exit 1
          fi
          tail -n 60 pnpm-verify.log

      - name: Preserve verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-verify-log
          path: pnpm-verify.log
          if-no-files-found: error

      - name: Upload browser build archive
        uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          path: browser-builds.tar.gz
          if-no-files-found: error
