name: CI

on:
  push:
    branches:
      - 'research/**'

permissions:
  contents: read

jobs:
  prettier-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        shell: bash
        run: |
          pnpm exec prettier --write scripts/e2e-firefox-original-migration.mjs
          git diff -- scripts/e2e-firefox-original-migration.mjs
          exit 1
