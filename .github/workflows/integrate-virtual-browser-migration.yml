# integration revision 2
name: Integrate Virtual browser migration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-virtual-browser-migration.yml

permissions:
  contents: write

concurrency:
  group: integrate-virtual-browser-migration-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Virtual browser migration slice
        env:
          VIRTUAL_BROWSER_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/fix-virtual-patch-section-anchor.py
            python .github/patches/apply-virtual-browser-migration.py
          } 2>&1 | tee virtual-browser-apply.log
      - name: Format product slice
        run: pnpm format
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee virtual-browser-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium regression suite
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee virtual-browser-e2e.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-browser-integration-${{ github.run_id }}
          path: virtual-browser-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-virtual-browser-migration.yml
          rm -f \
            .github/patches/fix-virtual-patch-section-anchor.py \
            .github/patches/apply-virtual-browser-migration.py \
            virtual-browser-apply.log \
            virtual-browser-verify.log \
            virtual-browser-e2e.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: verify Virtual creation and reference migration"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
