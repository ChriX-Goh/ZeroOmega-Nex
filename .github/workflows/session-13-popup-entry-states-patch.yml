name: Session 13 Popup Entry States Patch

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/session-13-popup-entry-states-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout active product branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Popup entry-state patch
        run: |
          sed -i 's/encoding="utf-8")nsession =/encoding="utf-8")\nsession =/' scripts/session-13-popup-entry-states-patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/session-13-popup-entry-states-patch.py')
          source = path.read_text(encoding='utf-8')

          old_footer = 'footer_pattern = re.compile(r"\\n  <footer class=\\"popup-footer\\">.*?\\n  </footer>(?=\\n</main>)", re.DOTALL)'
          new_footer = 'footer_pattern = re.compile(r"\\n  <footer class=\\"popup-footer\\">.*?\\n  </footer>", re.DOTALL)'
          if old_footer not in source:
              raise SystemExit('footer regex patch marker mismatch')
          source = source.replace(old_footer, new_footer, 1)

          old_step = '''step_marker = "      - name: Run Chromium external-control Toolbar E2E\\n        run: pnpm test:e2e:chromium-external-control-toolbar\\n"'''
          new_step = '''step_marker = "      - name: Run Chromium external-control Toolbar E2E\\n        shell: bash\\n        run: |\\n          set -o pipefail\\n          pnpm test:e2e:chromium-external-control-toolbar 2>&1 | tee chromium-external-control-toolbar-e2e.log\\n"'''
          if old_step not in source:
              raise SystemExit('Browser E2E script marker patch mismatch')
          source = source.replace(old_step, new_step, 1)

          path.write_text(source, encoding='utf-8')
          PY
          python scripts/session-13-popup-entry-states-patch.py
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/popup/App.svelte \
            apps/extension/src/entrypoints/popup/session-13-compat.css \
            scripts/validate-popup-entry-contract.mjs \
            scripts/e2e-chromium-popup-external-profile.mjs \
            scripts/e2e-chromium-external-control-toolbar.mjs \
            .github/workflows/browser-e2e.yml \
            docs/AUDIT_EVIDENCE_02R_POPUP_OWNERSHIP_EXTERNAL.md \
            docs/SESSION_13_KNOWLEDGE_GRAPH.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md \
            package.json
          git diff --check
          pnpm validate:ui
          pnpm validate:parity-docs
          pnpm check

      - name: Commit Popup entry-state slice
        run: |
          rm .github/workflows/session-13-popup-entry-states-patch.yml
          rm scripts/session-13-popup-entry-states-patch.py
          git config user.name 'zeroomega-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align Popup ownership and external profile states'
          git push origin HEAD:feat/m8-profile-workflow
