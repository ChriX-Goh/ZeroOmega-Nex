name: Fix PAC header type

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/m4-zeroomega-importer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m4-zeroomega-importer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add PAC header field and commit
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/profile-spec/src/types.ts')
          text = path.read_text()
          old = "  source: PacSource;\n  fallbackRoute?: ProfileRouteTarget;"
          new = "  source: PacSource;\n  headers?: RuleSourceHeader[];\n  fallbackRoute?: ProfileRouteTarget;"
          if old not in text:
              raise SystemExit('PacProfile source block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/profile-spec/src/types.ts
          pnpm --filter @zeroomega-nex/profile-spec check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profile-spec/src/types.ts
          git commit -m "fix(profile-spec): expose PAC request headers"
          git push origin HEAD:feat/m4-zeroomega-importer
