name: Apply System startup E2E

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-system-startup-e2e.yml
      - scripts/apply-system-startup-e2e.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply and verify
        run: |
          python scripts/apply-system-startup-e2e.py
          pnpm exec prettier --write scripts/e2e-chromium.mjs
          pnpm verify
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/e2e-chromium.mjs
          git commit -m 'test: expect original System startup in Chromium'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
