# integration revision 3
name: Integrate raw PAC activation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-raw-pac-activation.yml

permissions:
  contents: write

concurrency:
  group: integrate-raw-pac-activation-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply raw PAC activation slice
        env:
          RAW_PAC_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/apply-raw-pac-snapshot.py
            python .github/patches/apply-pac-auth-model.py
            python .github/patches/apply-pac-auth-runtime.py
            python .github/patches/apply-raw-pac-activation.py
            python .github/patches/apply-raw-pac-ui-e2e-docs.py
            pnpm --filter @zeroomega-nex/profile-spec generate:validator
          } 2>&1 | tee raw-pac-apply.log
      - name: Format product slice
        run: pnpm format
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee raw-pac-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E host candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium regression suite
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee raw-pac-e2e.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-pac-integration-${{ github.run_id }}
          path: raw-pac-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-raw-pac-activation.yml
          rm -f \
            .github/patches/apply-raw-pac-snapshot.py \
            .github/patches/apply-pac-auth-model.py \
            .github/patches/apply-pac-auth-runtime.py \
            .github/patches/apply-raw-pac-activation.py \
            .github/patches/apply-raw-pac-ui-e2e-docs.py \
            raw-pac-apply.log \
            raw-pac-verify.log \
            raw-pac-e2e.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: activate raw PAC profiles securely"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
