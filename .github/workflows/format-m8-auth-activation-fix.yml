name: Format Milestone 8 Authentication Activation Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format activation file
        run: pnpm exec prettier --write apps/extension/src/lib/profile-workflow-activation.ts

      - name: Verify activation file
        run: |
          pnpm exec eslint apps/extension/src/lib/profile-workflow-activation.ts
          pnpm --filter @zeroomega-nex/extension check
          pnpm exec vitest run apps/extension/src/lib/profile-workflow-activation.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/extension/src/lib/profile-workflow-activation.ts
          git commit -m 'style: format authentication activation error handling'
          git push origin HEAD:feat/m8-profile-workflow
