name: Session 13 Footer E2E Correction

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/session-13-footer-e2e-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout active product branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply and verify correction
        run: |
          python scripts/session-13-footer-e2e-correction.py
          pnpm exec prettier --write apps/extension/src/entrypoints/popup/App.svelte scripts/validate-popup-entry-contract.mjs scripts/e2e-chromium.mjs docs/SESSION_13_KNOWLEDGE_GRAPH.md docs/AUDIT_EVIDENCE_02R_POPUP_OWNERSHIP_EXTERNAL.md docs/ORIGINAL_KNOWLEDGE_GRAPH.md docs/UI_AUDIT_MATRIX.md
          git diff --check
          pnpm validate:ui
          pnpm validate:parity-docs
          pnpm check
          pnpm exec vitest run --config apps/extension/vitest.component.config.ts

      - name: Commit correction without patch machinery
        run: |
          git restore .github/workflows/session-13-footer-e2e-correction.yml
          git restore scripts/session-13-footer-e2e-correction.py
          git config user.name 'zeroomega-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve Popup loading footer and blur-save E2E'
          git push origin HEAD:feat/m8-profile-workflow
