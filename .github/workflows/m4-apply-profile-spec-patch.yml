name: Apply M4 ProfileSpec patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/m4-zeroomega-importer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m4-zeroomega-importer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply embedded patch and commit
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/m4-profile-spec-compat.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index('\n          PY', start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<embedded-m4-profile-spec-patch>', 'exec'))
          PY
          pnpm exec prettier --write \
            packages/profile-spec/src/types.ts \
            packages/profile-spec/schema/profile-spec-v1.schema.json \
            packages/profile-spec/src/validation.ts \
            packages/profile-spec/src/index.test.ts \
            packages/profile-spec/src/serialization.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/profile-spec
          git commit -m "fix(profile-spec): preserve built-in quick routes and PAC headers"
          git push origin HEAD:feat/m4-zeroomega-importer
