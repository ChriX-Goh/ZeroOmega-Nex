name: Integrate typed Auto Detect and locale classification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-typed-auto-detect.yml
      - .github/patches/*typed-auto-detect*.py

permissions:
  contents: write

concurrency:
  group: integrate-typed-auto-detect-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply typed Auto Detect and locale classification slice
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/write-typed-auto-detect.py
            python .github/patches/patch-typed-auto-detect.py
            python .github/patches/patch-typed-auto-detect-tests-docs.py
          } 2>&1 | tee typed-auto-detect-apply.log
      - name: Format product slice
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee typed-auto-detect-format.log
      - name: Generate classified locale inventory
        run: |
          set -o pipefail
          pnpm locale:inventory 2>&1 | tee typed-auto-detect-inventory.log
          pnpm exec prettier --write docs/LOCALE_INVENTORY.json
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee typed-auto-detect-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium imported Auto Detect regression
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee typed-auto-detect-chromium.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-auto-detect-${{ github.run_id }}
          path: typed-auto-detect-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-typed-auto-detect.yml
          rm -f \
            .github/patches/write-typed-auto-detect.py \
            .github/patches/patch-typed-auto-detect.py \
            .github/patches/patch-typed-auto-detect-tests-docs.py \
            typed-auto-detect-apply.log \
            typed-auto-detect-format.log \
            typed-auto-detect-inventory.log \
            typed-auto-detect-verify.log \
            typed-auto-detect-chromium.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add typed imported Auto Detect"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
