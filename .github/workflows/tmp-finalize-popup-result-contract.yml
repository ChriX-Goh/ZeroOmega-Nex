name: Temporary Popup Result Finalizer

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/tmp-finalize-popup-result-contract.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and verify transaction
        shell: bash
        run: |
          set +e
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile >tmp-popup-finalizer.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python scripts/apply-original-ui-contract-fixes.py >>tmp-popup-finalizer.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python scripts/apply-original-default-test-fixtures.py >>tmp-popup-finalizer.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            pnpm run verify >>tmp-popup-finalizer.log 2>&1
            status=$?
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$status" -eq 0 ]; then
            rm -f \
              scripts/apply-original-ui-contract-fixes.py \
              scripts/apply-original-default-test-fixtures.py \
              .github/workflows/tmp-finalize-popup-result-contract.yml \
              docs/TMP_POPUP_RESULT_FINALIZER_FAILURE.log \
              tmp-popup-finalizer.log
            git add -A
            git commit -m "test: preserve result capability outside original popup"
            git push origin HEAD:feat/m8-profile-workflow
            exit 0
          fi

          {
            echo "Temporary Popup Result Finalizer failed."
            echo
            tail -n 240 tmp-popup-finalizer.log
          } > docs/TMP_POPUP_RESULT_FINALIZER_FAILURE.log
          rm -f tmp-popup-finalizer.log
          git add docs/TMP_POPUP_RESULT_FINALIZER_FAILURE.log
          git commit -m "chore: record popup result finalizer failure"
          git push origin HEAD:feat/m8-profile-workflow
          exit "$status"
