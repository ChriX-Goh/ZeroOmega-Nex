name: Capture original toolbar target constants

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/capture-original-toolbar-target-constants.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download and verify exact official Chromium package
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/zeroomega-chromium-v3.5.0.zip \
            https://github.com/zero-peak/ZeroOmega/releases/download/v3.5.0/chromium-release.zip
          echo '4fc320af32461a7efc7d6b7a700100522af29afa6bd1270aef193f9121b160ce  /tmp/zeroomega-chromium-v3.5.0.zip' \
            | sha256sum --check

      - name: Extract target constants and compiled locale entries
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          archive = Path('/tmp/zeroomega-chromium-v3.5.0.zip')
          locale_keys = [
              'manifest_icon_default_title',
              'browserAction_titleWithResult',
              'browserAction_titleExternalProxy',
              'browserAction_titleInspect',
              'browserAction_defaultRuleDetails',
              'browserAction_directResult',
              'browserAction_attachedPrefix',
              'browserAction_tempRulePrefix',
          ]
          locale_dirs = ['en', 'zh_CN', 'zh_TW']

          with zipfile.ZipFile(archive) as package:
              names = package.namelist()
              manifests = [name for name in names if name.rstrip('/').endswith('manifest.json')]
              if len(manifests) != 1:
                  raise SystemExit(f'Expected one manifest, found {manifests}')
              manifest_name = manifests[0]
              manifest = json.loads(package.read(manifest_name))

              locales = {}
              locale_paths = {}
              for locale in locale_dirs:
                  suffix = f'_locales/{locale}/messages.json'
                  matches = [name for name in names if name.endswith(suffix)]
                  if len(matches) != 1:
                      raise SystemExit(f'Expected one {suffix}, found {matches}')
                  locale_paths[locale] = matches[0]
                  messages = json.loads(package.read(matches[0]))
                  missing = [key for key in locale_keys if key not in messages]
                  if missing:
                      raise SystemExit(f'{locale} missing {missing}')
                  locales[locale] = {key: messages[key] for key in locale_keys}

          action = manifest.get('browser_action') or manifest.get('action')
          if not isinstance(action, dict):
              raise SystemExit('Manifest has no action contract')
          commands = manifest.get('commands', {})
          permissions = manifest.get('permissions', [])

          output = [
              '# Audit Evidence 01E — Original ZeroOmega v3.5.0 Toolbar Target Constants',
              '',
              '## Authority',
              '',
              '- Package: exact official `chromium-release.zip` from release `v3.5.0`.',
              '- Package SHA-256: `4fc320af32461a7efc7d6b7a700100522af29afa6bd1270aef193f9121b160ce`.',
              f'- Manifest entry: `{manifest_name}`.',
              '',
              '## Compiled manifest toolbar contract',
              '',
              '```json',
              json.dumps(
                  {
                      'action': action,
                      'commands': commands,
                      'permissions': permissions,
                  },
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              ),
              '```',
              '',
              '## Compiled locale entries',
              '',
          ]
          for locale in locale_dirs:
              output.extend([
                  f'### `{locale}`',
                  '',
                  f'- Package entry: `{locale_paths[locale]}`.',
                  '',
                  '```json',
                  json.dumps(locales[locale], ensure_ascii=False, indent=2, sort_keys=True),
                  '```',
                  '',
              ])
          output.extend([
              '## Acceptance boundary',
              '',
              'This evidence fixes the compiled Chrome-extension message schema, placeholder names/content, manifest Action paths, command shortcut and permission list. It does not by itself modify Nex or prove runtime parity.',
              '',
          ])

          path = Path('docs/AUDIT_EVIDENCE_01E_ORIGINAL_TARGET_CONSTANTS.md')
          path.write_text('\n'.join(output), encoding='utf-8')
          PY

      - name: Format and commit evidence
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write docs/AUDIT_EVIDENCE_01E_ORIGINAL_TARGET_CONSTANTS.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/AUDIT_EVIDENCE_01E_ORIGINAL_TARGET_CONSTANTS.md
          git commit -m 'docs: capture original toolbar target constants'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
