name: Session 13 Parity Keywords Patch

on:
  push:
    branches:
      - feat/m8-profile-workflow
    paths:
      - .github/workflows/session-13-parity-keywords-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout active product branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Preserve canonical validator evidence phrases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/UI_AUDIT_MATRIX.md')
          matrix = path.read_text(encoding='utf-8')

          def patch_row(row_id, old, new, required):
              global matrix
              pattern = rf'^\| {row_id} \|.*$'
              match = re.search(pattern, matrix, flags=re.MULTILINE)
              if not match:
                  raise SystemExit(f'UI_AUDIT_MATRIX {row_id} row missing')
              line = match.group(0)
              if old not in line:
                  raise SystemExit(f'UI_AUDIT_MATRIX {row_id} replacement marker missing')
              updated = line.replace(old, new, 1)
              for term in required:
                  if term not in updated:
                      raise SystemExit(f'UI_AUDIT_MATRIX {row_id} missing required term: {term}')
              matrix = matrix[:match.start()] + updated + matrix[match.end():]

          patch_row(
              'I-05',
              '02Q exact-head paired gate 已接入',
              '02Q exact-head Original↔Nex paired gate 已接入；Add-condition 独立表单边界已登记',
              ['Add-condition', 'Original↔Nex'],
          )
          patch_row(
              'I-06',
              '02Q exact-head paired gate 已接入',
              '02Q exact-head paired gate 已接入；展开菜单采用 result-only 且无常驻 select',
              ['展开菜单', '无常驻 select'],
          )
          patch_row(
              'I-11',
              'owner 视觉',
              'Owner 视觉',
              ['Owner'],
          )

          path.write_text(matrix, encoding='utf-8')
          PY

          pnpm exec prettier --write docs/UI_AUDIT_MATRIX.md
          rm .github/workflows/session-13-parity-keywords-patch.yml
          git diff --check
          node scripts/validate-parity-docs.mjs

      - name: Commit validator-compatible canonical evidence
        run: |
          git config user.name 'zeroomega-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/UI_AUDIT_MATRIX.md .github/workflows/session-13-parity-keywords-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m 'docs: preserve Popup parity evidence keywords'
          git push origin HEAD:feat/m8-profile-workflow
