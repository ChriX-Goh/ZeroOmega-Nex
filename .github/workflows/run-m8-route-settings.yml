name: Run Milestone 8 Route Settings Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply route settings patch
        shell: bash
        run: |
          set +e
          python .github/scripts/patch-m8-route-settings.py > m8-route-patch.log 2>&1
          status=$?
          cat m8-route-patch.log
          exit $status

      - name: Format route settings
        run: pnpm exec prettier --write apps/extension/src/entrypoints/options/App.svelte

      - name: Verify extension type surface
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @zeroomega-nex/extension check 2>&1 | tee m8-route-check.log

      - name: Upload route patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-route-patch-diagnostics
          path: |
            m8-route-patch.log
            m8-route-check.log
            apps/extension/src/entrypoints/options/App.svelte
          if-no-files-found: warn

      - name: Commit product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/extension/src/entrypoints/options/App.svelte
          git commit -m 'feat: add startup and quick-switch settings'
          git push origin HEAD:feat/m8-profile-workflow
