name: Run Milestone 8 Route Settings Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply route settings patch
        run: |
          python .github/scripts/patch-m8-route-settings.py
          pnpm exec prettier --write apps/extension/src/entrypoints/options/App.svelte
          pnpm --filter @zeroomega-nex/extension check

      - name: Commit product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/extension/src/entrypoints/options/App.svelte
          git commit -m 'feat: add startup and quick-switch settings'
          git push origin HEAD:feat/m8-profile-workflow
