# integration revision 6
name: Integrate profile exports

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-profile-exports.yml

permissions:
  contents: write

concurrency:
  group: integrate-profile-exports-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply profile export slice
        env:
          PROFILE_EXPORT_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/fix-profile-export-e2e-escape.py
            python .github/patches/apply-profile-exports.py
            python .github/patches/fix-generated-profile-export-guard.py
            python .github/patches/fix-generated-profile-export-auto-wait.py
          } 2>&1 | tee profile-export-apply.log
      - name: Format product slice
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee profile-export-format.log
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee profile-export-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium regression suite
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee profile-export-e2e.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-export-integration-${{ github.run_id }}
          path: profile-export-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-profile-exports.yml
          rm -f \
            .github/patches/fix-profile-export-e2e-escape.py \
            .github/patches/fix-generated-profile-export-guard.py \
            .github/patches/fix-generated-profile-export-auto-wait.py \
            .github/patches/apply-profile-exports.py \
            profile-export-apply.log \
            profile-export-format.log \
            profile-export-verify.log \
            profile-export-e2e.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: restore profile-level exports"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
