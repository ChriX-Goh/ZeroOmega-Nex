name: Export UI Validator

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-ui-validator.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: ui-validator-source
          path: scripts/validate-ui-compatibility.mjs
          if-no-files-found: error
