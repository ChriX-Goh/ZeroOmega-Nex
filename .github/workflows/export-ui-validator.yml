name: Finalize Original Entry Contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.repository == 'ChriX-Goh/ZeroOmega-Nex' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Apply original-derived entry corrections
        run: python scripts/apply-original-entry-contract-fixes.py

      - name: Format and syntax-check exact correction
        run: |
          pnpm exec prettier --write \
            scripts/validate-ui-compatibility.mjs \
            apps/extension/src/lib/ui-messages.ts \
            scripts/e2e-firefox.mjs \
            scripts/e2e-chromium.mjs
          node --check scripts/validate-ui-compatibility.mjs
          node --check scripts/e2e-firefox.mjs
          node --check scripts/e2e-chromium.mjs
          git diff --check

      - name: Restore permanent workflow surface
        run: |
          git checkout dce3c73542d9ac8395206ed9628ef4bbf48f3ef2 -- .github/workflows/ci.yml
          rm -f scripts/apply-original-entry-contract-fixes.py
          rm -f .github/workflows/finalize-original-entry-contract.yml
          rm -f .github/workflows/fix-original-ui-validator.yml
          rm -f .github/workflows/export-ui-validator.yml

      - name: Commit exact original-entry correction
        run: |
          git config user.name 'ZeroOmega Nex automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close first original entry contract slice'
          git push origin HEAD:feat/m8-profile-workflow
