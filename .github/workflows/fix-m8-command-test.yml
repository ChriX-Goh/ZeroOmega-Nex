name: Fix Milestone 8 Command Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch stale fixture assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/profile-workflow/src/commands.test.ts')
          text = path.read_text()
          start = text.index("  it('returns an apply failure with the recoverable dirty state'")
          end = text.index("  it('rejects Apply when the background activation service is unavailable'", start)
          segment = text[start:end]
          stale = "        draft: { profiles: [{ name: 'Failed Apply Edit' }] },\n"
          if segment.count(stale) != 1:
              raise SystemExit(f'expected one stale draft assertion, found {segment.count(stale)}')
          segment = segment.replace(stale, '', 1)
          closing = "    });\n  });\n\n"
          replacement = """    });
              if (failed.ok || !failed.state) throw new Error('expected recoverable failed state');
              expect(failed.state.draft.profiles[0]?.name).toBe('Failed Apply Edit');
              expect(failed.state.draft.profiles[1]?.name).toBe('Backup Proxy');
            });

          """
          if segment.count(closing) != 1:
              raise SystemExit(f'expected one test closing anchor, found {segment.count(closing)}')
          segment = segment.replace(closing, replacement, 1)
          path.write_text(text[:start] + segment + text[end:])
          PY
          pnpm exec prettier --write packages/profile-workflow/src/commands.test.ts

      - name: Verify corrected command tests
        run: |
          pnpm --filter @zeroomega-nex/profile-workflow check
          pnpm exec vitest run packages/profile-workflow/src/commands.test.ts

      - name: Commit corrected assertion
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/profile-workflow/src/commands.test.ts
          git commit -m 'test: preserve multi-profile draft on Apply failure'
          git push origin HEAD:feat/m8-profile-workflow
