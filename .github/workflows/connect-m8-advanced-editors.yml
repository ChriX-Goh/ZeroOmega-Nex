name: Connect Milestone 8 Advanced Editors

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  connect:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Connect advanced profile editors
        run: python .github/scripts/connect-m8-advanced-editors.py

      - name: Format advanced editor slice
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/AdvancedProfileEditor.svelte \
            apps/extension/src/entrypoints/options/App.svelte \
            packages/profile-workflow/src/advanced-profile-operations.test.ts \
            packages/profile-workflow/src/advanced-profile-operations.ts \
            packages/profile-workflow/src/index.ts \
            packages/profile-workflow/src/profile-operations.ts

      - name: Verify advanced editor slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @zeroomega-nex/profile-workflow check
            pnpm --filter @zeroomega-nex/extension check
            pnpm exec vitest run packages/profile-workflow/src/advanced-profile-operations.test.ts
          } 2>&1 | tee m8-advanced-editors.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-advanced-editors-diagnostics
          path: m8-advanced-editors.log
          if-no-files-found: warn

      - name: Commit advanced profile editors
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/entrypoints/options/AdvancedProfileEditor.svelte \
            apps/extension/src/entrypoints/options/App.svelte \
            packages/profile-workflow/src/advanced-profile-operations.test.ts \
            packages/profile-workflow/src/advanced-profile-operations.ts \
            packages/profile-workflow/src/index.ts \
            packages/profile-workflow/src/profile-operations.ts
          git commit -m 'feat: connect Rule List PAC and Auto Detect editors'
          git push origin HEAD:feat/m8-profile-workflow
