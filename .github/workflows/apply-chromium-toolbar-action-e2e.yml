name: Apply Chromium toolbar Action E2E

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-chromium-toolbar-action-e2e.yml
      - scripts/apply-chromium-toolbar-action-e2e.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Apply and verify
        run: |
          python scripts/apply-chromium-toolbar-action-e2e.py
          pnpm exec prettier --write \
            scripts/e2e-chromium-toolbar.mjs \
            package.json \
            .github/workflows/browser-e2e.yml
          pnpm verify
          ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium
          pnpm test:e2e:chromium-toolbar
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/e2e-chromium-toolbar.mjs \
            package.json \
            .github/workflows/browser-e2e.yml
          git commit -m 'test: verify real Chromium toolbar Action state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
