name: Integrate schema-v1 upgrade

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-schema-v1-upgrade.yml
      - .github/patches/apply-schema-v1-upgrade.py

permissions:
  contents: write

concurrency:
  group: integrate-schema-v1-upgrade-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply schema-v1 upgrade slice
        run: |
          set -o pipefail
          python .github/patches/apply-schema-v1-upgrade.py 2>&1 | tee schema-v1-upgrade-apply.log

      - name: Format product slice
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee schema-v1-upgrade-format.log

      - name: Generate classified locale inventory
        run: |
          set -o pipefail
          pnpm locale:inventory 2>&1 | tee schema-v1-upgrade-inventory.log
          pnpm exec prettier --write docs/LOCALE_INVENTORY.json

      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee schema-v1-upgrade-verify.log

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-v1-upgrade-${{ github.run_id }}
          path: schema-v1-upgrade-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-schema-v1-upgrade.yml
          rm -f \
            .github/patches/apply-schema-v1-upgrade.py \
            schema-v1-upgrade-apply.log \
            schema-v1-upgrade-format.log \
            schema-v1-upgrade-inventory.log \
            schema-v1-upgrade-verify.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: upgrade original schema-v1 backups"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
