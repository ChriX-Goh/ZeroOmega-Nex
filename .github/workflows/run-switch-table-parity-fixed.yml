name: Run corrected Switch table parity integration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-switch-table-parity-fixed.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Extract corrected Switch apply script
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-switch-table-parity.yml').read_text().splitlines()
          marker = workflow.index('      - name: Apply Switch table parity slice')
          start = workflow.index('        run: |', marker) + 1
          extracted = []
          for line in workflow[start:]:
              if line.startswith('      - name:'):
                  break
              extracted.append(line[10:] if line.startswith('          ') else line)

          helper_start = next(
              i for i, line in enumerate(extracted) if line.strip().startswith('def replace_once(')
          )
          helper_end = next(
              i for i in range(helper_start + 1, len(extracted)) if extracted[i].strip() == ''
          )
          indent = extracted[helper_start][:-len(extracted[helper_start].lstrip())]
          helper = [
              indent + 'def replace_once(path: str, old: str, new: str) -> None:',
              indent + '    target = Path(path)',
              indent + '    source = target.read_text()',
              indent + '    matches = []',
              indent + "    for base_indent in ('', '  ', '    ', '      '):",
              indent + "        candidate = base_indent + old.replace('\\n', '\\n' + base_indent)",
              indent + '        if source.count(candidate) == 1:',
              indent + "            replacement = base_indent + new.replace('\\n', '\\n' + base_indent)",
              indent + '            matches.append((candidate, replacement))',
              indent + '    if len(matches) != 1:',
              indent + '        raise SystemExit(',
              indent + "            f'{path}: expected one indentation-aware match, found {len(matches)}: {old[:80]!r}'",
              indent + '        )',
              indent + '    old_value, new_value = matches[0]',
              indent + '    target.write_text(source.replace(old_value, new_value))',
          ]
          extracted[helper_start:helper_end] = helper
          Path('/tmp/apply-switch-table.sh').write_text('\n'.join(extracted) + '\n')
          PY
          bash /tmp/apply-switch-table.sh
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/SwitchProfileEditor.svelte \
            apps/extension/src/component-rendering.component.spec.ts \
            packages/profile-workflow/src/switch-operations.ts \
            packages/profile-workflow/src/switch-operations.test.ts \
            scripts/validate-ui-compatibility.mjs \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
            docs/UI_AUDIT_MATRIX.md
      - name: Verify repository
        run: pnpm verify
      - name: Clean generated and temporary files
        run: |
          rm -rf browser-builds browser-builds.tar.gz
          git clean -fdX
          rm -f .github/workflows/apply-switch-table-parity.yml
          rm -f .github/workflows/diagnose-switch-table-parity.yml
          rm -f .github/workflows/fix-switch-parity-patcher.yml
          rm -f .github/workflows/fix-switch-parity-patcher-v2.yml
          rm -f .github/workflows/run-switch-table-parity-fixed.yml
          git diff --check
      - name: Commit verified Switch slice
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: restore original Switch rule table'
          git push origin HEAD:feat/m8-profile-workflow
