name: Finalize M7 extension integration
on:
  push:
    branches: [feat/m7-browser-adapters]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-browser-adapters
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Add extension workspace link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pnpm-lock.yaml')
          text = path.read_text()
          marker = "    dependencies:\n      '@zeroomega-nex/core-contracts':\n"
          replacement = "    dependencies:\n      '@zeroomega-nex/browser-adapters':\n        specifier: workspace:*\n        version: link:../../packages/browser-adapters\n      '@zeroomega-nex/core-contracts':\n"
          if marker not in text:
              raise SystemExit('extension dependency marker not found')
          path.write_text(text.replace(marker, replacement, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - name: Format integration files
        run: |
          pnpm exec prettier --write \
            apps/extension/package.json \
            apps/extension/wxt.config.ts \
            apps/extension/src/entrypoints/background.ts \
            apps/extension/src/lib/browser-proxy-runtime.ts \
            scripts/guard-architecture.mjs \
            scripts/inspect-manifests.mjs
      - name: Commit integration files
        run: |
          rm .github/workflows/format-m7-extension.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml apps/extension scripts/guard-architecture.mjs scripts/inspect-manifests.mjs .github/workflows/format-m7-extension.yml
          git commit -m "build: lock and format m7 extension integration"
          git push origin HEAD:feat/m7-browser-adapters
