name: Apply toolbar created-tab retry

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-toolbar-created-tab-retry.yml
      - scripts/apply-toolbar-created-tab-retry.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply and verify
        run: |
          python scripts/apply-toolbar-created-tab-retry.py
          pnpm exec prettier --write \
            apps/extension/src/lib/original-toolbar-tab-coordinator.ts \
            apps/extension/src/lib/original-toolbar-tab-coordinator.test.ts
          pnpm verify
          pnpm build:firefox
          pnpm test:e2e:firefox
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/extension/src/lib/original-toolbar-tab-coordinator.ts \
            apps/extension/src/lib/original-toolbar-tab-coordinator.test.ts
          git commit -m 'fix: retry transient new-tab toolbar URLs'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
