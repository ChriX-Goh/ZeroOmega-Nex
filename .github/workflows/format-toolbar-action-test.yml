name: Format toolbar Action adapter test

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-toolbar-action-test.yml
      - apps/extension/src/lib/original-toolbar-action-adapter.test.ts

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Format test
        run: pnpm exec prettier --write apps/extension/src/lib/original-toolbar-action-adapter.test.ts

      - name: Upload formatted test
        uses: actions/upload-artifact@v4
        with:
          name: formatted-toolbar-action-test-${{ github.event.pull_request.head.sha }}
          path: apps/extension/src/lib/original-toolbar-action-adapter.test.ts
          if-no-files-found: error
          retention-days: 7
