name: Format Profile Traces E2E Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-profile-traces-e2e-probe.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format profile trace E2E files
        run: |
          pnpm exec prettier --write \
            scripts/e2e-firefox-profile-traces-toolbar.mjs \
            scripts/e2e-chromium-profile-traces-toolbar.mjs \
            scripts/nex-toolbar-profile-trace-scenarios.mjs \
            package.json \
            .github/workflows/browser-e2e.yml

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-profile-traces-e2e-files
          path: |
            scripts/e2e-firefox-profile-traces-toolbar.mjs
            scripts/e2e-chromium-profile-traces-toolbar.mjs
            scripts/nex-toolbar-profile-trace-scenarios.mjs
            package.json
            .github/workflows/browser-e2e.yml
          if-no-files-found: error
