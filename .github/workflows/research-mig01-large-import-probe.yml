name: Research MIG-01 Large Import Probe

on:
  push:
    branches:
      - research/mig01-large-runtime-export
    paths:
      - '.github/workflows/research-mig01-large-import-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Probe exact original large backup through importer and acceptance
        shell: bash
        run: |
          set -euo pipefail
          cat > packages/legacy-zeroomega/src/original-large-probe.test.ts <<'TS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { describe, expect, it } from 'vitest';
          import {
            acceptProfileWorkflowImport,
            applyProfileWorkflow,
            createDefaultProfileSpec,
            createProfileWorkflowState,
            MemoryProfileWorkflowRepository,
          } from '../../profile-workflow/src/index.js';
          import { importZeroOmegaBackup } from './index.js';

          const backupUrl = new URL(
            '../../../fixtures/zeroomega-v2/original-large-representative-v3.5.0.bak',
            import.meta.url,
          );
          const candidateUrl = new URL(
            '../../../evidence/mig01-large-runtime/original-large-representative.candidate.json',
            import.meta.url,
          );
          const context = {
            createdAt: '2026-08-07T06:30:00.000Z',
            documentId: 'document-large-probe',
            revisionId: 'revision-large-probe',
            deviceId: 'device-large-probe',
          } as const;

          describe('original large importer probe', () => {
            it('prints importer, acceptance, and fake-Apply results', async () => {
              const content = await readFile(backupUrl, 'utf8');
              const importStarted = performance.now();
              const result = importZeroOmegaBackup(content, context);
              const importMs = performance.now() - importStarted;
              expect(result.ok).toBe(true);
              if (!result.ok) throw new Error(JSON.stringify(result.report, null, 2));

              const candidateContent = JSON.stringify(result.candidate);
              await writeFile(candidateUrl, candidateContent);
              const candidateBytes = Buffer.byteLength(candidateContent, 'utf8');
              const initialSpec = createDefaultProfileSpec({
                documentId: 'browser-document-large-probe',
                revisionId: 'browser-revision-initial',
                createdAt: '2026-08-07T06:29:00.000Z',
                deviceId: 'browser-device-large-probe',
              });
              const initialState = createProfileWorkflowState(initialSpec);
              const repository = new MemoryProfileWorkflowRepository(initialState);
              const acceptStarted = performance.now();
              const accepted = await acceptProfileWorkflowImport(
                repository,
                initialState,
                result.candidate,
                result.secretMaterials,
              );
              const acceptMs = performance.now() - acceptStarted;
              expect(accepted.status).toBe('accepted');
              if (accepted.status !== 'accepted') throw new Error(JSON.stringify(accepted));
              const acceptedStateBytes = Buffer.byteLength(JSON.stringify(accepted.state), 'utf8');

              const applyStarted = performance.now();
              const applied = await applyProfileWorkflow(
                repository,
                {
                  async activate() {
                    return { snapshotId: 'snapshot-large-probe' };
                  },
                  async rollback() {},
                },
                {
                  applyId: 'apply-large-probe',
                  revisionId: 'browser-revision-large-applied',
                  startedAt: '2026-08-07T06:31:00.000Z',
                  completedAt: '2026-08-07T06:31:01.000Z',
                  deviceId: 'browser-device-large-probe',
                },
              );
              const applyMs = performance.now() - applyStarted;
              expect(applied.status).toBe('applied');
              if (applied.status !== 'applied') throw new Error(JSON.stringify(applied));
              const appliedStateBytes = Buffer.byteLength(JSON.stringify(applied.state), 'utf8');

              console.log(
                'LARGE_TRANSACTION_PROBE=' +
                  JSON.stringify({
                    importer: {
                      ms: importMs,
                      sourceBytes: Buffer.byteLength(content, 'utf8'),
                      summary: result.report.summary,
                      profiles: result.candidate.profiles.length,
                      endpoints: result.candidate.proxyEndpoints.length,
                      ruleSources: result.candidate.ruleSources.length,
                      switchRules: result.candidate.profiles
                        .filter((profile) => profile.kind === 'switch')
                        .reduce((sum, profile) => sum + profile.rules.length, 0),
                      candidateBytes,
                    },
                    acceptance: {
                      ms: acceptMs,
                      status: accepted.status,
                      generation: accepted.state.generation,
                      stateBytes: acceptedStateBytes,
                    },
                    fakeApply: {
                      ms: applyMs,
                      status: applied.status,
                      generation: applied.state.generation,
                      stateBytes: appliedStateBytes,
                    },
                  }),
              );
            });
          });
          TS
          mkdir -p evidence/mig01-large-runtime
          pnpm exec vitest run packages/legacy-zeroomega/src/original-large-probe.test.ts --reporter=verbose
      - name: Commit candidate evidence on research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/mig01-large-runtime/original-large-representative.candidate.json
          git diff --cached --check
          git commit -m 'research: pin original large candidate'
          git push origin HEAD:research/mig01-large-runtime-export
