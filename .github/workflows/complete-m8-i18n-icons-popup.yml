name: Complete M8 Localization Icons Popup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply localization icon and Popup slice
        run: python .github/scripts/complete-m8-i18n-icons-popup.py

      - name: Complete localized accessibility labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/extension/src/lib/i18n.ts')
          text = path.read_text()
          anchor = "  'Backup file': { 'zh-CN': '备份文件', 'zh-TW': '備份檔案' },\n"
          addition = anchor + "  'Legacy backup file': { 'zh-CN': '原版备份文件', 'zh-TW': '原版備份檔案' },\n  'Legacy backup': { 'zh-CN': '原版备份', 'zh-TW': '原版備份' },\n  'Options theme': { 'zh-CN': '选项主题', 'zh-TW': '選項佈景主題' },\n  'Paste the complete ZeroOmega / SwitchyOmega backup': { 'zh-CN': '粘贴完整的 ZeroOmega / SwitchyOmega 备份', 'zh-TW': '貼上完整的 ZeroOmega / SwitchyOmega 備份' },\n"
          if text.count(anchor) != 1:
              raise SystemExit('accessibility locale anchor missing')
          path.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Format changed text files
        run: |
          pnpm exec prettier --write \
            apps/extension/src/lib/i18n.ts \
            apps/extension/src/lib/i18n.test.ts \
            apps/extension/src/lib/ui-theme.ts \
            apps/extension/src/components/ProfileIcon.svelte \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/style.css \
            apps/extension/src/entrypoints/options/main.ts \
            apps/extension/src/entrypoints/popup/App.svelte \
            apps/extension/src/entrypoints/popup/style.css \
            apps/extension/src/entrypoints/popup/main.ts \
            apps/extension/src/component-rendering.component.spec.ts \
            apps/extension/wxt.config.ts \
            apps/extension/public/_locales/en/messages.json \
            apps/extension/public/_locales/zh_CN/messages.json \
            apps/extension/public/_locales/zh_TW/messages.json \
            packages/profile-workflow/src/defaults.ts \
            packages/profile-workflow/src/defaults.test.ts \
            packages/profile-workflow/src/profile-operations.ts \
            packages/profile-workflow/src/profile-operations.test.ts \
            packages/profile-workflow/src/commands.ts \
            packages/profile-workflow/src/commands.test.ts \
            scripts/validate-ui-compatibility.mjs \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            docs/ORIGINAL_PARITY_MATRIX.md

      - name: Verify complete slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm validate:ui
            pnpm --filter @zeroomega-nex/profile-workflow check
            pnpm --filter @zeroomega-nex/profile-workflow test
            pnpm --filter @zeroomega-nex/extension check
            pnpm test:components
            pnpm verify
          } 2>&1 | tee complete-m8-localization.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-m8-localization-diagnostics
          path: complete-m8-localization.log
          if-no-files-found: warn

      - name: Commit completed slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src \
            apps/extension/public \
            apps/extension/wxt.config.ts \
            packages/profile-workflow/src \
            scripts/validate-ui-compatibility.mjs \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            docs/ORIGINAL_PARITY_MATRIX.md
          git commit -m 'feat: complete localization icons and original popup defaults'
          git push origin HEAD:feat/m8-profile-workflow
