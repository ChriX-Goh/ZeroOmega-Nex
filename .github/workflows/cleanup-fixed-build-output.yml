name: Clean Fixed verification build outputs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-fixed-build-output.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - name: Remove generated verification outputs
        run: |
          git rm -r --ignore-unmatch browser-builds browser-builds.tar.gz
          rm -f .github/workflows/cleanup-fixed-build-output.yml
      - name: Commit clean repository state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove Fixed verification build outputs'
          git push origin HEAD:feat/m8-profile-workflow
