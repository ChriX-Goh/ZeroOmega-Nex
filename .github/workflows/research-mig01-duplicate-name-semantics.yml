name: Research MIG-01 Duplicate Name Semantics

on:
  push:
    branches:
      - research/mig01-duplicate-name-semantics
    paths:
      - '.github/workflows/research-mig01-duplicate-name-semantics.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ZeroOmega Nex
        uses: actions/checkout@v4

      - name: Checkout original ZeroOmega v3.5.0
        uses: actions/checkout@v4
        with:
          repository: zero-peak/ZeroOmega
          ref: v3.5.0
          path: original

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pinned original runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd original/omega-pac
          npm install --omit=dev --no-audit --no-fund
          cd ../omega-target
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund coffee-script@1.12.7

      - name: Prove original duplicate-name behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/mig01-duplicate-name-semantics
          cd original/omega-target
          node <<'NODE'
          require('coffee-script/register');
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const childProcess = require('child_process');

          const Options = require('./src/options.coffee');
          const Storage = require('./src/storage.coffee');
          const defaultOptions = require('./src/default_options.coffee');
          const Profiles = require('omega-pac').Profiles;

          const proxyImpl = {
            applyProfile() {
              return Promise.resolve();
            },
          };

          async function expectReject(promiseFactory) {
            try {
              await promiseFactory();
              return { rejected: false, message: null };
            } catch (error) {
              return { rejected: true, message: String(error?.message ?? error) };
            }
          }

          async function newOptions(raw) {
            const instance = new Options(new Storage(), new Storage(), null, null, proxyImpl);
            await instance.initWithOptions(raw);
            await new Promise((resolve) => setTimeout(resolve, 50));
            return instance;
          }

          (async () => {
            const api = await newOptions(defaultOptions());
            const first = Profiles.create({
              name: 'duplicate target',
              profileType: 'FixedProfile',
              fallbackProxy: { scheme: 'http', host: 'first.example.invalid', port: 8080 },
            });
            await api.addProfile(first);
            const addDuplicate = await expectReject(() =>
              api.addProfile(
                Profiles.create({
                  name: 'duplicate target',
                  profileType: 'FixedProfile',
                  fallbackProxy: { scheme: 'http', host: 'second.example.invalid', port: 8081 },
                }),
              ),
            );

            const renameSource = Profiles.create({
              name: 'rename source',
              profileType: 'FixedProfile',
              fallbackProxy: { scheme: 'http', host: 'rename.example.invalid', port: 8082 },
            });
            await api.addProfile(renameSource);
            const renameDuplicate = await expectReject(() =>
              api.renameProfile('rename source', 'duplicate target'),
            );

            const quickInput = [
              'proxy',
              'proxy',
              'auto switch',
              'proxy',
              'system',
              'system',
              'missing profile',
              '',
              'auto switch',
            ];
            const quickRaw = defaultOptions();
            quickRaw['-enableQuickSwitch'] = true;
            quickRaw['-quickSwitchProfiles'] = [...quickInput];
            const quickRuntime = await newOptions(quickRaw);
            const quickNormalized = [...quickRuntime.getAll()['-quickSwitchProfiles']];
            const expectedQuick = ['proxy', 'auto switch', 'system'];
            if (JSON.stringify(quickNormalized) !== JSON.stringify(expectedQuick)) {
              throw new Error(
                `Unexpected Quick Switch normalization: ${JSON.stringify(quickNormalized)}`,
              );
            }

            const normalizedBackup = JSON.stringify(quickRuntime.getAll());
            const normalizedSha256 = crypto
              .createHash('sha256')
              .update(normalizedBackup)
              .digest('hex');

            const shadowRaw = defaultOptions();
            shadowRaw['+shadow slot'] = Profiles.create({
              name: 'proxy',
              profileType: 'FixedProfile',
              fallbackProxy: { scheme: 'http', host: 'shadow.example.invalid', port: 9090 },
            });
            shadowRaw['+reference switch'] = Profiles.create({
              name: 'reference switch',
              profileType: 'SwitchProfile',
              defaultProfileName: 'proxy',
              rules: [],
            });
            const duplicateNameKeys = [];
            Profiles.each(shadowRaw, (key, profile) => {
              if (profile.name === 'proxy') duplicateNameKeys.push(key);
            });
            const byNameProxy = Profiles.byName('proxy', shadowRaw);
            const byKeyShadow = Profiles.byKey('+shadow slot', shadowRaw);
            const referenceClosure = Profiles.allReferenceSet('reference switch', shadowRaw, {
              profileNotFound: 'dumb',
            });
            if (byNameProxy !== shadowRaw['+proxy']) {
              throw new Error('Original byName did not select canonical +proxy slot');
            }
            if (byKeyShadow !== shadowRaw['+shadow slot']) {
              throw new Error('Original byKey did not expose the mismatched shadow slot');
            }
            if (!referenceClosure['+proxy'] || referenceClosure['+shadow slot']) {
              throw new Error(`Unexpected reference closure: ${JSON.stringify(referenceClosure)}`);
            }

            const duplicateJsonKey = JSON.parse(
              '{"schemaVersion":2,"+same":{"name":"first","profileType":"DirectProfile"},"+same":{"name":"second","profileType":"SystemProfile"}}',
            );
            if (duplicateJsonKey['+same']?.name !== 'second') {
              throw new Error('JSON duplicate-key last-wins behavior changed');
            }

            if (!addDuplicate.rejected || !renameDuplicate.rejected) {
              throw new Error(
                `Original public API unexpectedly allowed a duplicate identity: ${JSON.stringify({ addDuplicate, renameDuplicate })}`,
              );
            }

            const originalCommit = childProcess
              .execFileSync('git', ['-C', '..', 'rev-parse', 'HEAD'], { encoding: 'utf8' })
              .trim();
            const proof = {
              sourceRepository: 'zero-peak/ZeroOmega',
              sourceTag: 'v3.5.0',
              sourceCommit: originalCommit,
              runtimeModules: [
                'omega-target/src/options.coffee',
                'omega-target/src/storage.coffee',
                'omega-pac/src/profiles.coffee',
              ],
              publicProfileIdentity: {
                addDuplicate,
                renameDuplicate,
                classification: 'duplicate profile identities are not a valid public-runtime state',
              },
              quickSwitchDuplicateReferences: {
                input: quickInput,
                normalized: quickNormalized,
                rule: 'first occurrence wins; empty, missing, and later duplicate names are removed',
                classification: 'valid legacy input is normalized before stable runtime/export state',
              },
              shadowedRawIdentity: {
                duplicateNameKeys,
                byNameSelectedKey: '+proxy',
                byKeyShadowKey: '+shadow slot',
                referenceClosure,
                classification:
                  'key/name-mismatched duplicate definitions are address-ambiguous and cannot be created by addProfile/renameProfile',
              },
              duplicateJsonObjectKey: {
                survivingName: duplicateJsonKey['+same'].name,
                rule: 'JSON.parse last key wins before ZeroOmega receives the object',
              },
              normalizedBackupSha256: normalizedSha256,
            };

            const outDir = path.resolve('../../evidence/mig01-duplicate-name-semantics');
            fs.writeFileSync(
              path.join(outDir, 'original-quick-switch-normalized-v3.5.0.bak'),
              normalizedBackup,
            );
            fs.writeFileSync(
              path.join(outDir, 'original-duplicate-name-semantics-v3.5.0.provenance.json'),
              `${JSON.stringify(proof, null, 2)}\n`,
            );
            console.log(JSON.stringify(proof, null, 2));
          })().catch((error) => {
            console.error(error?.stack ?? error);
            process.exitCode = 1;
          });
          NODE

      - name: Upload original-runtime duplicate-name evidence
        uses: actions/upload-artifact@v4
        with:
          name: mig01-original-duplicate-name-semantics-v3.5.0
          path: evidence/mig01-duplicate-name-semantics
          if-no-files-found: error
