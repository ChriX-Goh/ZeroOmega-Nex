name: Connect Milestone 8 Switch Editor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  connect:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Connect Switch Profile editor
        run: python .github/scripts/connect-m8-switch-editor.py

      - name: Format Milestone 8 Switch files
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/SwitchProfileEditor.svelte \
            packages/browser-adapters/src/activation-built-in.test.ts \
            packages/profile-workflow/src/switch-operations.test.ts \
            packages/profile-workflow/src/switch-operations.ts

      - name: Verify Switch Profile slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @zeroomega-nex/profile-workflow check
            pnpm --filter @zeroomega-nex/extension check
            pnpm exec vitest run \
              packages/profile-workflow/src/switch-operations.test.ts \
              packages/browser-adapters/src/activation-built-in.test.ts
          } 2>&1 | tee m8-switch-editor.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-switch-editor-diagnostics
          path: m8-switch-editor.log
          if-no-files-found: warn

      - name: Commit Switch Profile editor integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/SwitchProfileEditor.svelte \
            packages/browser-adapters/src/activation-built-in.test.ts \
            packages/profile-workflow/src/switch-operations.test.ts \
            packages/profile-workflow/src/switch-operations.ts
          git commit -m 'feat: connect ordered Switch Profile editor'
          git push origin HEAD:feat/m8-profile-workflow
