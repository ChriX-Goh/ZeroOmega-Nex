name: Connect Milestone 8 Revision Query

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  connect:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Connect revision history query
        run: python .github/scripts/connect-m8-revision-query.py

      - name: Format revision query slice
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/SnapshotHistoryPanel.svelte \
            apps/extension/src/lib/profile-workflow-runtime.ts \
            packages/profile-workflow/src/commands-history.test.ts \
            packages/profile-workflow/src/commands.ts

      - name: Verify revision query slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @zeroomega-nex/profile-workflow check
            pnpm --filter @zeroomega-nex/extension check
            pnpm exec vitest run \
              packages/profile-workflow/src/commands-history.test.ts \
              packages/profile-workflow/src/revision-history.test.ts
          } 2>&1 | tee m8-revision-query.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-revision-query-diagnostics
          path: m8-revision-query.log
          if-no-files-found: warn

      - name: Commit revision query integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/entrypoints/options/SnapshotHistoryPanel.svelte \
            apps/extension/src/lib/profile-workflow-runtime.ts \
            packages/profile-workflow/src/commands-history.test.ts \
            packages/profile-workflow/src/commands.ts
          git commit -m 'feat: include redacted revision history in Options'
          git push origin HEAD:feat/m8-profile-workflow
