name: Finalize Original UI Guard Correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.repository == 'ChriX-Goh/ZeroOmega-Nex' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Correct original-facing guard and Chromium contract
        run: |
          python <<'PY'
          from pathlib import Path

          validator = Path('scripts/validate-ui-compatibility.mjs')
          source = validator.read_text()
          old = '''      optionsApp.includes("uiText('options.builtin.directHelp', locale)") &&'''
          new = '''      !optionsApp.includes("uiText('options.builtin.directHelp', locale)") &&'''
          assert source.count(old) == 1, source.count(old)
          validator.write_text(source.replace(old, new, 1))

          chromium = Path('scripts/e2e-chromium.mjs')
          source = chromium.read_text()
          old = '''  await options.getByRole('button', { name: '配置历史' }).click();
  await options.getByRole('heading', { name: '配置历史', exact: true, level: 1 }).waitFor();
  await options.getByRole('heading', { name: '已验证的 PAC 快照', exact: true }).waitFor();
  await options.locator('.settings-section').first().waitFor({ timeout: 20_000 });'''
          new = '''  assert.equal(
    await options.getByRole('button', { name: '配置历史', exact: true }).count(),
    0,
    'Original-facing Options exposed Nex-only configuration history navigation',
  );'''
          assert source.count(old) == 1, source.count(old)
          chromium.write_text(source.replace(old, new, 1))
          PY

      - name: Format and syntax-check correction
        run: |
          pnpm exec prettier --write \
            scripts/validate-ui-compatibility.mjs \
            scripts/e2e-chromium.mjs
          node --check scripts/validate-ui-compatibility.mjs
          node --check scripts/e2e-chromium.mjs
          git diff --check

      - name: Restore permanent parity workflow
        run: git checkout HEAD^ -- .github/workflows/parity-documentation.yml

      - name: Commit exact guard correction
        run: |
          git config user.name 'ZeroOmega Nex automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove redesign-era UI guard assumptions'
          git push origin HEAD:feat/m8-profile-workflow
