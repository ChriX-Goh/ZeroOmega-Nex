name: Capture attached Rule List context

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/capture-attached-rule-list-context.yml

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 1
          show-progress: false
      - name: Capture implementation context
        run: |
          tar -czf /tmp/attached-rule-list-context.tgz \
            package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig*.json \
            apps packages scripts docs \
            --exclude='apps/extension/.output' \
            --exclude='**/node_modules'
      - uses: actions/upload-artifact@v4
        with:
          name: attached-rule-list-context
          path: /tmp/attached-rule-list-context.tgz
          if-no-files-found: error
