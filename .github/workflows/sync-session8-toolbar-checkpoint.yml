name: Sync Session 8 toolbar checkpoint

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sync-session8-toolbar-checkpoint.yml
      - scripts/sync-session8-toolbar-checkpoint.py

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Apply checkpoint
        run: |
          python scripts/sync-session8-toolbar-checkpoint.py
          pnpm exec prettier --write \
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md

      - name: Verify checkpoint
        run: pnpm verify

      - name: Commit checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/DELIVERY_ORDER_01_TOOLBAR_STATE.md \
            docs/ORIGINAL_KNOWLEDGE_GRAPH.md
          git commit -m 'docs: sync Session 8 toolbar checkpoint'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
