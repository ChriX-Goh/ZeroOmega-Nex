name: Fix Switch parity patcher v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-switch-parity-patcher-v2.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - name: Rewrite replacement helper by line boundaries
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-switch-table-parity.yml')
          lines = path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip().startswith('def replace_once('))
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == '')
          indent = lines[start][:-len(lines[start].lstrip())]
          body = [
              indent + 'def replace_once(path: str, old: str, new: str) -> None:',
              indent + '    target = Path(path)',
              indent + '    source = target.read_text()',
              indent + '    matches = []',
              indent + "    for base_indent in ('', '  ', '    ', '      '):",
              indent + "        candidate = base_indent + old.replace('\\n', '\\n' + base_indent)",
              indent + '        if source.count(candidate) == 1:',
              indent + "            replacement = base_indent + new.replace('\\n', '\\n' + base_indent)",
              indent + '            matches.append((candidate, replacement))',
              indent + '    if len(matches) != 1:',
              indent + '        raise SystemExit(',
              indent + "            f'{path}: expected one indentation-aware match, found {len(matches)}: {old[:80]!r}'",
              indent + '        )',
              indent + '    old_value, new_value = matches[0]',
              indent + '    target.write_text(source.replace(old_value, new_value))',
          ]
          lines[start:end] = body
          path.write_text('\n'.join(lines) + '\n')
          PY
          rm -f .github/workflows/fix-switch-parity-patcher.yml
          rm -f .github/workflows/fix-switch-parity-patcher-v2.yml
          rm -f .github/workflows/diagnose-switch-table-parity.yml
      - name: Commit corrected patcher
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: rewrite Switch parity replacement helper'
          git push origin HEAD:feat/m8-profile-workflow
