name: Capture Current Source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Package repository source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.output -czf zeroomega-nex-source.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: zeroomega-nex-current-source
          path: zeroomega-nex-source.tar.gz
          if-no-files-found: error
