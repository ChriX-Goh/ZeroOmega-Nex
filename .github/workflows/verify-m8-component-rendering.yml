name: Verify Milestone 8 Component Rendering

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format component rendering slice
        run: |
          pnpm exec prettier --write \
            apps/extension/vitest.component.config.ts \
            apps/extension/src/component-rendering.component.spec.ts \
            package.json

      - name: Verify component rendering slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @zeroomega-nex/extension check
            pnpm test:components
            pnpm guard:architecture
            pnpm validate:ui
          } 2>&1 | tee m8-component-rendering.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-component-rendering-diagnostics
          path: m8-component-rendering.log
          if-no-files-found: warn

      - name: Commit component rendering integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/vitest.component.config.ts \
            apps/extension/src/component-rendering.component.spec.ts \
            package.json
          git commit -m 'test: verify Milestone 8 Svelte component rendering'
          git push origin HEAD:feat/m8-profile-workflow
