name: Harden Milestone 8 History Status

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply history and error hardening
        run: python .github/scripts/harden-m8-history-status.py

      - name: Format history status slice
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/SnapshotHistoryPanel.svelte \
            packages/browser-adapters/src/snapshot-history.test.ts \
            packages/profile-workflow/src/contracts.ts \
            scripts/validate-ui-compatibility.mjs

      - name: Verify history status slice
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm validate:ui
            pnpm --filter @zeroomega-nex/browser-adapters check
            pnpm --filter @zeroomega-nex/profile-workflow check
            pnpm --filter @zeroomega-nex/extension check
            pnpm exec vitest run packages/browser-adapters/src/snapshot-history.test.ts
            pnpm test:components
          } 2>&1 | tee m8-history-status.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-history-status-diagnostics
          path: m8-history-status.log
          if-no-files-found: warn

      - name: Commit history status hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/SnapshotHistoryPanel.svelte \
            packages/browser-adapters/src/snapshot-history.test.ts \
            packages/profile-workflow/src/contracts.ts \
            scripts/validate-ui-compatibility.mjs
          git commit -m 'feat: disclose snapshot verification and surface global errors'
          git push origin HEAD:feat/m8-profile-workflow
