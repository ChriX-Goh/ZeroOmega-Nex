name: Research MIG-01 Large Script Fix

on:
  push:
    branches:
      - research/mig01-large-runtime-export
    paths:
      - '.github/workflows/research-mig01-large-script-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-large-runtime-export
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Make semantic re-import analysis-only and state-preserving
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          chromium = Path('scripts/e2e-chromium-original-large-migration.mjs')
          text = chromium.read_text()
          anchor = '''async function exportOriginalSemantics(options, originalOptions) {'''
          helper = '''async function reimportForReview(options, path) {
            await options.getByRole('button', { name: '导入 / 导出', exact: true }).click();
            await options.getByLabel('原版备份文件').setInputFiles(path);
            await options
              .getByRole('heading', { name: '兼容性检查', exact: true })
              .waitFor({ timeout: 60_000 });
            const importButton = options.getByRole('button', { name: '导入并立即使用', exact: true });
            assert.equal(await importButton.isEnabled(), true, 'Semantic re-import was not accepted for use');
          }

          async function exportOriginalSemantics(options, originalOptions) {'''
          if anchor not in text:
              raise SystemExit('Chromium export anchor missing')
          text = text.replace(anchor, helper, 1)
          old = '''  const exported = await exportOriginalSemantics(options, originalOptions);
            const generationBeforeReimport = restored.metrics.generation;
            await importAndUse(options, reimportPath, generationBeforeReimport);
            const reimported = await assertLargeState(options, 'after semantic re-import');
            await activateSwitch(options, reimported.switchId, 'after semantic re-import');
            await waitForActiveSwitch(
              options,
              reimported.switchId,
              'Semantic re-imported large switch did not become active',
            );
            await assertRouteDecisions(context, 'after-reimport');
          '''
          new = '''  const exported = await exportOriginalSemantics(options, originalOptions);
            await reimportForReview(options, reimportPath);
            const reimported = await assertLargeState(options, 'after semantic re-import analysis');
            assert.equal(reimported.switchId, restored.switchId);
            assert.deepEqual(reimported.metrics, restored.metrics);
            await waitForActiveSwitch(
              options,
              restored.switchId,
              'Semantic re-import analysis changed the confirmed Chromium PAC route',
            );
            await assertRouteDecisions(context, 'after-reimport-analysis');
          '''
          if old not in text:
              raise SystemExit('Chromium reimport block missing')
          text = text.replace(old, new, 1)
          text = text.replace('afterReimport: reimported.metrics,', 'afterReimportAnalysis: reimported.metrics,', 1)
          chromium.write_text(text)

          firefox = Path('scripts/e2e-firefox-original-large-migration.mjs')
          text = firefox.read_text()
          anchor = '''async function importAndUse(driver, path, previousGeneration) {'''
          helper = '''async function reimportForReview(driver, path) {
            const importExportButton = await driver.findElement(
              By.xpath("//button[.//*[@data-options-nav-icon='import']]"),
            );
            await importExportButton.click();
            const fileInput = await driver.wait(until.elementLocated(By.css('input[type="file"]')), 60_000);
            await fileInput.sendKeys(path);
            const compatibilityHeading = await driver.wait(
              until.elementLocated(By.css('[data-legacy-import-review]')),
              60_000,
            );
            await driver.wait(until.elementIsVisible(compatibilityHeading), 60_000);
            const importButton = await driver.wait(
              until.elementLocated(By.css('[data-legacy-import-and-use]')),
              60_000,
            );
            assert.equal(await importButton.isEnabled(), true, 'Firefox semantic re-import was not accepted for use');
          }

          async function importAndUse(driver, path, previousGeneration) {'''
          if anchor not in text:
              raise SystemExit('Firefox import anchor missing')
          text = text.replace(anchor, helper, 1)
          old = '''  const exported = await exportOriginalSemantics(driver, originalOptions);
            const generationBeforeReimport = restored.metrics.generation;
            await importAndUse(driver, reimportPath, generationBeforeReimport);
            const reimported = await assertLargeState(driver, 'after semantic re-import');
            await activateSwitch(driver, reimported.switchId, 'after semantic re-import');
            await waitForActiveSwitch(
              driver,
              reimported.switchId,
              'Semantic re-imported large switch did not become active in Firefox',
            );
            await assertRouteDecisions(driver, optionsWindow, 'after-reimport');
          '''
          new = '''  const exported = await exportOriginalSemantics(driver, originalOptions);
            await reimportForReview(driver, reimportPath);
            const reimported = await assertLargeState(driver, 'after semantic re-import analysis');
            assert.equal(reimported.switchId, restored.switchId);
            assert.deepEqual(reimported.metrics, restored.metrics);
            await waitForActiveSwitch(
              driver,
              restored.switchId,
              'Semantic re-import analysis changed the confirmed Firefox PAC route',
            );
            await assertRouteDecisions(driver, optionsWindow, 'after-reimport-analysis');
          '''
          if old not in text:
              raise SystemExit('Firefox reimport block missing')
          text = text.replace(old, new, 1)
          text = text.replace('afterReimport: reimported.metrics,', 'afterReimportAnalysis: reimported.metrics,', 1)
          firefox.write_text(text)
          PY
      - name: Format large E2E scripts
        run: |
          pnpm exec prettier --write \
            scripts/e2e-chromium-original-large-migration.mjs \
            scripts/e2e-firefox-original-large-migration.mjs
          pnpm exec prettier --check \
            scripts/e2e-chromium-original-large-migration.mjs \
            scripts/e2e-firefox-original-large-migration.mjs \
            package.json
      - name: Commit research fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/e2e-chromium-original-large-migration.mjs \
            scripts/e2e-firefox-original-large-migration.mjs
          git diff --cached --check
          git commit -m 'research: make large reimport analysis state-preserving'
          git push origin HEAD:research/mig01-large-runtime-export
