name: Research MIG-01 Large Script Fix

on:
  push:
    branches:
      - research/mig01-large-runtime-export
    paths:
      - '.github/workflows/research-mig01-large-script-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-large-runtime-export
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Isolate semantic re-import mutation baseline
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          chromium = Path('scripts/e2e-chromium-original-large-migration.mjs')
          text = chromium.read_text()
          old = '''  const exported = await exportOriginalSemantics(options, originalOptions);
  await reimportForReview(options, reimportPath);
  const reimported = await assertLargeState(options, 'after semantic re-import analysis');
  assert.equal(reimported.switchId, restored.switchId);
  assert.deepEqual(reimported.metrics, restored.metrics);
  await waitForActiveSwitch(
    options,
    restored.switchId,
    'Semantic re-import analysis changed the confirmed Chromium PAC route',
  );
  await assertRouteDecisions(context, 'after-reimport-analysis');
'''
          new = '''  const exported = await exportOriginalSemantics(options, originalOptions);
  const beforeReimport = await assertLargeState(
    options,
    'after semantic export / before re-import analysis',
  );
  await reimportForReview(options, reimportPath);
  const reimported = await assertLargeState(options, 'after semantic re-import analysis');
  assert.equal(reimported.switchId, beforeReimport.switchId);
  assert.deepEqual(reimported.metrics, beforeReimport.metrics);
  await waitForActiveSwitch(
    options,
    beforeReimport.switchId,
    'Semantic re-import analysis changed the confirmed Chromium PAC route',
  );
  await assertRouteDecisions(context, 'after-reimport-analysis');
'''
          if old not in text:
              raise SystemExit('Chromium current re-import block not found')
          text = text.replace(old, new, 1)
          old_metrics = '''          afterImport: imported.metrics,
          afterRestart: restored.metrics,
          afterReimportAnalysis: reimported.metrics,
'''
          new_metrics = '''          afterImport: imported.metrics,
          afterRestart: restored.metrics,
          afterExportBeforeReimport: beforeReimport.metrics,
          afterReimportAnalysis: reimported.metrics,
'''
          if old_metrics not in text:
              raise SystemExit('Chromium metrics block not found')
          chromium.write_text(text.replace(old_metrics, new_metrics, 1))

          firefox = Path('scripts/e2e-firefox-original-large-migration.mjs')
          text = firefox.read_text()
          old = '''  const exported = await exportOriginalSemantics(driver, originalOptions);
  await reimportForReview(driver, reimportPath);
  const reimported = await assertLargeState(driver, 'after semantic re-import analysis');
  assert.equal(reimported.switchId, restored.switchId);
  assert.deepEqual(reimported.metrics, restored.metrics);
  await waitForActiveSwitch(
    driver,
    restored.switchId,
    'Semantic re-import analysis changed the confirmed Firefox PAC route',
  );
  await assertRouteDecisions(driver, optionsWindow, 'after-reimport-analysis');
'''
          new = '''  const exported = await exportOriginalSemantics(driver, originalOptions);
  const beforeReimport = await assertLargeState(
    driver,
    'after semantic export / before re-import analysis',
  );
  await reimportForReview(driver, reimportPath);
  const reimported = await assertLargeState(driver, 'after semantic re-import analysis');
  assert.equal(reimported.switchId, beforeReimport.switchId);
  assert.deepEqual(reimported.metrics, beforeReimport.metrics);
  await waitForActiveSwitch(
    driver,
    beforeReimport.switchId,
    'Semantic re-import analysis changed the confirmed Firefox PAC route',
  );
  await assertRouteDecisions(driver, optionsWindow, 'after-reimport-analysis');
'''
          if old not in text:
              raise SystemExit('Firefox current re-import block not found')
          text = text.replace(old, new, 1)
          old_metrics = '''          afterImport: imported.metrics,
          afterRestart: restored.metrics,
          afterReimportAnalysis: reimported.metrics,
'''
          new_metrics = '''          afterImport: imported.metrics,
          afterRestart: restored.metrics,
          afterExportBeforeReimport: beforeReimport.metrics,
          afterReimportAnalysis: reimported.metrics,
'''
          if old_metrics not in text:
              raise SystemExit('Firefox metrics block not found')
          firefox.write_text(text.replace(old_metrics, new_metrics, 1))
          PY
      - name: Format large E2E scripts
        run: |
          pnpm exec prettier --write \
            scripts/e2e-chromium-original-large-migration.mjs \
            scripts/e2e-firefox-original-large-migration.mjs
          pnpm exec prettier --check \
            scripts/e2e-chromium-original-large-migration.mjs \
            scripts/e2e-firefox-original-large-migration.mjs \
            package.json
      - name: Commit research fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/e2e-chromium-original-large-migration.mjs \
            scripts/e2e-firefox-original-large-migration.mjs
          git diff --cached --check
          git commit -m 'research: isolate large reimport mutation baseline'
          git push origin HEAD:research/mig01-large-runtime-export
