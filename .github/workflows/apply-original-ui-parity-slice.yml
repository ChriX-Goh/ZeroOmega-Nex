name: Apply Original UI Parity Slice

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-original-ui-parity-slice.yml

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'ChriX-Goh/ZeroOmega-Nex' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded original UI structure correction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          options = Path('apps/extension/src/entrypoints/options/App.svelte')
          source = options.read_text()

          source = source.replace(
              "  import { productIdentity } from '@zeroomega-nex/core-contracts';\n",
              '',
          )
          source = source.replace(
              "  import { onMount } from 'svelte';\n",
              "  import { onMount } from 'svelte';\n  import { browser } from 'wxt/browser';\n",
          )
          source = source.replace(
              "  let activeSection: OptionsSection = 'profile';",
              "  let activeSection: OptionsSection = 'about';",
          )
          source = source.replace(
              "      if (!(await navigate('profile', state?.selectedProfileId, false))) {",
              "      if (!(await navigate('about', undefined, false))) {",
          )

          history_pattern = re.compile(
              r"\n        <button\n          class:active=\{activeSection === 'history'\}.*?"
              r"<span aria-hidden=\"true\">↶</span><span>\{uiText\('history\.nav', locale\)\}</span>\n"
              r"        </button>",
              re.S,
          )
          source, count = history_pattern.subn('', source)
          assert count == 1, f'history nav replacements: {count}'

          source = source.replace(
              '''        <span class="brand-mark" aria-hidden="true">Ω</span>\n        <span>{productIdentity.name}</span>''',
              '''        <span>Zero Omega</span>''',
          )
          for glyph in ('⌘', '⚙', '⇅', '◐', '＋', '✓', '×'):
              source = source.replace(f'<span aria-hidden="true">{glyph}</span>', '')

          status_pattern = re.compile(
              r"\n        <p class=\"draft-status\" role=\"status\">.*?</p>",
              re.S,
          )
          source, count = status_pattern.subn('', source)
          assert count == 1, f'draft status replacements: {count}'

          nav_end = '''      </section>\n    </nav>\n  </aside>'''
          assert nav_end in source
          source = source.replace(
              nav_end,
              '''      </section>\n\n      <button\n        class="about-navigation"\n        class:active={activeSection === 'about'}\n        type="button"\n        onclick={() => void navigate('about')}\n      >\n        {originalCopy.about}\n      </button>\n    </nav>\n  </aside>''',
              1,
          )

          before_mount = '  onMount(() => {'
          assert before_mount in source
          source = source.replace(
              before_mount,
              '''  const originalCopy =\n    locale === 'zh-CN'\n      ? {\n          about: '关于',\n          tagline: '代理设置工具',\n          reportIssues: '报告问题',\n          saveErrorLog: '保存错误日志',\n          resetOptions: '重置选项',\n          resetConfirm: '确定要重置 ZeroOmega 的全部选项吗？',\n          noServices: 'ZeroOmega 不提供代理、VPN 或其他网络服务。',\n          privacy: 'ZeroOmega 不跟踪用户，也不会在网页中插入广告。',\n          help: '使用 ZeroOmega 时遇到问题，请查阅常见问题或报告问题。',\n          version: '版本',\n        }\n      : locale === 'zh-TW'\n        ? {\n            about: '關於',\n            tagline: '代理設定工具',\n            reportIssues: '回報問題',\n            saveErrorLog: '儲存錯誤記錄',\n            resetOptions: '重設選項',\n            resetConfirm: '確定要重設 ZeroOmega 的全部選項嗎？',\n            noServices: 'ZeroOmega 不提供代理、VPN 或其他網路服務。',\n            privacy: 'ZeroOmega 不追蹤使用者，也不會在網頁中插入廣告。',\n            help: '使用 ZeroOmega 時遇到問題，請查閱常見問題或回報問題。',\n            version: '版本',\n          }\n        : {\n            about: 'About',\n            tagline: 'A proxy configuration tool',\n            reportIssues: 'Report issues',\n            saveErrorLog: 'Save error log',\n            resetOptions: 'Reset options',\n            resetConfirm: 'Reset all ZeroOmega options?',\n            noServices: 'ZeroOmega does not provide proxies, VPNs, or other network services.',\n            privacy: 'ZeroOmega does not track you or insert ads into webpages.',\n            help: 'Need help with using ZeroOmega? See the FAQ or report an issue.',\n            version: 'Version',\n          };\n\n  function saveErrorLog(): void {\n    const payload = {\n      generatedAt: new Date().toISOString(),\n      version: browser.runtime.getManifest().version,\n      error: errorMessage || undefined,\n      workflow: state,\n    };\n    const url = URL.createObjectURL(\n      new Blob([`${JSON.stringify(payload, null, 2)}\\n`], { type: 'application/json' }),\n    );\n    const anchor = document.createElement('a');\n    anchor.href = url;\n    anchor.download = `zeroomega-error-log-${Date.now()}.json`;\n    anchor.click();\n    URL.revokeObjectURL(url);\n  }\n\n  async function resetOptions(): Promise<void> {\n    if (!globalThis.confirm(originalCopy.resetConfirm)) return;\n    await browser.storage.local.clear();\n    globalThis.location.replace('options.html#/about');\n  }\n\n  onMount(() => {''',
              1,
          )

          about_pattern = re.compile(
              r"    \{:else if activeSection === 'about'\}\n"
              r"      <div data-about-settings data-typed-locale=\{locale\}>.*?\n"
              r"      </div>\n"
              r"    \{:else if selectedProfile && state\}",
              re.S,
          )
          about_markup = '''    {:else if activeSection === 'about'}\n      <div data-about-settings data-typed-locale={locale} class="original-about-page">\n        <header class="editor-heading">\n          <h1>{originalCopy.about}</h1>\n        </header>\n        <section class="about-product">\n          <div class="about-mark" aria-hidden="true">Ω</div>\n          <div>\n            <h2>ZeroOmega</h2>\n            <p>{originalCopy.tagline}</p>\n          </div>\n        </section>\n        <div class="about-actions">\n          <a\n            class="report-issues"\n            href="https://github.com/zero-peak/ZeroOmega/issues"\n            target="_blank"\n            rel="noreferrer">{originalCopy.reportIssues}</a\n          >\n          <button type="button" onclick={saveErrorLog}>{originalCopy.saveErrorLog}</button>\n          <button type="button" class="danger" onclick={() => void resetOptions()}>\n            {originalCopy.resetOptions}\n          </button>\n        </div>\n        <p>{originalCopy.version} {browser.runtime.getManifest().version}</p>\n        <div class="about-notices">\n          <p>{originalCopy.noServices}</p>\n          <p>{originalCopy.privacy}</p>\n          <p>{originalCopy.help}</p>\n        </div>\n        <footer class="about-license">\n          <p>ZeroOmega</p>\n          <p>Copyright 2012-2017 The SwitchyOmega Authors. All rights reserved.</p>\n          <p>Copyright 2024-2025 The ZeroOmega Authors.</p>\n          <p>ZeroOmega is free software licensed under GNU General Public License Version 3 or later.</p>\n        </footer>\n      </div>\n    {:else if selectedProfile && state}'''
          source, count = about_pattern.subn(about_markup, source)
          assert count == 1, f'about replacements: {count}'
          source = source.replace(
              '          browserTarget={browserTargetCapabilities.target}\n',
              '',
          )
          options.write_text(source)

          fixed = Path('apps/extension/src/entrypoints/options/FixedProfileEditor.svelte')
          source = fixed.read_text()
          source, count = re.subn(
              r"  import \{\n    fixedProxySlotCapability,.*?\n  \} from '@zeroomega-nex/pac-compiler';\n",
              '',
              source,
              flags=re.S,
          )
          assert count == 1, f'capability import replacements: {count}'
          source = source.replace(
              "  export let browserTarget: Exclude<PacTarget, 'cross-browser'> = 'chromium';\n",
              '',
          )
          source, count = re.subn(
              r"\n  function protocolCapability\(protocol: ProxyProtocol\): ProxyProtocolCapability \{.*?\n  function rowDisplayLabel",
              '\n  function rowDisplayLabel',
              source,
              flags=re.S,
          )
          assert count == 1, f'capability helper replacements: {count}'
          source, count = re.subn(
              r"\n  <section\n    class=\"settings-section protocol-capabilities-section\".*?\n  </section>\n\n  <section class=\"settings-section\">",
              '\n  <section class="settings-section">',
              source,
              flags=re.S,
          )
          assert count == 1, f'capability UI replacements: {count}'
          capability_css = [
              r"\n  \.protocol-capabilities-section \{\n    margin-top: 18px;\n  \}\n",
              r"\n  \.target-summary,\n  \.ftp-capability-note \{\n    margin: 8px 0;\n  \}\n",
              r"\n  \.protocol-capabilities-table \{.*?\n  \}\n",
              r"\n  \.protocol-capabilities-table th,\n  \.protocol-capabilities-table td \{.*?\n  \}\n",
              r"\n  \.ftp-capability-note \{\n    color: var\(--muted\);\n  \}\n",
          ]
          for pattern in capability_css:
              source, count = re.subn(pattern, '\n', source, flags=re.S)
              assert count == 1, f'capability CSS replacements: {count}'
          fixed.write_text(source)

          popup = Path('apps/extension/src/entrypoints/popup/App.svelte')
          source = popup.read_text()
          source = source.replace(
              "  import { productIdentity } from '@zeroomega-nex/core-contracts';\n",
              '',
          )
          disabled_branch = (
              "    {:else if !state?.applied.settings.quickSwitch.enabled}\n"
              "      <p class=\"settings-error\" role=\"status\">"
              "{uiText('popup.quickDisabled', locale)}</p>\n"
              "    {:else if items.length === 0}"
          )
          assert disabled_branch in source
          source = source.replace(disabled_branch, "    {:else if items.length === 0}")
          source, count = re.subn(
              r"\n    <span class=\"product-name\".*?</span\n    >",
              '',
              source,
              flags=re.S,
          )
          assert count == 1, f'popup branding replacements: {count}'
          popup.write_text(source)
          PY

      - name: Format and validate changed source
        run: |
          pnpm exec prettier --write \
            scripts/capture-original-nex-ui-evidence.mjs \
            docs/MILESTONE_8_STATUS.md \
            docs/PROJECT_PROGRESS_MODEL.md \
            apps/extension/src/entrypoints/options/App.svelte \
            apps/extension/src/entrypoints/options/FixedProfileEditor.svelte \
            apps/extension/src/entrypoints/options/main.ts \
            apps/extension/src/entrypoints/options/original-compat.css \
            apps/extension/src/entrypoints/popup/App.svelte \
            apps/extension/src/entrypoints/popup/main.ts \
            apps/extension/src/entrypoints/popup/original-compat.css \
            packages/core-contracts/src/index.ts \
            packages/profile-workflow/src/defaults.ts
          pnpm check
          pnpm lint
          git diff --check

      - name: Remove temporary migration workflows
        run: |
          rm -f .github/workflows/apply-original-ui-parity-slice.yml
          rm -f .github/workflows/export-ui-sources.yml

      - name: Commit exact migration
        run: |
          git config user.name 'ZeroOmega Nex automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: restore original entry UI structure'
          git push origin HEAD:feat/m8-profile-workflow
