name: Export Toolbar E2E Source Probe

on:
  pull_request:
    paths:
      - .github/workflows/export-toolbar-e2e-source-probe.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload toolbar E2E source files
        uses: actions/upload-artifact@v4
        with:
          name: toolbar-e2e-source-files
          path: |
            scripts/e2e-chromium-toolbar.mjs
            scripts/e2e-firefox.mjs
            .github/workflows/browser-e2e.yml
          if-no-files-found: error
