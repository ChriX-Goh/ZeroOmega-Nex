name: Format Attached Browser E2E Probe

on:
  pull_request:
    paths:
      - .github/workflows/format-attached-browser-e2e-probe.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format attached browser E2E files
        run: |
          pnpm exec prettier --write \
            scripts/e2e-chromium-attached-rule-list-toolbar.mjs \
            scripts/e2e-firefox-attached-rule-list-toolbar.mjs \
            package.json \
            .github/workflows/browser-e2e.yml

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-attached-browser-e2e-files
          path: |
            scripts/e2e-chromium-attached-rule-list-toolbar.mjs
            scripts/e2e-firefox-attached-rule-list-toolbar.mjs
            package.json
            .github/workflows/browser-e2e.yml
          if-no-files-found: error
