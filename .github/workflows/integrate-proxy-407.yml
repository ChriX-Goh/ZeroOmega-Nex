name: Integrate real proxy 407

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-proxy-407.yml
      - .github/patches/apply-proxy-407-core.py
      - .github/patches/apply-proxy-407-e2e.py
      - .github/patches/apply-proxy-407-docs.py
      - .github/patches/fix-proxy-407-validator.py
      - .github/patches/fix-proxy-407-types.py
      - .github/patches/fix-proxy-407-target-sentinel.py

permissions:
  contents: write

concurrency:
  group: integrate-proxy-407-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply proxy 407 slice
        run: |
          set -o pipefail
          {
            python .github/patches/apply-proxy-407-core.py
            python .github/patches/apply-proxy-407-e2e.py
            python .github/patches/apply-proxy-407-docs.py
            python .github/patches/fix-proxy-407-validator.py
            python .github/patches/fix-proxy-407-types.py
            python .github/patches/fix-proxy-407-target-sentinel.py
          } 2>&1 | tee proxy-407-apply.log

      - name: Format and refresh locale inventory
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee proxy-407-format.log
          pnpm locale:inventory 2>&1 | tee proxy-407-inventory.log
          pnpm exec prettier --write docs/LOCALE_INVENTORY.json

      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee proxy-407-verify.log

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Chromium E2E candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium

      - name: Run Chromium real proxy challenge
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee proxy-407-chromium.log

      - name: Show Firefox version
        run: firefox --version

      - name: Build Firefox optional-permission candidate
        run: pnpm build:firefox

      - name: Run Firefox real proxy challenge
        run: |
          set -o pipefail
          pnpm test:e2e:firefox 2>&1 | tee proxy-407-firefox.log

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-407-${{ github.run_id }}
          path: proxy-407-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-proxy-407.yml
          rm -f \
            .github/patches/apply-proxy-407-core.py \
            .github/patches/apply-proxy-407-e2e.py \
            .github/patches/apply-proxy-407-docs.py \
            .github/patches/fix-proxy-407-validator.py \
            .github/patches/fix-proxy-407-types.py \
            .github/patches/fix-proxy-407-target-sentinel.py \
            proxy-407-apply.log \
            proxy-407-format.log \
            proxy-407-inventory.log \
            proxy-407-verify.log \
            proxy-407-chromium.log \
            proxy-407-firefox.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: verify real proxy 407 authentication"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
