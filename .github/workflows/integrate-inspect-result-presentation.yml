name: Integrate Inspect result presentation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-inspect-result-presentation.yml

permissions:
  contents: write

concurrency:
  group: integrate-inspect-result-presentation-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Apply Inspect result presentation
        env:
          INTEGRATION_RUN_ID: ${{ github.run_id }}
        run: python .github/patches/apply-inspect-result-presentation.py
      - name: Install and update locked workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format product slice
        run: pnpm format
      - name: Verify repository
        run: pnpm verify
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E host candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium regression suite
        run: pnpm test:e2e:chromium
      - name: Commit verified product slice
        run: |
          rm -f \
            .github/patches/apply-inspect-result-presentation.py \
            .github/workflows/integrate-inspect-result-presentation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: evaluate Inspect result presentation"
          git push origin HEAD:feat/m8-profile-workflow
