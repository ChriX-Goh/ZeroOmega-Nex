name: Integrate native Inspect E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-inspect-native-e2e.yml

permissions:
  contents: write

concurrency:
  group: integrate-inspect-native-e2e-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Apply permanent native Inspect E2E
        env:
          INTEGRATION_RUN_ID: ${{ github.run_id }}
        run: |
          python .github/patches/normalize-inspect-native-doc-anchors.py
          python .github/patches/promote-inspect-native-e2e.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format product slice
        run: pnpm format
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee inspect-native-integration-verify.log
      - name: Install Playwright Chromium and native UI tools
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 scrot xauth xdotool xvfb
      - name: Build Chromium E2E host candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium regression suite
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee inspect-native-integration-chromium.log
      - name: Run native Inspect context-menu E2E
        shell: bash
        run: |
          set -o pipefail
          dbus-run-session -- bash -lc '
            xvfb-run -a -s "-screen 0 1280x800x24 -ac +extension RANDR" \
              pnpm test:e2e:inspect-native
          ' 2>&1 | tee inspect-native-integration-menu.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-native-integration-${{ github.run_id }}
          path: |
            inspect-native-integration-*.log
            inspect-native-menu-before.png
            inspect-native-menu-failure.png
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          rm -f \
            .github/patches/normalize-inspect-native-doc-anchors.py \
            .github/patches/promote-inspect-native-e2e.py \
            .github/workflows/integrate-inspect-native-e2e.yml \
            .github/workflows/probe-inspect-native-menu.yml \
            scripts/probe-inspect-native-menu.mjs \
            scripts/probe-inspect-native-menu-atspi.py \
            inspect-native-integration-verify.log \
            inspect-native-integration-chromium.log \
            inspect-native-integration-menu.log \
            inspect-native-menu-before.png \
            inspect-native-menu-failure.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: verify native Inspect context menu"
          git push origin HEAD:feat/m8-profile-workflow
