name: Research MIG-01.7 Browser Patch

on:
  push:
    branches:
      - research/mig01-semantic-consolidation
    paths:
      - '.github/workflows/research-mig01-semantic-browser-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mig01-semantic-consolidation
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply browser evidence patch
        run: node scripts/research-patch-mig01-semantic-browser.mjs
      - name: Format patched files
        run: |
          pnpm exec prettier --write \
            scripts/e2e-chromium-original-migration.mjs \
            scripts/e2e-firefox-original-migration.mjs \
            scripts/e2e-chromium-original-large-migration.mjs \
            scripts/e2e-firefox-original-large-migration.mjs \
            scripts/mig01-semantic-evidence.mjs \
            scripts/validate-mig01-semantic-evidence.mjs
          pnpm exec prettier --check \
            scripts/e2e-chromium-original-migration.mjs \
            scripts/e2e-firefox-original-migration.mjs \
            scripts/e2e-chromium-original-large-migration.mjs \
            scripts/e2e-firefox-original-large-migration.mjs \
            scripts/mig01-semantic-evidence.mjs \
            scripts/validate-mig01-semantic-evidence.mjs
      - name: Commit browser evidence patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/e2e-chromium-original-migration.mjs \
            scripts/e2e-firefox-original-migration.mjs \
            scripts/e2e-chromium-original-large-migration.mjs \
            scripts/e2e-firefox-original-large-migration.mjs \
            scripts/mig01-semantic-evidence.mjs \
            scripts/validate-mig01-semantic-evidence.mjs
          git diff --cached --check
          git commit -m 'research: wire browser semantic evidence'
          git push origin HEAD:research/mig01-semantic-consolidation
