name: Integrate Popup external profile import

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-popup-external-profile.yml

permissions:
  contents: write

concurrency:
  group: integrate-popup-external-profile-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Apply reviewed external-profile slice
        id: apply_slice
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python .github/patches/apply-popup-external-profile-core.py
            python .github/patches/apply-popup-external-profile-command.py
            python .github/patches/apply-popup-external-profile-runtime.py
            python .github/patches/apply-popup-external-profile-ui.py
            python .github/patches/apply-popup-external-profile-evidence.py
          } 2>&1 | tee /tmp/popup-external-profile-apply.log
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-external-profile-apply
          path: /tmp/popup-external-profile-apply.log
          if-no-files-found: warn
      - name: Enforce patch result
        if: steps.apply_slice.outcome != 'success'
        run: exit 1
      - name: Install locked dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/popup-external-profile-install.log
      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-external-profile-install
          path: /tmp/popup-external-profile-install.log
          if-no-files-found: warn
      - name: Enforce install result
        if: steps.install.outcome != 'success'
        run: exit 1
      - name: Format and inspect product diff
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm exec prettier --write \
              packages/browser-adapters/src/external-profile.ts \
              packages/browser-adapters/src/external-profile.test.ts \
              packages/browser-adapters/src/index.ts \
              packages/profile-workflow/src/external-profile.ts \
              packages/profile-workflow/src/external-profile.test.ts \
              packages/profile-workflow/src/external-profile-command.test.ts \
              packages/profile-workflow/src/index.ts \
              packages/profile-workflow/src/commands.ts \
              apps/extension/src/lib/profile-workflow-runtime.ts \
              apps/extension/src/lib/proxy-ownership-client.ts \
              apps/extension/src/lib/proxy-ownership-runtime.ts \
              apps/extension/src/entrypoints/popup/App.svelte \
              apps/extension/src/entrypoints/popup/style.css \
              apps/extension/src/lib/i18n.ts \
              scripts/e2e-chromium.mjs \
              scripts/validate-ui-compatibility.mjs \
              docs/ORIGINAL_KNOWLEDGE_GRAPH.md \
              docs/UI_AUDIT_MATRIX.md \
              docs/MILESTONE_8_STATUS.md
            git diff --check
          } 2>&1 | tee /tmp/popup-external-profile-format.log
      - name: Upload format diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-external-profile-format
          path: /tmp/popup-external-profile-format.log
          if-no-files-found: warn
      - name: Enforce format result
        if: steps.format.outcome != 'success'
        run: exit 1
      - name: Verify complete repository
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee /tmp/popup-external-profile-verify.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-external-profile-verification
          path: /tmp/popup-external-profile-verify.log
          if-no-files-found: warn
      - name: Enforce verification result
        if: steps.verify.outcome != 'success'
        run: exit 1
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Chromium external-profile E2E
        id: chromium
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ZEROOMEGA_RULE_SOURCE_E2E=1 pnpm build:chromium
          pnpm test:e2e:chromium 2>&1 | tee /tmp/popup-external-profile-chromium.log
      - name: Upload Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-external-profile-chromium
          path: /tmp/popup-external-profile-chromium.log
          if-no-files-found: warn
      - name: Enforce Chromium result
        if: steps.chromium.outcome != 'success'
        run: exit 1
      - name: Clean temporary integration files
        run: |
          rm -rf browser-builds browser-builds.tar.gz
          git clean -fdX
          rm -rf .github/patches
          rm -f .github/workflows/integrate-popup-external-profile.yml
          git diff --check
      - name: Commit verified product slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/m8-profile-workflow
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/m8-profile-workflow)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m 'feat: import external proxy profiles from Popup'
          git push origin HEAD:feat/m8-profile-workflow
