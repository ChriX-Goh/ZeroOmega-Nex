name: Apply original initial route

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-original-initial-route.yml
      - scripts/apply-original-initial-route.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply and verify
        run: |
          python scripts/apply-original-initial-route.py
          pnpm exec prettier --write \
            packages/profile-workflow/src/commands.ts \
            packages/profile-workflow/src/commands.test.ts \
            packages/profile-workflow/src/commands-quick-switch.test.ts \
            apps/extension/src/lib/profile-workflow-runtime.ts \
            apps/extension/src/lib/profile-workflow-runtime.test.ts
          pnpm verify
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/profile-workflow/src/commands.ts \
            packages/profile-workflow/src/commands.test.ts \
            packages/profile-workflow/src/commands-quick-switch.test.ts \
            apps/extension/src/lib/profile-workflow-runtime.ts \
            apps/extension/src/lib/profile-workflow-runtime.test.ts
          git commit -m 'fix: restore original System startup route'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
