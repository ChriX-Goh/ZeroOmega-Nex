name: M4 final importer security fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/m4-zeroomega-importer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m4-zeroomega-importer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve username and test full base64 import
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
          python - <<'PY'
          from pathlib import Path

          importer = Path('packages/legacy-zeroomega/src/import.ts')
          text = importer.read_text()
          old = '  return { passwordSecretRef: ref };'
          new = """  return {
            ...(username === undefined ? {} : { username }),
            passwordSecretRef: ref,
          };"""
          if old not in text:
              raise SystemExit('credential return block not found')
          importer.write_text(text.replace(old, new, 1))

          tests = Path('packages/legacy-zeroomega/src/import.test.ts')
          text = tests.read_text()
          anchor = "  it('maps all twelve condition families and preserves switch-rule order', async () => {"
          test = """  it('imports a base64-encoded backup through the full migration pipeline', async () => {
            const source = await fixture('minimal-profile-types.json');
            const result = importZeroOmegaBackup(btoa(source), context);
            expect(result.ok).toBe(true);
            if (!result.ok) throw new Error(JSON.stringify(result.report, null, 2));
            expect(result.report.encoding).toBe('base64-json');
            expect(result.candidate.profiles).toHaveLength(9);
          });

          """
          if test.strip() not in text:
              if anchor not in text:
                  raise SystemExit('base64 test anchor not found')
              text = text.replace(anchor, test + anchor)

          username_anchor = "    expect(result.secretMaterials.some((item) => item.kind === 'request-header')).toBe(true);"
          username_check = """    expect(
              result.candidate.proxyEndpoints.some(
                (endpoint) => endpoint.credential?.username === 'proxy-user',
              ),
            ).toBe(true);"""
          if username_check.strip() not in text:
              if username_anchor not in text:
                  raise SystemExit('credential test anchor not found')
              text = text.replace(username_anchor, username_anchor + '\n' + username_check)
          tests.write_text(text)
          PY
          pnpm exec prettier --write \
            packages/legacy-zeroomega/src/import.ts \
            packages/legacy-zeroomega/src/import.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/legacy-zeroomega
          git commit -m "fix(import): preserve proxy usernames and verify base64 pipeline"
          git push origin HEAD:feat/m4-zeroomega-importer
