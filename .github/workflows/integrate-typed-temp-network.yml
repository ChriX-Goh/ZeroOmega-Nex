name: Integrate typed Temporary Rules and Network

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-typed-temp-network.yml
      - .github/patches/*typed-temp-network*.py

permissions:
  contents: write

concurrency:
  group: integrate-typed-temp-network-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply typed Temporary Rules and Network slice
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/write-typed-temp-network-pages.py
            python .github/patches/patch-typed-temp-network-locale.py
            python .github/patches/patch-typed-temp-network-e2e-docs.py
          } 2>&1 | tee typed-temp-network-apply.log
      - name: Format product slice
        run: |
          set -o pipefail
          pnpm format 2>&1 | tee typed-temp-network-format.log
      - name: Generate locale inventory
        run: |
          set -o pipefail
          pnpm locale:inventory 2>&1 | tee typed-temp-network-inventory.log
          pnpm exec prettier --write docs/LOCALE_INVENTORY.json
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee typed-temp-network-verify.log
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Chromium E2E candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: pnpm build:chromium
      - name: Run Chromium Temporary Rules and Network regression
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee typed-temp-network-chromium.log
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typed-temp-network-${{ github.run_id }}
          path: typed-temp-network-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          git checkout HEAD -- .github/workflows/integrate-typed-temp-network.yml
          rm -f \
            .github/patches/write-typed-temp-network-pages.py \
            .github/patches/patch-typed-temp-network-locale.py \
            .github/patches/patch-typed-temp-network-e2e-docs.py \
            typed-temp-network-apply.log \
            typed-temp-network-format.log \
            typed-temp-network-inventory.log \
            typed-temp-network-verify.log \
            typed-temp-network-chromium.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add typed Temporary Rules and Network"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
