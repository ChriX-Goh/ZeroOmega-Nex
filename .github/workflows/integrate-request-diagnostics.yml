name: Integrate bounded request diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-request-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: integrate-request-diagnostics-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply bounded request diagnostics slice
        env:
          INTEGRATION_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          {
            set -x
            python .github/patches/apply-request-diagnostics-model.py
            python .github/patches/prepare-request-diagnostics-background.py
            python .github/patches/apply-request-diagnostics-runtime.py
            python .github/patches/restore-request-diagnostics-background.py
            python .github/patches/apply-request-diagnostics-settings.py
            python .github/patches/apply-request-diagnostics-ui.py
            python .github/patches/apply-request-diagnostics-hardening.py
            python .github/patches/fix-request-diagnostics-validator.py
            python .github/patches/fix-request-diagnostics-types.py
            pnpm --filter @zeroomega-nex/profile-spec generate:validator
            pnpm format
          } 2>&1 | tee integration-apply.log
      - name: Verify repository
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee integration-verify.log
      - name: Build Chromium E2E host candidate
        env:
          ZEROOMEGA_RULE_SOURCE_E2E: '1'
        run: |
          set -o pipefail
          pnpm build:chromium 2>&1 | tee integration-build.log
      - name: Run Chromium regression suite
        run: |
          set -o pipefail
          pnpm test:e2e:chromium 2>&1 | tee integration-e2e.log
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-diagnostics-integration-${{ github.run_id }}
          path: integration-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified product slice
        run: |
          rm -f \
            .github/patches/apply-request-diagnostics-model.py \
            .github/patches/prepare-request-diagnostics-background.py \
            .github/patches/apply-request-diagnostics-runtime.py \
            .github/patches/restore-request-diagnostics-background.py \
            .github/patches/apply-request-diagnostics-settings.py \
            .github/patches/apply-request-diagnostics-ui.py \
            .github/patches/apply-request-diagnostics-hardening.py \
            .github/patches/fix-request-diagnostics-validator.py \
            .github/patches/fix-request-diagnostics-types.py \
            .github/workflows/integrate-request-diagnostics.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add bounded request diagnostics"
          git push origin HEAD:feat/m8-profile-workflow
