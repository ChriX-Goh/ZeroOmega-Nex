name: Checkpoint zero-warning status

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/checkpoint-zero-warning-status.yml

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.head_ref == 'feat/m8-profile-workflow' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0
          show-progress: false
      - name: Update durable status and audit matrix
        run: python .github/patches/checkpoint-zero-warning-status.py
      - name: Commit checkpoint
        run: |
          git checkout HEAD -- .github/workflows/checkpoint-zero-warning-status.yml
          rm -f .github/patches/checkpoint-zero-warning-status.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: checkpoint zero-warning accessibility slice"
          git fetch origin feat/m8-profile-workflow
          git rebase origin/feat/m8-profile-workflow
          git push origin HEAD:feat/m8-profile-workflow
