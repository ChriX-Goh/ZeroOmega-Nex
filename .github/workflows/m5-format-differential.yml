name: M5 format differential

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/m5-reference-interpreter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m5-reference-interpreter
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@11.4.0 --activate
      - name: Format differential files and remove workflow
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            packages/reference-interpreter/src/differential.ts \
            packages/reference-interpreter/src/differential.test.ts \
            packages/reference-interpreter/src/properties.test.ts
          rm .github/workflows/m5-format-differential.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/reference-interpreter/src .github/workflows/m5-format-differential.yml
          git commit -m "style(interpreter): format differential implementation"
          git push origin HEAD:feat/m5-reference-interpreter
