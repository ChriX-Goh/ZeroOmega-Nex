name: Finalize Original UI Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/finalize-original-ui-contract.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.repository == 'ChriX-Goh/ZeroOmega-Nex' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/m8-profile-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-profile-workflow
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile

      - name: Apply verified original-derived correction
        run: |
          python scripts/apply-original-ui-contract-fixes.py
          python scripts/apply-original-default-test-fixtures.py

      - name: Format and verify exact correction
        run: |
          pnpm exec prettier --write \
            apps/extension/src/entrypoints/options/App.svelte \
            packages/profile-workflow/src/commands.ts \
            scripts/validate-parity-docs.mjs \
            apps/extension/src/component-rendering.component.spec.ts \
            scripts/e2e-chromium.mjs \
            scripts/e2e-firefox.mjs \
            scripts/capture-visual-evidence.mjs \
            apps/extension/src/lib/original-toolbar-profile-resolver.test.ts \
            apps/extension/src/lib/profile-workflow-activation.test.ts \
            apps/extension/src/lib/snapshot-rollback-runtime.test.ts \
            apps/extension/src/lib/inspect-runtime.test.ts \
            apps/extension/src/lib/profile-export.test.ts
          pnpm guard:architecture
          pnpm validate:parity-docs
          pnpm check
          pnpm test
          pnpm test:components
          pnpm lint
          git diff --check

      - name: Remove temporary migration surface
        run: |
          git show 4de1aee5c022cb1787b224c56bfcbe14160cd23e:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/apply-original-ui-contract-fixes.yml
          rm -f .github/workflows/apply-original-ui-parity-slice.yml
          rm -f .github/workflows/export-original-ui-contract-sources.yml
          rm -f .github/workflows/export-default-contract-tests.yml
          rm -f .github/workflows/export-ui-sources.yml
          rm -f .github/workflows/diagnose-original-ui-contract-fixes.yml
          rm -f .github/workflows/finalize-original-ui-contract.yml
          rm -f scripts/apply-original-ui-contract-fixes.py
          rm -f scripts/apply-original-default-test-fixtures.py

      - name: Commit verified correction
        run: |
          git config user.name 'ZeroOmega Nex automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore original-facing entry experience'
          git push origin HEAD:feat/m8-profile-workflow
