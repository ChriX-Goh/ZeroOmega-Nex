name: Commit M4 one-line type fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/m4-zeroomega-importer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m4-zeroomega-importer
      - name: Commit Weekday mask type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/legacy-zeroomega/src/import.ts')
          text = path.read_text()
          old = "days = WEEKDAYS.filter((_, index) => !['-', '_', '0'].includes(raw.days![index]!));"
          new = "const dayMask = raw.days as string;\n        days = WEEKDAYS.filter((_, index) => !['-', '_', '0'].includes(dayMask[index]!));"
          updated = text.replace(old, new, 1)
          if updated == text:
              raise SystemExit('target line not found')
          path.write_text(updated)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/legacy-zeroomega/src/import.ts
          git commit -m "fix(import): retain Weekday mask string type"
          git push origin HEAD:feat/m4-zeroomega-importer
