name: Export Knowledge Graph

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout exact pull request Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Upload current knowledge graph
        uses: actions/upload-artifact@v4
        with:
          name: current-delivery-knowledge-graph
          path: docs/ORIGINAL_NEX_DELIVERY_KNOWLEDGE_GRAPH.md
          if-no-files-found: error
